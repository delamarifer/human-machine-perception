<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adversarial perturbations</title>
<link rel="stylesheet" href="../../deck/deck.css">
<script src="../cites.js"></script>
<style>
  /* Copied for Day 2 (Fernanda, 2026-11-02) from her thesis defense: thesis-defense/scenes/
     adversarial-boxes.final-ch1-adv-vulnerability.html (2ea59d4, 2026-10-16). Day 2 changes: this deck's
     stylesheet, assets in ../assets/adversarial/, notes handed to the presenter, the deck drives clicks
     and keys (no double advance), citations collapse (cites.js). Everything else is hers, unchanged.
     Original header: DRAFT (2026-10-15): the adversarial half of "Neural networks are known to show discrepancies with
     humans" (outline/parts/ch1-adv-vulnerability.js) re-animated in the box layout of slide 9
     (scenes/mms-logic.html). Not wired into the deck. Mirrors deck.css .stage / h1.t. */
  :root{ --ink:#0f172a; --border:#e2e8f0; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:#fff; color:var(--ink);
             font-family:'Deck Calibri', Calibri, Carlito, 'Helvetica Neue', Arial, sans-serif;
             font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
             cursor:pointer; user-select:none; -webkit-user-select:none; }
  .stage{ position:absolute; inset:0; padding:9vh 6vw 7vh; display:flex; flex-direction:column; }
  h1.t{ font-family:'Deck Calibri', Calibri, Carlito, 'Helvetica Neue', Arial, sans-serif; font-weight:700; color:var(--ink);
        font-size:clamp(1.8rem, 3.5vw, 3rem); line-height:1.08; letter-spacing:0; margin-bottom:1.2rem; }
  #cite{ position:absolute; left:6vw; bottom:2.4vh; opacity:0; transition:opacity .6s ease; }
  #cite.on{ opacity:1; }
  #cite.jump{ transition:none; }
  #figwrap{ flex:1 1 auto; min-height:0; position:relative; }
  #cv{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  /* the closing statement over the dimmed figure (.popquote, outline/type.css) */
  #pop{ position:absolute; left:50%; top:50%; width:min(26em, 92%); transform:translate(-50%, calc(-50% + 14px));
        text-align:center; opacity:0; pointer-events:none; background:rgba(255,255,255,.92); padding:.5em .8em; border-radius:16px; transition:opacity .9s ease, transform .9s ease; }
  #pop.on{ opacity:1; transform:translate(-50%, -50%); }
  #pop.jump{ transition:none; }
  /* Fer 2026-10-16: the two lines come in one after the other */
  #pop .pl{ display:inline-block; opacity:0; transform:translateY(10px); transition:opacity .6s ease, transform .6s ease; }
  #pop.on .pl1{ opacity:1; transform:none; transition-delay:.15s; }
  #pop.on .pl2{ opacity:1; transform:none; transition-delay:1.8s; }
  #pop.jump .pl{ transition:none; }
  /* play buttons (onclick only; they never autoplay and never advance the slide) */
  .play{ position:absolute; width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%; border:0;
         background:rgba(15,23,42,.85); cursor:pointer; opacity:0; pointer-events:none; }
  .play::after{ content:''; position:absolute; left:13px; top:9px; border-style:solid; border-width:8px 0 8px 13px;
                border-color:transparent transparent transparent #fff; }
  footer{ position:absolute; right:2rem; bottom:1.1rem; }
  .play{ display:none !important; }   /* Fer 2026-10-16: the director/center sounds are not playable */
  #dots{ display:flex; gap:.45rem; }
  .dot{ width:8px; height:8px; border-radius:50%; background:#fff; border:1.5px solid #cbd5e1; }
  .dot.on{ background:var(--ink); border-color:var(--ink); }
  #notes{ position:absolute; left:0; right:0; bottom:0; background:rgba(255,255,255,.965);
          border-top:1px solid var(--border); padding:16px 4% 18px; display:none;
          font-size:clamp(13px,1.15vw,16px); line-height:1.6; pointer-events:none; }
  #notes.on{ display:block; }
</style>

<body>
  <div class="stage">
    <h1 class="t">One discrepancy is vulnerability to small changes in the input</h1>
    <div id="figwrap">
      <canvas id="cv"></canvas>
      <button class="play" id="play0" aria-label="Play the original sound"></button>
      <button class="play" id="play1" aria-label="Play the perturbed sound"></button>
      <div class="popquote" id="pop"><span class="pl pl1">Tiny changes to the input change the model’s behavior.</span><br><span class="pl pl2">Importantly, these changes do not impact human behavior.</span></div>
    </div>
  </div>
  <div class="cite" id="cite">Szegedy et al., 2013; Goodfellow et al., 2015</div>
  <footer><div id="dots"></div></footer>
  <div id="notes"></div>
<script>
// ═══ ADVERSARIAL PERTURBATIONS (draft, box layout of slide 9) ═════════════════════════
// Boxes, top to bottom: the stimuli row (original | perturbation | perturbed, all the SAME size, with + and =)
// → "Input stimuli" → the system box ("Model": the network, read out at its output) → out of its right side to the
// "Decision" column (original, then perturbed). Box names on the left; the bottom stays free. Then the image row and the decisions swipe out and the sound
// comes in; the arrows, the input box and the model stay put.
//
//  0 title                                   6 swap: the images swipe out, the sound "director" swipes in
//  1 the panda                               7 the sound through the model → "director"
//  2 panda → Input stimuli → model → "panda" 8 + its perturbation (same size)
//  3 + the perturbation (same size)          9 = the perturbed sound; "People still hear “director”"
//  4 = the perturbed image; "Humans still see a panda"     10 the perturbed sound through the model → "center"
//  5 the perturbed image through the model → "gibbon"     11 the figure dims: "Tiny changes to the input change the model’s behavior."
//
// Words are black; marks in neutral grays (teal and purple are kept for the standard and robust networks later).

const SLIDE_NAME = 'adversarialBoxes';
const A = '../assets/adversarial/';

const SCRIPT = [   // presenter transcript, one passage per click (Fer's wording, from ch1-adv-vulnerability.js)
  'Neural networks are known to show discrepancies with humans. Let me give you two examples of these discrepancies. The first is adversarial perturbations.',
  'Start from this panda image.',
  'Suppose we have a network from before: given this image, it recognizes the object as a panda. The network classifies it correctly.',
  'An adversarial perturbation is a small change to the input, optimized to change the network\'s decision. Here it is scaled to 0.007, about one step of an 8-bit image; it is shown at the same size as the image, amplified so you can see it. It is simply added, pixel by pixel.',
  'Added to the image, it is imperceptible; humans still see a panda.',
  'But the network goes from correct classification to saying it is a "gibbon," with high confidence. (Szegedy et al., 2013; Goodfellow et al., 2015)',
  'The same holds for audio. Here is a recording of a spoken word, shown as a cochleagram.',
  'A different network of the same kind correctly recognizes the word "director".',
  'We add a perturbation optimized in the same way, about 56 dB below the speech. Again it is shown amplified so you can see it.',
  'Added to the sound, it is imperceptible: people still hear "director".',
  'But the network now says "center". This is adversarial vulnerability: the model is highly sensitive to changes in the input that humans can\'t perceive. These oddities are not specific to one architecture; they show up across many kinds of networks.',
  'So the first discrepancy: tiny changes to the input change the model\'s behavior.',
];
const N = SCRIPT.length;

// ── the state of the figure at each click (all 0…1) ──
const ST = [];
{
  let s = {i0:0, fA0:0, model:0, wA0:0, i1:0, i2:0, humA:0, fA1:0, wA1:0, swap:0,
           fB0:0, wB0:0, s1:0, s2:0, humB:0, fB1:0, wB1:0, dim:0};
  // the spotlight (Fer, 2026-10-16): what each click talks about is at full strength, the rest grayed out
  const FK = ['fOrig', 'fPert', 'fAdv', 'fMod', 'fD0', 'fD1'];
  const ALL = {}; FK.forEach(k => ALL[k] = 1); s = {...s, ...ALL};
  const ONLY = (...ks) => { const o = {}; FK.forEach(k => o[k] = ks.includes(k) ? 1 : 0); return o; };
  const at = o => { s = {...s, ...o}; ST.push(s); };
  at({});                                   //  0 title
  at({i0:1});                               //  1 the panda
  at({fA0:1, model:1, wA0:1, ...ONLY('fOrig', 'fMod', 'fD0')});              //  2 through the model → "panda"
  at({i1:1, ...ONLY('fOrig', 'fPert')});                               //  3 + the perturbation
  at({i2:1, humA:1, ...ONLY('fAdv')});                       //  4 = the perturbed image; humans still see a panda
  at({fA1:1, wA1:1, ...ONLY('fAdv', 'fMod', 'fD1')});                       //  5 through the model → "gibbon"
  at({swap:1, ...ONLY('fOrig')});                             //  6 the sound comes in
  at({fB0:1, wB0:1, ...ONLY('fOrig', 'fMod', 'fD0')});                       //  7 → "director"
  at({s1:1, ...ONLY('fOrig', 'fPert')});                               //  8 + its perturbation
  at({s2:1, humB:1, ...ONLY('fAdv')});                       //  9 = the perturbed sound; people still hear "director"
  at({fB1:1, wB1:1, ...ONLY('fAdv', 'fMod', 'fD1')});                       // 10 → "center"
  at({dim:1, ...ALL});                              // 11 closing statement
}
const CITE_FROM = 5, POP_AT = 11;
// per-property timing on the click that changes it: [delay, duration] in s
const TIMING = {fA0:[.2, 3.6], fA1:[.2, 3.6], fB0:[.2, 3.6], fB1:[.2, 3.6], model:[1.6, .8],
                wA0:[3.7, .9], wA1:[3.7, .9], wB0:[3.7, .9], wB1:[3.7, .9],
                i1:[0, 1.0], s1:[0, 1.0], i2:[0, 1.0], s2:[0, 1.0], humA:[1.2, .9], humB:[1.2, .9],
                swap:[0, 1.6], dim:[0, .9]};
['fOrig', 'fPert', 'fAdv', 'fMod', 'fD0', 'fD1'].forEach(k => TIMING[k] = [0, .9]);
const DUR = [0, 1.0];

// ── layout, in figure units (FW × FH, letterboxed into #figwrap) ──
// slide 9's frame and coordinates (outline/contracts/box-layout.md)
const FW = 1400, FH = 822;
const CX = 700, COLX = [380, 1020];                       // the two columns; the perturbation sits between them
const TILE_Y = 84, TL_Y = 16;                             // the inputs row (slide 9: inputs at y 84, labels at y 16)
const IMG_S = 100, COCH = [180, 100];                     // tile sizes: every tile in a row the same size, as large as fits above the input box
const OP_X = [540, 860];                                  // + and =
const HUM_X = [COLX[1] + IMG_S/2 + 22, COLX[1] + COCH[0]/2 + 22];   // "still see / hear", right of the perturbed tile
const FEED_Y = 146;                                       // where the feeds leave the row
const INBOX = [CX, 186, 184, 40];                         // "Input stimuli"
const SYSB = [276, 236, 1124, 392];                       // the system box (the model)
// Fer, 2026-10-15 (shared layout): the decision comes out of the model box's RIGHT side, to a "Decision" column
// beside it (original on the first line, perturbed on the second); the bottom is kept free. Box names on the LEFT.
const NAME_X = SYSB[0] - 18;
const FORK_X = SYSB[2] + 18, DEC_X = SYSB[2] + 50;         // the read-out forks just outside the box, then the words
const DEC_Y = [270, 362];                                  // the two decisions (word, and which input it came from)
const LU = f => LABEL_PX()*f/K;                            // a text offset in figure units that keeps its on-screen size
const MID_Y = 316;                                        // the network's centre line
const D3 = 10, GAP = 3;
const NET = [{x:462, n:1, w:16, h:100}, {x:504, n:3, w:12, h:88}, {x:584, n:4, w:16, h:74},
             {x:694, n:5, w:18, h:58}, {x:834, n:3, w:22, h:44}];
const OUTN = {x:952, w:22, h:30};                         // the output stage: the decision is read out here
const gEnd = g => g.x + g.n*(g.w + GAP) - GAP + D3;
const IN_X = NET[0].x - 6;
const OUT_CX = OUTN.x + OUTN.w/2;

const NATC = [30, 41, 59], MMC = [148, 163, 184], SLATE = [71, 85, 105];

// ── canvas, sizing ──
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const wrap = document.getElementById('figwrap');
let W = 0, H = 0, K = 1, OX = 0, OY = 0;
function resize(){
  const dpr = window.devicePixelRatio || 1;
  W = wrap.clientWidth; H = wrap.clientHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  K = Math.min(W/FW, H/FH); OX = (W - FW*K)/2; OY = (H - FH*K)/2;
}
addEventListener('resize', resize);
resize();
const X = x => OX + x*K, Y = y => OY + y*K, S = v => v*K;

const IM = {};
let loaded = 0;
const NAMES = {panda:'adv-panda.png', pdelta:'adv-panda-delta.png', padv:'adv-panda-gibbon.png',   /* Fer 2026-10-16: back to Goodfellow et al. (2015)'s panda -> gibbon */
               coch:'adv-std2-coch-clean.png', cdelta:'adv-std2-coch-delta.png', cadv:'adv-std2-coch-adv.png'};
Object.entries(NAMES).forEach(([k, f]) => { const im = new Image(); im.onload = () => loaded++; im.src = A + f; IM[k] = im; });
const ready = () => loaded === Object.keys(NAMES).length;

// ── audio: play buttons, onclick only (same WebAudio pattern as the current slide) ──
const SND = [A + 'adv-std2-clean.wav', A + 'adv-std2-adv.wav'];
function playClip(u){
  const Wn = window, C = Wn.__advAC || (Wn.__advAC = new (Wn.AudioContext || Wn.webkitAudioContext)()); C.resume();
  try{ Wn.__advSrc && Wn.__advSrc.stop(); }catch(e){}
  Wn.__advBuf = Wn.__advBuf || {};
  const go = b => { const n = C.createBufferSource(); n.buffer = b; n.connect(C.destination); n.start(0); Wn.__advSrc = n; };
  if(Wn.__advBuf[u]) go(Wn.__advBuf[u]);
  else fetch(u).then(r => r.arrayBuffer()).then(a => new Promise((ok, no) => C.decodeAudioData(a, ok, no))).then(b => { Wn.__advBuf[u] = b; go(b); });
}
const playEl = [document.getElementById('play0'), document.getElementById('play1')];
playEl.forEach((b, i) => { b.onclick = e => { e.stopPropagation(); playClip(SND[i]); }; });

// ── state ──
let beat = 0, beatT0 = performance.now(), jumped = true;
const dotsEl = document.getElementById('dots'), notesEl = document.getElementById('notes');
const citeEl = document.getElementById('cite'), popEl = document.getElementById('pop');
for(let i = 0; i < N; i++){ const d = document.createElement('div'); d.className = 'dot'; dotsEl.appendChild(d); }
function render(jump){
  jumped = jump; beatT0 = performance.now();
  [...dotsEl.children].forEach((d, i) => d.classList.toggle('on', i <= beat));
  notesEl.innerHTML = SCRIPT[beat];
  citeEl.classList.toggle('jump', jump); citeEl.classList.toggle('on', beat >= CITE_FROM);
  popEl.classList.toggle('jump', jump); popEl.classList.toggle('on', beat >= POP_AT);
}
function advance(){ if(beat < N-1){ beat++; render(false); } }
function back(){ if(beat > 0){ beat--; render(true); } }
function jump(i){ beat = Math.max(0, Math.min(N-1, i)); render(true); }
window[SLIDE_NAME] = { advance, back, atStart:() => beat === 0, atEnd:() => beat === N-1,
                       reset:() => jump(0), resetToEnd:() => jump(N-1),
                       getBeat:() => beat, count:() => N, setBeat:jump, notes: SCRIPT };
if(window.parent === window){   // standalone only: inside the deck, the deck drives clicks and keys
addEventListener('click', advance);
addEventListener('keydown', e => {
  if(['ArrowRight',' ','Enter'].includes(e.key)){ e.preventDefault(); advance(); }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); back(); }
  else if(e.key === 'n' || e.key === 'N') notesEl.classList.toggle('on');
  else if(e.key === 'r' || e.key === 'R') jump(0);
});
}
collapseCites(document);
render(true);
{ const b0 = +new URLSearchParams(location.search).get('beat'); if(b0) jump(b0); }   // ?beat=N (thumbnails)

// ── helpers (from scenes/mms-logic.html) ──
const clamp01 = v => Math.max(0, Math.min(1, v));
const sstep = t => t*t*(3 - 2*t);
const lerp = (a, b, u) => a + (b - a)*u;
const rgba = (c, a) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
let T = 0;
function v(k){
  const cur = ST[beat][k], prev = beat > 0 ? ST[beat - 1][k] : cur;
  if(jumped || prev === cur) return cur;
  const [d0, d] = TIMING[k] || DUR;
  return lerp(prev, cur, sstep(clamp01((T - d0)/d)));
}
const startsNow = k => !jumped && beat > 0 && ST[beat][k] === 1 && ST[beat - 1][k] === 0;
const LABEL_PX = () => Math.min(25.6, Math.max(20, innerWidth*.017));   // .label, clamp(1.25rem, 1.7vw, 1.6rem)
function label(text, x, y, a, {head = false, align = 'center', bold = false, size = 1} = {}){
  if(a <= .01) return;
  const px = LABEL_PX()*(head ? 1.25 : 1)*size, lines = text.split('\n');
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = '#0f172a'; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.font = `${bold ? 700 : 400} ${px}px "Deck Calibri", Calibri, Carlito, sans-serif`;
  lines.forEach((l, i) => ctx.fillText(l, X(x), Y(y) + (i - (lines.length - 1)/2)*px*1.15));
  ctx.restore();
}
function glow(x, y, r, c, a){
  if(a <= .01) return;
  const g = ctx.createRadialGradient(X(x), Y(y), 0, X(x), Y(y), S(r));
  g.addColorStop(0, rgba(c, a)); g.addColorStop(.4, rgba(c, a*.55)); g.addColorStop(1, rgba(c, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(X(x), Y(y), S(r), 0, 7); ctx.fill();
}
function arrow(x0, y0, x1, y1, a, c = SLATE, w = 2.6){
  if(a <= .01) return;
  const ang = Math.atan2(y1 - y0, x1 - x0), hl = 12;
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = rgba(c, 1); ctx.fillStyle = rgba(c, 1); ctx.lineWidth = Math.max(1.5, S(w));
  ctx.beginPath(); ctx.moveTo(X(x0), Y(y0)); ctx.lineTo(X(x1 - Math.cos(ang)*hl*.8), Y(y1 - Math.sin(ang)*hl*.8)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(X(x1), Y(y1));
  ctx.lineTo(X(x1 - hl*Math.cos(ang - .45)), Y(y1 - hl*Math.sin(ang - .45)));
  ctx.lineTo(X(x1 - hl*Math.cos(ang + .45)), Y(y1 - hl*Math.sin(ang + .45))); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function rrect(x0, y0, x1, y1, r){ ctx.beginPath(); ctx.roundRect(X(x0), Y(y0), S(x1 - x0), S(y1 - y0), S(r)); }
const pathLen = P => P.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - P[i][0], p[1] - P[i][1]), 0);
function rise(a, f){ if(a <= .01) return; ctx.save(); ctx.translate(0, S(12*(1 - a))); f(); ctx.restore(); }
function polyArrow(P, a, c = SLATE, w = 2.6, prog = 1, head = true){
  if(a <= .01 || prog <= .005) return;
  const end = P.length - 1, L = pathLen(P); let left = prog*L;
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = rgba(c, 1); ctx.lineWidth = Math.max(1.5, S(w)); ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(X(P[0][0]), Y(P[0][1]));
  for(let i = 1; i <= end && left > 0; i++){
    const sl = Math.hypot(P[i][0] - P[i-1][0], P[i][1] - P[i-1][1]) || 1;
    const g = Math.min(Math.min(1, left/sl), i === end && head ? 1 - 10/sl : 1);
    ctx.lineTo(X(lerp(P[i-1][0], P[i][0], g)), Y(lerp(P[i-1][1], P[i][1], g))); left -= sl;
  }
  ctx.stroke(); ctx.restore();
  if(head && prog > .97) arrow(lerp(P[end-1][0], P[end][0], .5), lerp(P[end-1][1], P[end][1], .5), P[end][0], P[end][1],
                       a*clamp01((prog - .97)/.03), c, w);
}
function along(P, u){
  const L = [0]; for(let i = 1; i < P.length; i++) L.push(L[i - 1] + Math.hypot(P[i][0] - P[i-1][0], P[i][1] - P[i-1][1]));
  let d = u*L[L.length - 1], i = 1; while(i < P.length - 1 && d > L[i]) i++;
  const f = (d - L[i - 1])/(L[i] - L[i - 1] || 1);
  return [lerp(P[i-1][0], P[i][0], f), lerp(P[i-1][1], P[i][1], f)];
}
function spark(x, y, c){ glow(x, y, 26, c, .55); ctx.fillStyle = rgba(c, .95); ctx.beginPath(); ctx.arc(X(x), Y(y), Math.max(2.5, S(6)), 0, 7); ctx.fill(); }
function box3d(x, y, w, h, fill, side, stroke){
  const P = pts => { ctx.beginPath(); pts.forEach(([px, py], i) => i ? ctx.lineTo(X(px), Y(py)) : ctx.moveTo(X(px), Y(py))); ctx.closePath(); };
  ctx.lineWidth = Math.max(1.2, S(2)); ctx.strokeStyle = stroke;
  P([[x, y], [x + D3, y - D3], [x + w + D3, y - D3], [x + w, y]]); ctx.fillStyle = side; ctx.fill(); ctx.stroke();
  P([[x + w, y], [x + w + D3, y - D3], [x + w + D3, y + h - D3], [x + w, y + h]]); ctx.fillStyle = side; ctx.fill(); ctx.stroke();
  ctx.fillStyle = fill; ctx.fillRect(X(x), Y(y), S(w), S(h)); ctx.strokeRect(X(x), Y(y), S(w), S(h));
}
// the network, as on slide 9, but every stage is used: it is read out at its output stage (the decision)
function network(ga){                               // ga(i): block i's entrance (i = NET.length: the output stage)
  NET.forEach((g, i) => {
    const a = ga(i); if(a <= .01) return;
    ctx.save(); ctx.globalAlpha *= a; ctx.translate(0, S(10*(1 - a)));
    for(let k = 0; k < g.n; k++) box3d(g.x + k*(g.w + GAP), MID_Y - g.h/2 + D3/2, g.w, g.h, '#f8fafc', '#e2e8f0', '#94a3b8');
    arrow(gEnd(g) + 4, MID_Y, (i < NET.length - 1 ? NET[i + 1].x : OUTN.x) - 5, MID_Y, 1, [100, 116, 139], 2.2);
    ctx.restore();
  });
  const a = ga(NET.length); if(a <= .01) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(0, S(10*(1 - a)));
  box3d(OUTN.x, MID_Y - OUTN.h/2 + D3/2, OUTN.w, OUTN.h, '#e8eef6', '#cbd5e1', rgba(SLATE, 1));
  ctx.restore();
}
function boxOut(b, a, r = 14){ if(a <= .01 || true) return;   /* Fer 2026-10-16: no box outlines (Model / Responses / metric); try it */
  rise(a, () => { ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = rgba(SLATE, 1); ctx.lineWidth = Math.max(1.5, S(3));
    rrect(...b, r); ctx.stroke(); ctx.restore(); }); }
function tile(im, cx, cy, w, h, a){                 // a stimulus, with a thin frame
  if(a <= .01) return;
  ctx.save(); ctx.globalAlpha *= a;
  ctx.drawImage(im, X(cx - w/2), Y(cy - h/2), S(w), S(h));
  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = Math.max(1, S(1.4)); ctx.strokeRect(X(cx - w/2), Y(cy - h/2), S(w), S(h));
  ctx.restore();
}

// ── the route, in pieces (slide 9's), ending at the output stage and the two decisions ──
const IN_L = INBOX[0] - INBOX[2]/2, IN_R = INBOX[0] + INBOX[2]/2, IN_B = INBOX[1] + INBOX[3]/2;
const FEED = r => r ? [[COLX[1], FEED_Y], [COLX[1], INBOX[1]], [IN_R + 2, INBOX[1]]]
                    : [[COLX[0], FEED_Y], [COLX[0], INBOX[1]], [IN_L - 2, INBOX[1]]];
const P_ON = [[CX, IN_B], [CX, SYSB[1] - 1]];
const TOP_Y = SYSB[1] + 18;
const P_IN = [[CX, SYSB[1] + 1], [CX, TOP_Y], [430, TOP_Y], [430, MID_Y], [IN_X, MID_Y]];
const P_NET = [[IN_X, MID_Y], [OUT_CX, MID_Y]];
const P_READ = [[OUTN.x + OUTN.w + 4, MID_Y], [FORK_X, MID_Y]];                     // out through the box's right edge
const P_SPLIT = r => [[FORK_X, MID_Y], [FORK_X, DEC_Y[r]], [DEC_X - 8, DEC_Y[r]]];   // … to each decision
const PIECES = r => [FEED(r), P_ON, P_IN, P_NET, P_READ, P_SPLIT(r)];
const FLOW = r => PIECES(r).flat();
const START = r => { const ps = PIECES(r), s = []; let acc = [];
  ps.forEach(p => { s.push(pathLen([...acc, p[0]])); acc = [...acc, ...p]; }); return s; };
const STARTS = [START(0), START(1)];
const seg = (d, r, k) => clamp01((d - STARTS[r][k])/pathLen(PIECES(r)[k]));

const FOC = k => .25 + .75*v(k);                    // the spotlight: full when in focus, grayed out otherwise
const withA = (a, f) => { if(a <= .01) return; ctx.save(); ctx.globalAlpha *= a; f(); ctx.restore(); };
// ── one stimulus row (image or sound), drawn at horizontal offset dx ──
function rowOf(kind, dx){
  const img = kind === 'img', [w, h] = img ? [IMG_S, IMG_S] : COCH;
  const a0 = img ? v('i0') : 1, a1 = img ? v('i1') : v('s1'), a2 = img ? v('i2') : v('s2'), hum = img ? v('humA') : v('humB');
  ctx.save(); ctx.translate(S(dx), 0);
  withA(FOC('fOrig'), () => rise(a0, () => { label(img ? 'Image' : 'Sound', COLX[0], TL_Y, a0, {head:true});
                   tile(IM[img ? 'panda' : 'coch'], COLX[0], TILE_Y, w, h, a0); }));
  withA(FOC('fPert'), () => rise(a1, () => { label('+', OP_X[0], TILE_Y, a1, {size:2.4});
                   label('Perturbation', CX, TL_Y, a1, {head:true});
                   tile(IM[img ? 'pdelta' : 'cdelta'], CX, TILE_Y, w, h, a1); }));
  withA(FOC('fAdv'), () => { rise(a2, () => { label('=', OP_X[1], TILE_Y, a2, {size:2.4});
                   label(img ? 'Perturbed image' : 'Perturbed sound', COLX[1], TL_Y, a2, {head:true});
                   tile(IM[img ? 'padv' : 'cadv'], COLX[1], TILE_Y, w, h, a2); });
    rise(hum, () => label(img ? 'Humans still\nsee a panda' : 'People still\nhear “director”', HUM_X[img ? 0 : 1], TILE_Y, hum, {align:'left'})); });
  ctx.restore();
}
function decisions(kind, dx){
  const img = kind === 'img', w0 = img ? v('wA0') : v('wB0'), w1 = img ? v('wA1') : v('wB1');
  ctx.save(); ctx.translate(S(dx), 0);
  /* Fer 2026-10-16: less detail: just the word with a check or a cross (no "sound" / "perturbed sound" captions) */
  withA(FOC('fD0'), () => rise(w0, () => label(img ? '✓ “panda”' : '✓ “director”', DEC_X, DEC_Y[0], w0, {head:true, bold:true, align:'left'})));
  withA(FOC('fD1'), () => rise(w1, () => label(img ? '✗ “gibbon”' : '✗ “center”', DEC_X, DEC_Y[1], w1, {head:true, bold:true, align:'left'})));
  ctx.restore();
}

// ── frame ──
function frame(now){
  requestAnimationFrame(frame);
  T = (now - beatT0)/1000*2.6;   /* Fer 2026-10-16: faster flow through the boxes (all timings x2.6) */
  if(wrap.clientWidth !== W || wrap.clientHeight !== H) resize();   // the deck shows the iframe late: re-measure
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  if(!ready()) return;
  const dim = 1 - .85*v('dim'), sw = v('swap'), SW = FW;
  ctx.save(); ctx.globalAlpha = dim;

  // the flows: column 0 (original) and column 1 (perturbed), images then sounds
  const F = [[v('fA0'), v('fB0')], [v('fA1'), v('fB1')]];
  const DIST = F.map((fs, r) => Math.max(...fs)*pathLen(FLOW(r)));
  const model = v('model');

  // ── the fixed arrows and boxes ──
  [0, 1].forEach(r => polyArrow(FEED(r), FOC(r ? 'fAdv' : 'fOrig'), SLATE, 2.6, seg(DIST[r], r, 0)));
  ctx.save(); ctx.globalAlpha *= FOC('fMod');   // the model's spotlight
  const inA = clamp01((DIST[0] - pathLen(FEED(0))*.8)/(pathLen(FEED(0))*.2));
  if(inA > .01) rise(inA, () => { ctx.save(); ctx.globalAlpha *= inA;
    rrect(IN_L, INBOX[1] - INBOX[3]/2, IN_R, IN_B, 8);
    ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = rgba(SLATE, 1); ctx.lineWidth = Math.max(1.5, S(2.4)); ctx.stroke(); ctx.restore();
    label('Input stimuli', INBOX[0], INBOX[1] + 1, inA); });
  polyArrow(P_ON, 1, SLATE, 2.6, seg(DIST[0], 0, 1));
  boxOut(SYSB, seg(DIST[0], 0, 1));
  polyArrow(P_IN, 1, [100, 116, 139], 2.2, seg(DIST[0], 0, 2));
  network(i => { const x = i < NET.length ? NET[i].x : OUTN.x; return clamp01((DIST[0] - STARTS[0][3] - (x - IN_X))/50); });
  // (no "output" label: the behavior comes out of the box on the right; Fer, 2026-10-15)
  polyArrow(P_READ, 1, SLATE, 2.6, seg(DIST[0], 0, 4), false);
  // the box name on the left; "Decision" heads the column on the right
  rise(model, () => label('Model', NAME_X, MID_Y, model, {head:true, align:'right'}));
  ctx.restore();   // the model's spotlight
  const decA = seg(DIST[0], 0, 4);
  [0, 1].forEach(r => polyArrow(P_SPLIT(r), FOC(r ? 'fD1' : 'fD0'), SLATE, 2.6, seg(DIST[r], r, 5)));
  withA(Math.max(FOC('fD0'), FOC('fD1')), () => rise(decA, () => label('Decision', DEC_X, DEC_Y[0] - LU(1.7), decA, {head:true, align:'left'})));

  // ── what swipes: the stimuli row and the decisions (images out to the left, sounds in from the right) ──
  ctx.save(); ctx.beginPath();
  ctx.rect(X(0), Y(-40), S(FW), S(FEED_Y - 4 + 40));
  ctx.rect(X(DEC_X - 4), Y(DEC_Y[0] - LU(.9)), S(FW - DEC_X + 40), S(DEC_Y[1] - DEC_Y[0] + LU(2.6))); ctx.clip();
  if(sw < .999){ rowOf('img', -SW*sw); decisions('img', -SW*sw); }
  if(sw > .001){ rowOf('snd', SW*(1 - sw)); decisions('snd', SW*(1 - sw)); }
  ctx.restore();

  // the stimulus itself, travelling once on its click
  [['fA0', 0], ['fA1', 1], ['fB0', 0], ['fB1', 1]].forEach(([k, r]) => {
    if(!startsNow(k)) return; const u = v(k);
    if(u > .002 && u < .998){ const [x, y] = along(FLOW(r), u); spark(x, y, r ? MMC : NATC); } });
  ctx.restore();   // dim

  // play buttons on the sound tiles (clean: from the swap; perturbed: from its click)
  const pa = [sw*dim, v('s2')*dim];
  const px = [COLX[0] + COCH[0]/2 - 20 + SW*(1 - sw), COLX[1] + COCH[0]/2 - 20], py = TILE_Y + COCH[1]/2 - 20;
  playEl.forEach((b, i) => { b.style.left = X(px[i]) + 'px'; b.style.top = Y(py) + 'px';
    b.style.opacity = pa[i]; b.style.pointerEvents = pa[i] > .5 && beat < POP_AT ? 'auto' : 'none'; });
}
requestAnimationFrame(frame);
</script>
</body>
</html>
