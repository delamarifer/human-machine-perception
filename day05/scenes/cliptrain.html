<!DOCTYPE html>
<html lang="en">

<meta charset="utf-8">
<title>How CLIP is trained</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../deck/deck.css">
<style>
  /* Owner: Day 5, Fernanda (cliptrain scene). Pattern B. CLIP's training, in miniature and computed live:
     toy images made in code and toy captions made of words; two tiny linear encoders (image features -> 2
     numbers, word counts -> 2 numbers), each divided by its length, so both land on one circle; a symmetric
     InfoNCE loss over a batch of image and caption pairs, trained here with real gradient steps; then
     zero-shot classification of new images. After Torralba, Isola & Freeman, Foundations of Computer
     Vision, Sec. 51.3, and Radford et al., 2021. The figures are our own. */
  html, body{ background:#fff; }
  .wrap{ position:absolute; inset:0; padding:9vh 6vw 12vh; display:flex; flex-direction:column; gap:2vh; }
  .stagebox{ position:relative; flex:1 1 auto; min-height:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; }

  .dots i{ width:7px; height:7px; border-radius:50%; background:#e2e8f0; }
  .dots i.on{ background:#64748b; }

/* Part 2 citations are collapsed (Fernanda, 2026-11-06): a small (i), the full source on hover. */
.cite{ width:max-content !important; max-width:1.4em !important; white-space:nowrap !important; overflow:hidden !important; cursor:help; transition:max-width .35s; }
.cite::before{ content:'\24D8\00A0\00A0'; }
.cite:hover{ max-width:88vw !important; white-space:normal !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t deck-title">How CLIP is trained</h1>
  <div class="stagebox"><canvas id="cv"></canvas></div>
</div>
<div class="cite" id="cite" style="opacity:0;transition:opacity .6s">after Torralba, Isola &amp; Freeman, <i>Foundations of Computer Vision</i>, Sec. 51.3 · Radford et al., 2021, Learning Transferable Visual Models From Natural Language Supervision</div>
<div class="dots" id="dots"></div>
<script>
/* ACT 0  TITLE     (0):   the title alone
   ACT 1  ENCODERS  (1):   an image -> image encoder -> a point; a caption -> text encoder -> a point; one circle
   ACT 2  BATCH     (2-3): N = 6 pairs; the 6 x 6 cosine similarity matrix (rows images, columns captions, darker =
                           more similar, as in the lab); the symmetric loss: each row picks its caption, each column its image
   ACT 3  TRAIN     (4):   300 real gradient steps; the diagonal darkens, images move next to their captions
   ACT 4  ZERO-SHOT (5):   new images, never seen in training, land nearest their class caption
   No data colors: everything is ink and gray. Filled dot = image, ring = caption. */
/* ---- shared toy set (the same block is pasted into each Day 5 scene, so each scene stays self-contained) ----
   Images are made here, seeded: 6 kinds of 32x32 gray texture. The "embedding" is a hand-designed Gabor
   filter bank (4 orientations x 2 scales, as on Day 3), standing in for a network layer: each filter's
   energy map is averaged over the image, giving 8 numbers. */
const FONT = "Calibri, Carlito, 'Helvetica Neue', Arial, sans-serif";
function rng(seed){ return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const gauss = r => Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(2 * Math.PI * r());
const KINDS = ['horizontal stripes', 'vertical stripes', 'diagonal stripes', 'checkers', 'dots', 'rings'];
function toyImage(kind, r, n = 32){
  const f = .09 + .07 * r(), ph = 6.2832 * r(), ph2 = 6.2832 * r(), c = .32 + .12 * r(), cx = n * (.3 + .4 * r()), cy = n * (.3 + .4 * r());
  const im = new Float32Array(n * n), T = 2 * Math.PI * f;
  for(let y = 0; y < n; y++) for(let x = 0; x < n; x++){
    let v;
    if(kind === 0) v = Math.sin(T * y + ph);
    else if(kind === 1) v = Math.sin(T * x + ph);
    else if(kind === 2) v = Math.sin(T * (x + y) * Math.SQRT1_2 + ph);
    else if(kind === 3) v = Math.sign(Math.sin(T * x + ph) * Math.sin(T * y + ph2));
    else if(kind === 4) v = Math.sin(T * x + ph) * Math.sin(T * y + ph2) > .55 ? 1 : -.6;
    else v = Math.sin(T * Math.hypot(x - cx, y - cy) + ph);
    im[y * n + x] = Math.max(0, Math.min(1, .5 + c * v + .05 * gauss(r)));
  }
  return im;
}
/* the filter bank: even and odd Gabors; theta 0 responds to vertical stripes */
const BANK = [];
for(const [lam, sig] of [[4, 1.8], [8, 3.4]]) for(let o = 0; o < 4; o++){
  const th = o * Math.PI / 4, R = Math.ceil(2.2 * sig), size = 2 * R + 1, ev = new Float32Array(size * size), od = new Float32Array(size * size);
  for(let v = 0; v < size; v++) for(let u = 0; u < size; u++){
    const x = u - R, y = v - R, xr = x * Math.cos(th) + y * Math.sin(th), g = Math.exp(-(x * x + y * y) / (2 * sig * sig));
    ev[v * size + u] = g * Math.cos(2 * Math.PI * xr / lam); od[v * size + u] = g * Math.sin(2 * Math.PI * xr / lam);
  }
  const m = ev.reduce((a, b) => a + b) / ev.length; ev.forEach((_, i) => ev[i] -= m);
  for(const k of [ev, od]){ const s = Math.hypot(...k); k.forEach((_, i) => k[i] /= s); }
  BANK.push({R, size, ev, od, th, lam, name: `${o * 45}°, ${lam === 4 ? 'fine' : 'coarse'}`});
}
function energyMap(im, n, b, stride = 1){
  const m = Math.ceil(n / stride), out = new Float32Array(m * m);
  for(let j = 0; j < m; j++) for(let i = 0; i < m; i++){
    const y0 = j * stride, x0 = i * stride; let e = 0, o = 0;
    for(let v = 0; v < b.size; v++){ let yy = y0 + v - b.R; yy = yy < 0 ? 0 : yy >= n ? n - 1 : yy;
      for(let u = 0; u < b.size; u++){ let xx = x0 + u - b.R; xx = xx < 0 ? 0 : xx >= n ? n - 1 : xx;
        const p = im[yy * n + xx] - .5, k = v * b.size + u; e += b.ev[k] * p; o += b.od[k] * p; } }
    out[j * m + i] = Math.hypot(e, o);
  }
  return out;
}
const embedRaw = (im, n = 32) => BANK.map(b => { const m = energyMap(im, n, b, 2); return m.reduce((a, v) => a + v, 0) / m.length; });
/* the standard set: 8 images of each kind, seed 100 + i */
function toySet(per = 8){ const S = []; for(let k = 0; k < KINDS.length; k++) for(let i = 0; i < per; i++){ const im = toyImage(k, rng(100 + k * 50 + i)); S.push({kind: k, im, raw: embedRaw(im)}); } return S; }
/* standardize each embedding dimension over a set; cosine similarity; Pearson correlation */
function standardizer(rows){ const d = rows[0].length, mu = Array(d).fill(0), sd = Array(d).fill(0);
  rows.forEach(r => r.forEach((v, i) => mu[i] += v / rows.length)); rows.forEach(r => r.forEach((v, i) => sd[i] += (v - mu[i]) ** 2 / rows.length));
  return r => r.map((v, i) => (v - mu[i]) / (Math.sqrt(sd[i]) || 1)); }
const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
const cosine = (a, b) => dot(a, b) / (Math.sqrt(dot(a, a) * dot(b, b)) || 1);
function pearson(a, b){ const n = a.length, ma = a.reduce((s, v) => s + v, 0) / n, mb = b.reduce((s, v) => s + v, 0) / n;
  let sab = 0, saa = 0, sbb = 0; for(let i = 0; i < n; i++){ const x = a[i] - ma, y = b[i] - mb; sab += x * y; saa += x * x; sbb += y * y; } return sab / Math.sqrt(saa * sbb); }
/* draw a gray image (values 0..1) into a box */
function grayCanvas(im, n){ const c = document.createElement('canvas'); c.width = c.height = n; const x = c.getContext('2d'), d = x.createImageData(n, n);
  for(let i = 0; i < n * n; i++){ const g = Math.round(255 * im[i]); d.data[4 * i] = d.data[4 * i + 1] = d.data[4 * i + 2] = g; d.data[4 * i + 3] = 255; }
  x.putImageData(d, 0, 0); return c; }
/* ---- end of shared toy set ---- */

/* ---- the toy pairs: an image and its caption ---- */
const NK = KINDS.length, PER = 8, TAU = 0.1, STEPS = 300, EVERY = 3;
const VOCAB = ['a', 'pattern', 'of', 'some', 'horizontal', 'vertical', 'diagonal', 'stripes', 'checkers', 'dots', 'rings'];
const TEMPL = ['{}', 'some {}', 'a pattern of {}'];
const caption = (k, t) => TEMPL[t].replace('{}', KINDS[k]);
const words = c => { const v = VOCAB.map(() => 0); c.split(' ').forEach(w => v[VOCAB.indexOf(w)] += 1); return v; };   // word counts
/* training images: 8 of each kind (the standard seeds); new images for zero-shot: 20 of each kind, other seeds */
const TRAIN = [], TEST = [];
for(let k = 0; k < NK; k++){ for(let i = 0; i < PER; i++) TRAIN.push({kind: k, im: toyImage(k, rng(100 + k * 50 + i))});
  for(let i = 0; i < 20; i++) TEST.push({kind: k, im: toyImage(k, rng(9000 + k * 50 + i))}); }
TRAIN.concat(TEST).forEach(I => I.raw = embedRaw(I.im));
const Zs = standardizer(TRAIN.map(I => I.raw));
TRAIN.concat(TEST).forEach(I => I.x = Zs(I.raw));
const DI = TRAIN[0].x.length, DT = VOCAB.length;
/* the batch on screen: the first image of each kind, with a caption in one of the three templates */
const BT = [2, 0, 1, 2, 1, 0];
const BATCH = [...Array(NK)].map((_, k) => ({img: TRAIN[k * PER], cap: caption(k, BT[k])}));
BATCH.forEach(b => b.w = words(b.cap));
const N = BATCH.length;
/* two linear encoders, each followed by division by length: params = [image W (2 x DI), image b (2), text W (2 x DT), text b (2)] */
const OI = 0, OT = 2 * DI + 2, NP = OT + 2 * DT + 2;
function enc(p, o, d, x){ const u = [p[o + 2 * d], p[o + 2 * d + 1]]; for(let i = 0; i < d; i++){ u[0] += p[o + i] * x[i]; u[1] += p[o + d + i] * x[i]; }
  const len = Math.hypot(u[0], u[1]) || 1e-9; return {x, len, z: [u[0] / len, u[1] / len]}; }
const encI = (p, x) => enc(p, OI, DI, x), encT = (p, w) => enc(p, OT, DT, w);
function encBack(o, d, f, dz, g){ const zd = f.z[0] * dz[0] + f.z[1] * dz[1], du = [(dz[0] - f.z[0] * zd) / f.len, (dz[1] - f.z[1] * zd) / f.len];
  g[o + 2 * d] += du[0]; g[o + 2 * d + 1] += du[1]; for(let i = 0; i < d; i++){ g[o + i] += du[0] * f.x[i]; g[o + d + i] += du[1] * f.x[i]; } }
const softmax = s => { const m = Math.max(...s), e = s.map(v => Math.exp(v - m)), t = e.reduce((a, b) => a + b); return e.map(v => v / t); };
/* the symmetric InfoNCE (CLIP's loss): S[i][j] = image i . caption j; logits S / TAU;
   rows: image i must pick caption i among the N captions; columns: caption j must pick image j; the mean of the two */
function clipLoss(p, X, Wd, g){
  const FI = X.map(x => encI(p, x)), FT = Wd.map(w => encT(p, w)), n = X.length;
  const S = FI.map(a => FT.map(b => a.z[0] * b.z[0] + a.z[1] * b.z[1]));
  const PR = S.map(r => softmax(r.map(v => v / TAU)));
  const PCt = S[0].map((_, j) => softmax(S.map(r => r[j] / TAU)));     // PCt[j][i]: caption j picks image i
  let Li = 0, Lt = 0; for(let i = 0; i < n; i++){ Li -= Math.log(PR[i][i]) / n; Lt -= Math.log(PCt[i][i]) / n; }
  if(g){ const dI = FI.map(() => [0, 0]), dT = FT.map(() => [0, 0]);
    for(let i = 0; i < n; i++) for(let j = 0; j < n; j++){ const d = ((PR[i][j] - (i === j)) + (PCt[j][i] - (i === j))) / (2 * n) / TAU;
      dI[i][0] += d * FT[j].z[0]; dI[i][1] += d * FT[j].z[1]; dT[j][0] += d * FI[i].z[0]; dT[j][1] += d * FI[i].z[1]; }
    FI.forEach((f, i) => encBack(OI, DI, f, dI[i], g)); FT.forEach((f, j) => encBack(OT, DT, f, dT[j], g)); }
  return {L: (Li + Lt) / 2, Li, Lt, S, PR, PCt, ZI: FI.map(f => f.z), ZT: FT.map(f => f.z)};
}
function initParams(seed){ const r = rng(seed), p = new Float64Array(NP);
  for(let i = 0; i < 2 * DI; i++) p[OI + i] = gauss(r) / Math.sqrt(DI);
  for(let i = 0; i < 2 * DT; i++) p[OT + i] = gauss(r) / Math.sqrt(DT); return p; }
/* train with Adam: each step a fresh batch, one random image of each kind with a caption in a random template */
function train(p0, steps, seed, lr){
  const p = Float64Array.from(p0), m = new Float64Array(NP), v = new Float64Array(NP), r = rng(seed), snaps = [Float64Array.from(p)];
  for(let t = 1; t <= steps; t++){
    const X = [], Wd = []; for(let k = 0; k < NK; k++){ X.push(TRAIN[k * PER + Math.floor(r() * PER)].x); Wd.push(words(caption(k, Math.floor(r() * TEMPL.length)))); }
    const g = new Float64Array(NP); clipLoss(p, X, Wd, g);
    for(let i = 0; i < NP; i++){ m[i] = .9 * m[i] + .1 * g[i]; v[i] = .999 * v[i] + .001 * g[i] * g[i];
      p[i] -= lr * (m[i] / (1 - .9 ** t)) / (Math.sqrt(v[i] / (1 - .999 ** t)) + 1e-8); }
    if(t % EVERY === 0) snaps.push(Float64Array.from(p));
  }
  return {p, snaps};
}
const P0 = initParams(37);
const RUN = train(P0, STEPS, 21, .03);
const BX = BATCH.map(b => b.img.x), BW = BATCH.map(b => b.w);
const B0 = clipLoss(P0, BX, BW), B1 = clipLoss(RUN.p, BX, BW);
/* params at fraction q of the run (interpolated between stored steps) */
function paramsAt(q){ const s = RUN.snaps, x = Math.max(0, Math.min(1, q)) * (s.length - 1), i = Math.min(s.length - 2, Math.floor(x)), f = x - i;
  return {p: s[i].map((a, k) => a * (1 - f) + s[i + 1][k] * f), step: Math.round(x * EVERY)}; }
/* zero-shot: the class captions in the template "a pattern of {}"; each new image picks the closest */
const ZT = 2, ZCAP = KINDS.map((_, k) => caption(k, ZT));
const ZTXT = ZCAP.map(c => encT(RUN.p, words(c)).z);
const zsPick = (p, I) => { const z = encI(p, I.x).z, s = ZTXT.map(t => z[0] * t[0] + z[1] * t[1]); return {z, s, k: s.indexOf(Math.max(...s))}; };
const ZS = TEST.map(I => zsPick(RUN.p, I)), ZSOK = ZS.filter((o, i) => o.k === TEST[i].kind).length;
const ZS0 = TEST.map(I => ({z: encI(P0, I.x).z})).map((o, i) => { const T0 = ZCAP.map(c => encT(P0, words(c)).z), s = T0.map(t => o.z[0] * t[0] + o.z[1] * t[1]); return s.indexOf(Math.max(...s)) === TEST[i].kind; }).filter(Boolean).length;
/* the example new image: the first test image of "rings" that is classified right (or the first one) */
const EXK = 5, EXI = (() => { for(let i = 0; i < 20; i++) if(ZS[EXK * 20 + i].k === EXK) return EXK * 20 + i; return EXK * 20; })();
const EX = ZS[EXI];
const f2 = v => v.toFixed(2), LNN = Math.log(N);
const ROW = 4;   // the row and column singled out at beat 3

const CAPS = ['', 'two encoders, one shared space', 'a batch of pairs: every image × every caption', 'each image picks its caption, each caption its image', 'training: the diagonal lights up', 'zero-shot: a new image picks the closest caption'];
const NOTES = [
  "(draft) Title only. CLIP is contrastive learning with one twist: the two views are not two crops of one photo. They are an image and its caption. Let us train a tiny CLIP right here, with a real loss and real gradient steps. The setup follows the Foundations of Computer Vision book, section 51.3, and the CLIP paper, Radford and colleagues, 2021.",
  "(draft) CLIP has two encoders. The image encoder takes an image and gives a vector. The text encoder takes a caption and gives a vector. Ours are as small as they get: the image is described by eight filter energies, the caption by how many times each word appears, and each encoder is one linear layer that gives two numbers. Both vectors are divided by their length, so both land on the same circle, one shared space. The real CLIP does the same with 512 numbers on a sphere. Filled dots are images, rings are captions. Nothing is trained yet, so this image and its caption land far apart.",
  `(draft) Training uses a batch of image and caption pairs, here six, one per texture. Compare every image with every caption: cosine similarity, which is just the dot product because everything has length one. That gives a six by six matrix, one row per image, one column per caption, darker for more similar, the same matrix you compute in the lab. The true pairs are on the diagonal. Before training the diagonal does not stand out: on average it is ${f2(B0.S.reduce((s, r, i) => s + r[i], 0) / N)}, against ${f2(B0.S.reduce((s, r, i) => s + r.reduce((a, v, j) => a + (j === i ? 0 : v), 0), 0) / (N * N - N))} off the diagonal.`,
  `(draft) The loss is the guessing game from before, played twice. Each row: here is an image, which of the six captions is its own? Each column: here is a caption, which of the six images is its own? Divide by a temperature, here 0.1, take a softmax, and the loss is minus the log of the probability of the right answer. CLIP averages the two directions; the book calls it a symmetric loss. For this row, the image puts probability ${f2(B0.PR[ROW][ROW])} on its own caption; for this column, the caption puts ${f2(B0.PCt[ROW][ROW])} on its own image. Over the batch, the loss is ${f2(B0.L)}. Guessing at random would give the log of six, ${f2(LNN)}. We start above that: on a circle, random points are confidently wrong. In the 512 dimensions of the real CLIP, random vectors are nearly perpendicular, and the loss starts close to chance.`,
  `(draft) Now we train: ${STEPS} gradient steps, each on a fresh batch of six pairs, with the captions written in different ways. Both encoders learn at once, from the same loss. Watch the matrix: the diagonal gets dark and the rest gets light. And on the circle, each image moves next to its caption. The loss goes from ${f2(B0.L)} to ${f2(B1.L)}. No class label was used: the only supervision is which caption came with which image.`,
  `(draft) Once trained, we can classify without any more training. Write each class as a caption, a pattern of rings, a pattern of dots, and so on, and put the six captions on the circle. A new image, never seen in training, lands nearest the caption of its class. This is zero-shot classification. On ${TEST.length} new images, ${ZSOK} pick the right caption, ${Math.round(100 * ZSOK / TEST.length)} percent, against about 17 percent by chance; the untrained encoders got ${ZS0}. In the lab you do exactly this with the real CLIP and ten classes of photos.`
];
const NB = NOTES.length - 1;
const DUR = [0, 900, 900, 900, 5000, 1400];
let beat = 0, t0 = 0;
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
function go(b, jump){ beat = b; t0 = performance.now() - (jump ? 1e9 : 0); document.getElementById('cite').style.opacity = b >= 1 ? 1 : 0;
  document.getElementById('dots').innerHTML = [...Array(NB)].map((_, i) => `<i class="${i < b ? 'on' : ''}"></i>`).join(''); }

/* ---- drawing ---- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function size(){ const d = devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
const txt = (t, x, y, sz, bold, align = 'center', base = 'middle', col = '#0f172a', maxW) => { ctx.fillStyle = col; ctx.font = `${bold ? 700 : 400} ${sz}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(t, x, y, maxW); };
const THB = BATCH.map(b => grayCanvas(b.img.im, 32)), THX = grayCanvas(TEST[EXI].im, 32);
function thumb(c, x, y, s){ ctx.imageSmoothingEnabled = false; ctx.drawImage(c, x, y, s, s); ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1; ctx.strokeRect(x, y, s, s); }
function arrow(x0, y0, x1, y1, lw = 2){ const dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy); if(l < 3) return; const ux = dx / l, uy = dy / l, h = Math.min(12, l * .4);
  ctx.strokeStyle = ctx.fillStyle = '#0f172a'; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - ux * h * .6, y1 - uy * h * .6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - ux * h - uy * h * .5, y1 - uy * h + ux * h * .5); ctx.lineTo(x1 - ux * h + uy * h * .5, y1 - uy * h - ux * h * .5); ctx.closePath(); ctx.fill(); }
const dotAt = (x, y, r) => { ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fill(); };
const ringAt = (x, y, r, lw = 2.5) => { ctx.fillStyle = '#fff'; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI); ctx.fill(); ctx.stroke(); };
/* gray_r, as in the lab's show_matrix: darker = more similar; the scale here is fixed at -1 .. 1 */
const shade = v => { const g = Math.round(255 * (1 - (Math.max(-1, Math.min(1, v)) + 1) / 2)); return `rgb(${g},${g},${g})`; };

/* the circle: pairs = which batch pairs to draw (image dot, caption ring, a line between) */
function drawCircle(cx, cy, R, ZI, ZTx, o = {}){
  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI); ctx.stroke();
  const P = z => [cx + R * z[0], cy - R * z[1]], dr = Math.max(6, R * .035);
  (o.pairs || []).forEach(i => {
    ctx.globalAlpha = (o.alpha ?? 1) * (o.dim && o.dim !== true && !o.dim.includes(i) ? .25 : 1);
    const [x, y] = P(ZI[i]), [u, v] = P(ZTx[i]);
    if(o.thumbs){ const tr = R * 1.2, ts = R * .17; thumb(THB[i], cx + tr * ZI[i][0] - ts / 2, cy - tr * ZI[i][1] - ts / 2, ts); }
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(u, v); ctx.stroke();
    ringAt(u, v, dr); dotAt(x, y, dr);
  });
  ctx.globalAlpha = 1; return {P, dr};
}

/* the N x N matrix: rows images (thumbnails at left), columns captions (text below, slanted), as in the lab */
function drawMatrix(x0, y0, cs, S, o = {}){
  for(let i = 0; i < N; i++) thumb(THB[i], x0 - cs * .95, y0 + i * cs + cs * .1, cs * .8);
  for(let i = 0; i < N; i++) for(let j = 0; j < N; j++){
    const v = S[i][j], x = x0 + j * cs, y = y0 + i * cs;
    ctx.fillStyle = shade(v); ctx.fillRect(x, y, cs, cs);
    txt(v.toFixed(2), x + cs / 2, y + cs / 2, cs * .24, false, 'center', 'middle', v > 0 ? '#fff' : '#0f172a');
  }
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.strokeRect(x0, y0, N * cs, N * cs);
  /* the diagonal: the true pairs */
  for(let i = 0; i < N; i++){ ctx.setLineDash([]); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeRect(x0 + i * cs + 2, y0 + i * cs + 2, cs - 4, cs - 4);
    ctx.setLineDash([6, 4]); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2.5; ctx.strokeRect(x0 + i * cs + 2, y0 + i * cs + 2, cs - 4, cs - 4); }
  ctx.setLineDash([]);
  const fs = Math.max(13, cs * .2);
  for(let j = 0; j < N; j++){ ctx.save(); ctx.translate(x0 + j * cs + cs * .6, y0 + N * cs + fs * .5); ctx.rotate(-Math.PI / 4);
    txt(BATCH[j].cap, 0, 0, fs, false, 'right', 'middle'); ctx.restore(); }
  ctx.save(); ctx.translate(x0 - cs * 1.15, y0 + N * cs / 2); ctx.rotate(-Math.PI / 2); txt('images', 0, 0, fs, true, 'center', 'bottom', '#64748b'); ctx.restore();
  txt('captions', x0 + N * cs / 2, y0 - fs * .5, fs, true, 'center', 'bottom', '#64748b');
  if(o.legend){ const lx = x0 + N * cs + cs * .3, lh = N * cs * .8, ly = y0 + N * cs * .1;
    for(let k = 0; k < 40; k++){ ctx.fillStyle = shade(1 - 2 * k / 39); ctx.fillRect(lx, ly + k * lh / 40, cs * .18, lh / 40 + 1); }
    ctx.strokeStyle = '#94a3b8'; ctx.strokeRect(lx, ly, cs * .18, lh);
    txt('1', lx + cs * .25, ly, fs * .85, false, 'left'); txt('0', lx + cs * .25, ly + lh / 2, fs * .85, false, 'left'); txt('−1', lx + cs * .25, ly + lh, fs * .85, false, 'left');
    ctx.save(); ctx.translate(lx + cs * .75, ly + lh / 2); ctx.rotate(-Math.PI / 2); txt('cosine similarity', 0, 0, fs * .85, false, 'center', 'middle', '#64748b'); ctx.restore(); }
}

function frame(now){
  if(cv.clientWidth !== W || cv.clientHeight !== H) size();
  const p = Math.min(1, (now - t0) / (DUR[beat] || 900)), A = b => beat > b ? 1 : beat === b ? ease(p) : 0;
  ctx.clearRect(0, 0, W, H);
  if(beat === 0){ requestAnimationFrame(frame); return; }
  const fs = Math.max(15, W * .014), big = Math.max(19, W * .018);
  const R = Math.min(H * .27, W * .16), cx = W * .76, cy = H * .45;
  /* the current state of training */
  let st = B0, step = 0;
  if(beat === 4){ const q = paramsAt(ease(p)); st = clipLoss(q.p, BX, BW); step = q.step; }
  else if(beat > 4){ st = B1; step = STEPS; }

  if(beat === 1){ /* the two encoders, one pair */
    const a = A(1), ts = Math.min(H * .2, W * .09), x0 = W * .02, yI = H * .2, yT = H * .68, bx = W * .2, bw = W * .17, bh = ts * .75;
    ctx.globalAlpha = a;
    thumb(THB[ROW], x0, yI - ts / 2, ts); txt('an image', x0 + ts / 2, yI + ts / 2 + fs * .9, fs, false);
    txt('8 filter energies', x0 + ts / 2, yI + ts / 2 + fs * 2.1, fs * .85, false, 'center', 'middle', '#64748b');
    txt(`“${BATCH[ROW].cap}”`, x0, yT, big, true, 'left', 'middle', '#0f172a', bx - x0 - fs * 1.5);
    txt('a caption', x0, yT + big * 1.3, fs, false, 'left'); txt('word counts', x0, yT + big * 1.3 + fs * 1.2, fs * .85, false, 'left', 'middle', '#64748b');
    [[yI, 'image encoder'], [yT, 'text encoder']].forEach(([y, lab]) => {
      arrow(y === yI ? x0 + ts + fs * .6 : bx - fs * 2.2, y, bx - fs * .4, y);
      ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2.5; ctx.strokeRect(bx, y - bh / 2, bw, bh);
      txt(lab, bx + bw / 2, y - fs * .55, big, true); txt('linear → 2 numbers, ÷ length', bx + bw / 2, y + fs * .75, fs * .85, false, 'center', 'middle', '#0f172a', bw - 8); });
    const {P, dr} = drawCircle(cx, cy, R, B0.ZI, B0.ZT, {pairs: [ROW]});
    const [ix, iy] = P(B0.ZI[ROW]), [tx, ty] = P(B0.ZT[ROW]);
    ctx.globalAlpha = a * .7; ctx.setLineDash([5, 5]);
    arrow(bx + bw + fs * .4, yI, ix - dr * 2 * Math.sign(ix - bx), iy, 1.5); arrow(bx + bw + fs * .4, yT, tx - dr * 2 * Math.sign(tx - bx), ty, 1.5); ctx.setLineDash([]);
    ctx.globalAlpha = a;
    dotAt(cx - R * .55, cy + R + big * 1.1, 7); txt('image', cx - R * .55 + 14, cy + R + big * 1.1, fs, false, 'left');
    ringAt(cx + R * .2, cy + R + big * 1.1, 7); txt('caption', cx + R * .2 + 14, cy + R + big * 1.1, fs, false, 'left');
    ctx.globalAlpha = 1;
  }
  if(beat >= 2 && beat <= 4){
    const cs = Math.min(H * .105, W * .056), mx = W * .09, my = H * .08;
    ctx.globalAlpha = beat === 2 ? A(2) : 1;
    drawMatrix(mx, my, cs, st.S, {legend: true});
    drawCircle(cx, cy, R, st.ZI, st.ZT, {pairs: [...Array(N).keys()], thumbs: true, dim: beat === 3 ? [ROW] : false});
    ctx.globalAlpha = 1;
    if(beat === 3){ const a = A(3);
      ctx.globalAlpha = a; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 4;
      ctx.strokeRect(mx - 2, my + ROW * cs - 2, N * cs + 4, cs + 4); ctx.strokeRect(mx + ROW * cs - 2, my - 2, cs + 4, N * cs + 4);
      ctx.globalAlpha = 1; }
    /* the loss */
    const lx = cx, ly = cy + R * 1.35 + big * .6;
    if(beat >= 3){ ctx.globalAlpha = beat === 3 ? A(3) : 1;
      txt(`rows, image → caption: ${f2(st.Li)}  ·  columns, caption → image: ${f2(st.Lt)}`, lx, ly, fs, false, 'center', 'middle', '#0f172a', W * .44);
      txt(`symmetric InfoNCE loss (the mean): ${f2(st.L)}`, lx, ly + big * 1.3, big, true, 'center', 'middle', '#0f172a', W * .44);
      txt(`temperature 0.1 · chance: log 6 = ${f2(LNN)} · training step: ${step}`, lx, ly + big * 2.6, fs * .9, false, 'center', 'middle', '#64748b', W * .44);
      ctx.globalAlpha = 1; }
  }
  if(beat === 5){ /* zero-shot */
    const a = A(5);
    const {P, dr} = drawCircle(cx, cy, R, [], [], {});
    /* faded: the trained batch */
    drawCircle(cx, cy, R, B1.ZI, B1.ZT, {pairs: [...Array(N).keys()], alpha: .15 * (1 - a) + .0});
    ctx.globalAlpha = a;
    ZTXT.forEach((t, k) => { const [u, v] = P(t); ringAt(u, v, dr);
      const lx = cx + (R + dr * 2.2) * t[0], ly = cy - (R + dr * 2.2 + fs * .5) * t[1]; txt(KINDS[k], lx, ly, fs, k === EX.k, t[0] > .2 ? 'left' : t[0] < -.2 ? 'right' : 'center', 'middle', '#0f172a'); });
    const [x, y] = P(EX.z), ts = R * .3, tr = R * 1.35, txx = cx + tr * EX.z[0] - ts / 2, tyy = cy - tr * EX.z[1] - ts / 2;
    dotAt(x, y, dr * 1.3);
    const [u, v] = P(ZTXT[EX.k]); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(u, v); ctx.stroke();
    /* left: the captions, and the new image's similarity with each */
    const x0 = W * .03, y0 = H * .06, rh = Math.min(H * .085, W * .045), bw = W * .2;
    txt('a new image, never seen in training', x0, y0, big, true, 'left');
    thumb(THX, x0, y0 + big * .9, rh * 1.6);
    txt('class captions', x0, y0 + big * .9 + rh * 2.2, fs, true, 'left', 'middle', '#64748b');
    txt('cosine similarity', x0 + W * .2 + bw / 2, y0 + big * .9 + rh * 2.2, fs, true, 'center', 'middle', '#64748b');
    ZCAP.forEach((c, k) => { const yy = y0 + big * .9 + rh * 2.8 + k * rh, s = EX.s[k], bx = x0 + W * .2;
      txt(`“${c}”`, x0, yy + rh / 2, fs, k === EX.k, 'left', 'middle', '#0f172a', W * .19);
      ctx.fillStyle = shade(s); ctx.fillRect(bx + bw / 2, yy + rh * .15, s * bw / 2, rh * .7);
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(bx + bw / 2, yy); ctx.lineTo(bx + bw / 2, yy + rh); ctx.stroke();
      txt(s.toFixed(2), bx + bw + fs * .5, yy + rh / 2, fs, k === EX.k, 'left');
      if(k === EX.k){ ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2.5; ctx.strokeRect(x0 - 6, yy + 1, bx + bw + fs * 3.5 - x0, rh - 2); } });
    txt(`zero-shot on ${TEST.length} new images: ${ZSOK} right (${Math.round(100 * ZSOK / TEST.length)}%) · chance 17%`, x0, y0 + big * .9 + rh * 3.2 + N * rh, big, true, 'left', 'middle', '#0f172a', W * .55);
    ctx.globalAlpha = 1;
  }
  ctx.globalAlpha = Math.min(1, p * 2); txt(CAPS[beat], cx, 0, big, true, 'center', 'top', '#0f172a', W * .45); ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

window.clipTrainScene = {
  advance(){ if(beat < NB) go(beat + 1); },
  back(){ if(beat > 0) go(beat - 1, true); },
  atStart: () => beat === 0,
  atEnd: () => beat === NB,
  reset(){ go(0, true); },
  resetToEnd(){ go(NB, true); },
  getBeat: () => beat,
  notes: NOTES,
  seek(q){ t0 = performance.now() - q * (DUR[beat] || 900); },
  debug: () => ({L: [B0.L, B1.L], diag: [B0.S.map((r, i) => r[i]), B1.S.map((r, i) => r[i])], zs: [ZSOK, TEST.length, ZS0], ex: EXI, conf: KINDS.map((_, k) => KINDS.map((_, j) => ZS.filter((o, i) => TEST[i].kind === k && o.k === j).length))})
};
if(window.parent === window){
  addEventListener('keydown', e => { if(['ArrowRight', ' ', 'Enter'].includes(e.key)) clipTrainScene.advance(); if(e.key === 'ArrowLeft') clipTrainScene.back(); });
  addEventListener('click', () => clipTrainScene.advance());
}
go(0, true); requestAnimationFrame(frame);
</script>
</body>
</html>
