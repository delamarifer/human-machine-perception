<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Thatcher illusion</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../deck/deck.css">
<style>
  /* Owner: Day 5 human-link part. Pattern B. A schematic face (drawn here, a stand-in for a photo) and its
     Thatcherized version (eyes and mouth flipped). The filter-bank comparison in beat 4 is computed. */
  html, body{ background:#fff; }
  .wrap{ position:absolute; inset:0; padding:9vh 6vw 12vh; display:flex; flex-direction:column; gap:2vh; }
  .stagebox{ position:relative; flex:1 1 auto; min-height:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; }
  .dots{ position:fixed; right:2vw; bottom:12px; display:flex; gap:6px; }
  .dots i{ width:7px; height:7px; border-radius:50%; background:#e2e8f0; }
  .dots i.on{ background:#64748b; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t deck-title">The Thatcher illusion</h1>
  <div class="stagebox"><canvas id="cv"></canvas></div>
  <div class="cite" id="cite" style="opacity:0;transition:opacity .6s">Thompson, 1980, Perception · face inversion: Yin, 1969 · schematic face, drawn for this slide</div>
</div>
<div class="dots" id="dots"></div>
<script>
/* ACT 0  TITLE    (0):   the title alone
   ACT 1  ILLUSION (1-3): two faces upside down look alike; turn them upright: one is grotesque;
                          only the eyes and mouth were flipped
   ACT 2  SYSTEMS  (4-5): a filter bank sees the same difference both ways up (computed);
                          the lab question: what does a ViT do?
   No data colors. */
/* ---- shared toy set (the same block is pasted into each Day 5 scene, so each scene stays self-contained) ----
   Images are made here, seeded: 6 kinds of 32x32 gray texture. The "embedding" is a hand-designed Gabor
   filter bank (4 orientations x 2 scales, as on Day 3), standing in for a network layer: each filter's
   energy map is averaged over the image, giving 8 numbers. */
const FONT = "Calibri, Carlito, 'Helvetica Neue', Arial, sans-serif";
function rng(seed){ return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const gauss = r => Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(2 * Math.PI * r());
const KINDS = ['horizontal stripes', 'vertical stripes', 'diagonal stripes', 'checkers', 'dots', 'rings'];
function toyImage(kind, r, n = 32){
  const f = .09 + .07 * r(), ph = 6.2832 * r(), ph2 = 6.2832 * r(), c = .32 + .12 * r(), cx = n * (.3 + .4 * r()), cy = n * (.3 + .4 * r());
  const im = new Float32Array(n * n), T = 2 * Math.PI * f;
  for(let y = 0; y < n; y++) for(let x = 0; x < n; x++){
    let v;
    if(kind === 0) v = Math.sin(T * y + ph);
    else if(kind === 1) v = Math.sin(T * x + ph);
    else if(kind === 2) v = Math.sin(T * (x + y) * Math.SQRT1_2 + ph);
    else if(kind === 3) v = Math.sign(Math.sin(T * x + ph) * Math.sin(T * y + ph2));
    else if(kind === 4) v = Math.sin(T * x + ph) * Math.sin(T * y + ph2) > .55 ? 1 : -.6;
    else v = Math.sin(T * Math.hypot(x - cx, y - cy) + ph);
    im[y * n + x] = Math.max(0, Math.min(1, .5 + c * v + .05 * gauss(r)));
  }
  return im;
}
/* the filter bank: even and odd Gabors; theta 0 responds to vertical stripes */
const BANK = [];
for(const [lam, sig] of [[4, 1.8], [8, 3.4]]) for(let o = 0; o < 4; o++){
  const th = o * Math.PI / 4, R = Math.ceil(2.2 * sig), size = 2 * R + 1, ev = new Float32Array(size * size), od = new Float32Array(size * size);
  for(let v = 0; v < size; v++) for(let u = 0; u < size; u++){
    const x = u - R, y = v - R, xr = x * Math.cos(th) + y * Math.sin(th), g = Math.exp(-(x * x + y * y) / (2 * sig * sig));
    ev[v * size + u] = g * Math.cos(2 * Math.PI * xr / lam); od[v * size + u] = g * Math.sin(2 * Math.PI * xr / lam);
  }
  const m = ev.reduce((a, b) => a + b) / ev.length; ev.forEach((_, i) => ev[i] -= m);
  for(const k of [ev, od]){ const s = Math.hypot(...k); k.forEach((_, i) => k[i] /= s); }
  BANK.push({R, size, ev, od, th, lam, name: `${o * 45}°, ${lam === 4 ? 'fine' : 'coarse'}`});
}
function energyMap(im, n, b, stride = 1){
  const m = Math.ceil(n / stride), out = new Float32Array(m * m);
  for(let j = 0; j < m; j++) for(let i = 0; i < m; i++){
    const y0 = j * stride, x0 = i * stride; let e = 0, o = 0;
    for(let v = 0; v < b.size; v++){ let yy = y0 + v - b.R; yy = yy < 0 ? 0 : yy >= n ? n - 1 : yy;
      for(let u = 0; u < b.size; u++){ let xx = x0 + u - b.R; xx = xx < 0 ? 0 : xx >= n ? n - 1 : xx;
        const p = im[yy * n + xx] - .5, k = v * b.size + u; e += b.ev[k] * p; o += b.od[k] * p; } }
    out[j * m + i] = Math.hypot(e, o);
  }
  return out;
}
const embedRaw = (im, n = 32) => BANK.map(b => { const m = energyMap(im, n, b, 2); return m.reduce((a, v) => a + v, 0) / m.length; });
/* the standard set: 8 images of each kind, seed 100 + i */
function toySet(per = 8){ const S = []; for(let k = 0; k < KINDS.length; k++) for(let i = 0; i < per; i++){ const im = toyImage(k, rng(100 + k * 50 + i)); S.push({kind: k, im, raw: embedRaw(im)}); } return S; }
/* standardize each embedding dimension over a set; cosine similarity; Pearson correlation */
function standardizer(rows){ const d = rows[0].length, mu = Array(d).fill(0), sd = Array(d).fill(0);
  rows.forEach(r => r.forEach((v, i) => mu[i] += v / rows.length)); rows.forEach(r => r.forEach((v, i) => sd[i] += (v - mu[i]) ** 2 / rows.length));
  return r => r.map((v, i) => (v - mu[i]) / (Math.sqrt(sd[i]) || 1)); }
const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
const cosine = (a, b) => dot(a, b) / (Math.sqrt(dot(a, a) * dot(b, b)) || 1);
function pearson(a, b){ const n = a.length, ma = a.reduce((s, v) => s + v, 0) / n, mb = b.reduce((s, v) => s + v, 0) / n;
  let sab = 0, saa = 0, sbb = 0; for(let i = 0; i < n; i++){ const x = a[i] - ma, y = b[i] - mb; sab += x * y; saa += x * x; sbb += y * y; } return sab / Math.sqrt(saa * sbb); }
/* draw a gray image (values 0..1) into a box */
function grayCanvas(im, n){ const c = document.createElement('canvas'); c.width = c.height = n; const x = c.getContext('2d'), d = x.createImageData(n, n);
  for(let i = 0; i < n * n; i++){ const g = Math.round(255 * im[i]); d.data[4 * i] = d.data[4 * i + 1] = d.data[4 * i + 2] = g; d.data[4 * i + 3] = 255; }
  x.putImageData(d, 0, 0); return c; }
/* ---- end of shared toy set ---- */

/* the schematic face, drawn in a unit box centred on (0,0); thatcher = eyes and mouth flipped in place */
function face(c, thatcher){
  c.lineCap = c.lineJoin = 'round';
  c.fillStyle = '#e7e5e4'; c.strokeStyle = '#0f172a'; c.lineWidth = .02;
  c.beginPath(); c.ellipse(0, 0, .36, .46, 0, 0, 7); c.fill(); c.stroke();
  c.save(); c.beginPath(); c.ellipse(0, 0, .36, .46, 0, 0, 7); c.clip();                                          // hair: the top of the head
  c.fillStyle = '#44403c'; c.beginPath(); c.moveTo(-.4, -.24); c.quadraticCurveTo(0, -.36, .4, -.24); c.lineTo(.4, -.5); c.lineTo(-.4, -.5); c.fill(); c.restore();
  c.beginPath(); c.ellipse(0, 0, .36, .46, 0, 0, 7); c.stroke();
  const flip = (x, y, fn) => { c.save(); c.translate(x, y); if(thatcher) c.scale(1, -1); fn(); c.restore(); };
  for(const sx of [-1, 1]) flip(sx * .15, -.06, () => {
    c.fillStyle = '#fff'; c.beginPath(); c.moveTo(-.09, 0); c.quadraticCurveTo(0, -.075, .09, 0); c.quadraticCurveTo(0, .055, -.09, 0); c.fill(); c.stroke();
    c.fillStyle = '#0f172a'; c.beginPath(); c.arc(0, -.005, .032, 0, 7); c.fill();
    c.lineWidth = .028; c.beginPath(); c.moveTo(-.1, -.1); c.quadraticCurveTo(0, -.15, .1, -.1); c.stroke(); c.lineWidth = .02; });
  c.beginPath(); c.moveTo(0, -.02); c.quadraticCurveTo(-.04, .1, -.03, .12); c.quadraticCurveTo(0, .14, .03, .12); c.stroke();      // nose
  flip(0, .25, () => {
    c.fillStyle = '#9f5f5f'; c.beginPath(); c.moveTo(-.13, -.01); c.quadraticCurveTo(0, -.05, .13, -.01); c.quadraticCurveTo(0, .1, -.13, -.01); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-.13, -.01); c.quadraticCurveTo(0, .03, .13, -.01); c.stroke(); });
}
/* render a face to a 64x64 gray image, optionally upside down, and embed it with the filter bank (stride 1) */
const FN = 64;
function faceImage(thatcher, inverted){ const o = document.createElement('canvas'); o.width = o.height = FN; const c = o.getContext('2d');
  c.fillStyle = '#fff'; c.fillRect(0, 0, FN, FN); c.translate(FN / 2, FN / 2); if(inverted) c.rotate(Math.PI); c.scale(FN, FN); face(c, thatcher);
  const d = c.getImageData(0, 0, FN, FN).data, im = new Float32Array(FN * FN);
  for(let i = 0; i < FN * FN; i++) im[i] = (.299 * d[4 * i] + .587 * d[4 * i + 1] + .114 * d[4 * i + 2]) / 255;
  return im; }
const embed1 = im => BANK.map(b => { const m = energyMap(im, FN, b, 1); return m.reduce((a, v) => a + v, 0) / m.length; });
const dist = (a, b) => Math.sqrt(a.reduce((s, v, i) => s + (v - b[i]) ** 2, 0));
const E_UP = [embed1(faceImage(false, false)), embed1(faceImage(true, false))], E_DN = [embed1(faceImage(false, true)), embed1(faceImage(true, true))];
const D_UP = dist(...E_UP), D_DN = dist(...E_DN);
const f3 = v => v.toFixed(3);

const CAPS = ['', 'upside down: they look alike', 'upright: one is grotesque', 'only the eyes and mouth were flipped', 'a filter bank: the same difference both ways up', 'and a Vision Transformer?'];
const NOTES = [
  "(draft) Title only. A human connection for today: a famous face illusion, and what it says about how we represent faces.",
  "(draft) Two faces, upside down. (This is a schematic face drawn for the slide; with a real photograph the effect is much stronger, see the to-do.) Do they look different? Not much.",
  "(draft) Now turn them upright. One of them is grotesque.",
  "(draft) Here is all that changed: the eyes and the mouth were cut out and flipped upside down. Upside down, we barely notice; upright, it jumps out. Peter Thompson reported this in 1980, with a photo of Margaret Thatcher, hence the name. More generally, faces are much harder to recognize upside down than other objects, the face inversion effect. A common reading is that upright faces are processed as a whole configuration, and inversion disrupts that.",
  (`(draft) What would our filter-bank embedding say? We measured how far apart the two faces are in its 8-number embedding: ${f3(D_UP)} upright, ${f3(D_DN)} upside down. Exactly the same. Turning an image upside down does not change which orientations it contains, so a bag of local filter responses cannot show this effect. It sees parts, not their arrangement.`),
  "(draft) So here is a real question for the lab: does a Vision Transformer, which can relate every patch to every other, treat the Thatcherized face differently upright and upside down, the way people do? You will measure it with the embeddings of a trained ViT."
];
const NB = NOTES.length - 1;
let beat = 0, t0 = 0;
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
function go(b, jump){ beat = b; t0 = performance.now() - (jump ? 1e9 : 0); document.getElementById('cite').style.opacity = b >= 1 ? 1 : 0;
  document.getElementById('dots').innerHTML = [...Array(NB)].map((_, i) => `<i class="${i < b ? 'on' : ''}"></i>`).join(''); }

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function size(){ const d = devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
const txt = (t, x, y, sz, bold, align = 'center', base = 'middle') => { ctx.fillStyle = '#0f172a'; ctx.font = `${bold ? 700 : 400} ${sz}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(t, x, y); };

function frame(now){
  if(cv.clientWidth !== W || cv.clientHeight !== H) size();
  const p = Math.min(1, (now - t0) / (beat === 2 ? 1600 : 900)), A = b => beat > b ? 1 : beat === b ? ease(p) : 0;
  ctx.clearRect(0, 0, W, H);
  const fs = Math.max(16, W * .015), big = Math.max(20, W * .019);
  const s = Math.min(H * .78, W * .25), cy = H * .44, cx = [W * .16, W * .44];
  if(A(1) > 0){ const rot = Math.PI * (1 - A(2));
    [false, true].forEach((th, i) => { ctx.save(); ctx.globalAlpha = A(1); ctx.translate(cx[i], cy); ctx.rotate(rot); ctx.scale(s, s); face(ctx, th); ctx.restore(); });
    if(beat === 3){ ctx.globalAlpha = A(3); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
      for(const [x, y, w, h] of [[-.27, -.2, .24, .22], [.03, -.2, .24, .22], [-.17, .17, .34, .16]]) ctx.strokeRect(cx[1] + x * s, cy + y * s, w * s, h * s);
      ctx.setLineDash([]); ctx.globalAlpha = 1; }
  }
  const rx = W * .64;
  if(A(4) > 0){ ctx.globalAlpha = A(4); txt('filter-bank embedding:', rx, H * .16, fs, true, 'left'); txt('distance between the two faces', rx, H * .16 + fs * 1.4, fs, false, 'left');
    txt(`upright: ${f3(D_UP)}`, rx, H * .16 + fs * 3.4, big, true, 'left'); txt(`upside down: ${f3(D_DN)}`, rx, H * .16 + fs * 5.2, big, true, 'left'); ctx.globalAlpha = 1; }
  if(A(5) > 0){ ctx.globalAlpha = A(5); txt('people: a big difference upright,', rx, H * .52, fs, false, 'left'); txt('little upside down', rx, H * .52 + fs * 1.4, fs, false, 'left');
    txt('a ViT: you measure it in the lab', rx, H * .52 + fs * 3.4, big, true, 'left'); ctx.globalAlpha = 1; }
  ctx.globalAlpha = beat ? Math.min(1, p * 2) : 0; txt(CAPS[beat], 0, H - big * .4, big, true, 'left', 'bottom'); ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

window.thatcherScene = {
  advance(){ if(beat < NB) go(beat + 1); },
  back(){ if(beat > 0) go(beat - 1, true); },
  atStart: () => beat === 0,
  atEnd: () => beat === NB,
  reset(){ go(0, true); },
  resetToEnd(){ go(NB, true); },
  getBeat: () => beat,
  notes: NOTES,
  debug: () => ({D_UP, D_DN})
};
if(window.parent === window){
  addEventListener('keydown', e => { if(['ArrowRight', ' ', 'Enter'].includes(e.key)) thatcherScene.advance(); if(e.key === 'ArrowLeft') thatcherScene.back(); });
  addEventListener('click', () => thatcherScene.advance());
}
go(0, true); requestAnimationFrame(frame);
</script>
</body>
</html>
