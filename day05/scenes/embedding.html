<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>From feature maps to an embedding</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../deck/deck.css">
<style>
  /* Owner: Day 5 embeddings part. Pattern B. Everything is computed here: toy images, a Gabor filter
     bank standing in for a network layer, its feature maps, the pooled embedding, and similarities. */
  html, body{ background:#fff; }
  .wrap{ position:absolute; inset:0; padding:9vh 6vw 12vh; display:flex; flex-direction:column; gap:2vh; }
  .stagebox{ position:relative; flex:1 1 auto; min-height:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; }
  .dots{ position:fixed; right:2vw; bottom:12px; display:flex; gap:6px; }
  .dots i{ width:7px; height:7px; border-radius:50%; background:#e2e8f0; }
  .dots i.on{ background:#64748b; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t deck-title">From feature maps to an embedding</h1>
  <div class="stagebox"><canvas id="cv"></canvas></div>
</div>
<div class="dots" id="dots"></div>
<script>
/* ACT 0  TITLE     (0):   the title alone
   ACT 1  PIPELINE  (1-4): an image; a bank of filters; their feature maps; average each map: 8 numbers
   ACT 2  COMPARE   (5-6): a second image of the same kind (different pixels, similar embedding);
                           a different kind (different embedding)
   No data colors: grayscale images, ink bars. */
/* ---- shared toy set (the same block is pasted into each Day 5 scene, so each scene stays self-contained) ----
   Images are made here, seeded: 6 kinds of 32x32 gray texture. The "embedding" is a hand-designed Gabor
   filter bank (4 orientations x 2 scales, as on Day 3), standing in for a network layer: each filter's
   energy map is averaged over the image, giving 8 numbers. */
const FONT = "Calibri, Carlito, 'Helvetica Neue', Arial, sans-serif";
function rng(seed){ return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const gauss = r => Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(2 * Math.PI * r());
const KINDS = ['horizontal stripes', 'vertical stripes', 'diagonal stripes', 'checkers', 'dots', 'rings'];
function toyImage(kind, r, n = 32){
  const f = .09 + .07 * r(), ph = 6.2832 * r(), ph2 = 6.2832 * r(), c = .32 + .12 * r(), cx = n * (.3 + .4 * r()), cy = n * (.3 + .4 * r());
  const im = new Float32Array(n * n), T = 2 * Math.PI * f;
  for(let y = 0; y < n; y++) for(let x = 0; x < n; x++){
    let v;
    if(kind === 0) v = Math.sin(T * y + ph);
    else if(kind === 1) v = Math.sin(T * x + ph);
    else if(kind === 2) v = Math.sin(T * (x + y) * Math.SQRT1_2 + ph);
    else if(kind === 3) v = Math.sign(Math.sin(T * x + ph) * Math.sin(T * y + ph2));
    else if(kind === 4) v = Math.sin(T * x + ph) * Math.sin(T * y + ph2) > .55 ? 1 : -.6;
    else v = Math.sin(T * Math.hypot(x - cx, y - cy) + ph);
    im[y * n + x] = Math.max(0, Math.min(1, .5 + c * v + .05 * gauss(r)));
  }
  return im;
}
/* the filter bank: even and odd Gabors; theta 0 responds to vertical stripes */
const BANK = [];
for(const [lam, sig] of [[4, 1.8], [8, 3.4]]) for(let o = 0; o < 4; o++){
  const th = o * Math.PI / 4, R = Math.ceil(2.2 * sig), size = 2 * R + 1, ev = new Float32Array(size * size), od = new Float32Array(size * size);
  for(let v = 0; v < size; v++) for(let u = 0; u < size; u++){
    const x = u - R, y = v - R, xr = x * Math.cos(th) + y * Math.sin(th), g = Math.exp(-(x * x + y * y) / (2 * sig * sig));
    ev[v * size + u] = g * Math.cos(2 * Math.PI * xr / lam); od[v * size + u] = g * Math.sin(2 * Math.PI * xr / lam);
  }
  const m = ev.reduce((a, b) => a + b) / ev.length; ev.forEach((_, i) => ev[i] -= m);
  for(const k of [ev, od]){ const s = Math.hypot(...k); k.forEach((_, i) => k[i] /= s); }
  BANK.push({R, size, ev, od, th, lam, name: `${o * 45}°, ${lam === 4 ? 'fine' : 'coarse'}`});
}
function energyMap(im, n, b, stride = 1){
  const m = Math.ceil(n / stride), out = new Float32Array(m * m);
  for(let j = 0; j < m; j++) for(let i = 0; i < m; i++){
    const y0 = j * stride, x0 = i * stride; let e = 0, o = 0;
    for(let v = 0; v < b.size; v++){ let yy = y0 + v - b.R; yy = yy < 0 ? 0 : yy >= n ? n - 1 : yy;
      for(let u = 0; u < b.size; u++){ let xx = x0 + u - b.R; xx = xx < 0 ? 0 : xx >= n ? n - 1 : xx;
        const p = im[yy * n + xx] - .5, k = v * b.size + u; e += b.ev[k] * p; o += b.od[k] * p; } }
    out[j * m + i] = Math.hypot(e, o);
  }
  return out;
}
const embedRaw = (im, n = 32) => BANK.map(b => { const m = energyMap(im, n, b, 2); return m.reduce((a, v) => a + v, 0) / m.length; });
/* the standard set: 8 images of each kind, seed 100 + i */
function toySet(per = 8){ const S = []; for(let k = 0; k < KINDS.length; k++) for(let i = 0; i < per; i++){ const im = toyImage(k, rng(100 + k * 50 + i)); S.push({kind: k, im, raw: embedRaw(im)}); } return S; }
/* standardize each embedding dimension over a set; cosine similarity; Pearson correlation */
function standardizer(rows){ const d = rows[0].length, mu = Array(d).fill(0), sd = Array(d).fill(0);
  rows.forEach(r => r.forEach((v, i) => mu[i] += v / rows.length)); rows.forEach(r => r.forEach((v, i) => sd[i] += (v - mu[i]) ** 2 / rows.length));
  return r => r.map((v, i) => (v - mu[i]) / (Math.sqrt(sd[i]) || 1)); }
const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
const cosine = (a, b) => dot(a, b) / (Math.sqrt(dot(a, a) * dot(b, b)) || 1);
function pearson(a, b){ const n = a.length, ma = a.reduce((s, v) => s + v, 0) / n, mb = b.reduce((s, v) => s + v, 0) / n;
  let sab = 0, saa = 0, sbb = 0; for(let i = 0; i < n; i++){ const x = a[i] - ma, y = b[i] - mb; sab += x * y; saa += x * x; sbb += y * y; } return sab / Math.sqrt(saa * sbb); }
/* draw a gray image (values 0..1) into a box */
function grayCanvas(im, n){ const c = document.createElement('canvas'); c.width = c.height = n; const x = c.getContext('2d'), d = x.createImageData(n, n);
  for(let i = 0; i < n * n; i++){ const g = Math.round(255 * im[i]); d.data[4 * i] = d.data[4 * i + 1] = d.data[4 * i + 2] = g; d.data[4 * i + 3] = 255; }
  x.putImageData(d, 0, 0); return c; }
/* ---- end of shared toy set ---- */

const SET = toySet(8), Z = standardizer(SET.map(s => s.raw));
const IMS = [toyImage(1, rng(7001)), toyImage(1, rng(7002)), toyImage(0, rng(7003))];
const EMB = IMS.map(im => embedRaw(im)), ZE = EMB.map(Z);
const MAPS = BANK.map(b => energyMap(IMS[0], 32, b, 1));
const pix = (i, j) => pearson(IMS[i], IMS[j]), sim = (i, j) => cosine(ZE[i], ZE[j]);
const f2 = v => (v < 0 ? '−' : '') + Math.abs(v).toFixed(2);
const EMAX = Math.max(...EMB.flat());

const CAPS = ['', 'an image: 32 × 32 pixels', 'a bank of 8 filters', '8 feature maps', 'average each map: 8 numbers', 'same kind, different pixels', 'a different kind'];
const NOTES = [
  "(draft) Title only. On Day 4, a CNN turned an image into feature maps. Today we start from there: how do we get one compact description of a whole image?",
  "(draft) Here is a small image, made in code: vertical stripes. 32 by 32 pixels, so about a thousand numbers.",
  "(draft) We run a bank of filters over it. Here they are hand-designed, the Gabor filters from Day 3: four orientations, at a fine and a coarse scale. In a trained CNN, these would be the learned filters of a layer.",
  "(draft) Each filter gives a feature map: where in the image that filter responds. The vertical filters light up everywhere; the others barely respond.",
  "(draft) Now average each map over the whole image. Eight numbers, one per filter. That list of numbers is an embedding: a point in an 8-dimensional space that stands for the image. A real network does the same at its last layer, with hundreds of maps instead of 8.",
  (`(draft) A second image of vertical stripes, shifted and a bit finer. Pixel by pixel, the two images barely agree: their pixel correlation is ${f2(pix(0, 1))}. But their embeddings are almost the same: similarity ${f2(sim(0, 1))}. Averaging threw away exactly where the stripes are, and kept what kind of pattern it is.`),
  (`(draft) Horizontal stripes: a different kind. The embedding is different too, similarity ${f2(sim(0, 2))}. So distances in embedding space can tell us which images a system treats as alike. That is the idea for the rest of today.`)
];
const NB = NOTES.length - 1;
let beat = 0, t0 = 0;
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
function go(b, jump){ beat = b; t0 = performance.now() - (jump ? 1e9 : 0);
  document.getElementById('dots').innerHTML = [...Array(NB)].map((_, i) => `<i class="${i < b ? 'on' : ''}"></i>`).join(''); }

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function size(){ const d = devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
const txt = (t, x, y, sz, bold, align = 'center', base = 'middle') => { ctx.fillStyle = '#0f172a'; ctx.font = `${bold ? 700 : 400} ${sz}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(t, x, y); };
const IMC = IMS.map(im => grayCanvas(im, 32));
const MAXM = Math.max(...MAPS.map(m => Math.max(...m)));
const MAPC = MAPS.map(m => grayCanvas(m.map(v => 1 - v / MAXM), 32));
const KC = BANK.map(b => { const m = Math.max(...b.ev.map(Math.abs)); return {c: grayCanvas(b.ev.map(v => .5 + .5 * v / m), b.size), n: b.size}; });
function img(c, x, y, s){ ctx.imageSmoothingEnabled = false; ctx.drawImage(c, x, y, s, s); ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 1; ctx.strokeRect(x, y, s, s); }
function bars(e, x, y, w, h, fs){
  const bw = w / e.length;
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x + w, y + h); ctx.stroke();
  e.forEach((v, i) => { const bh = h * v / EMAX; ctx.fillStyle = '#334155'; ctx.fillRect(x + i * bw + bw * .15, y + h - bh, bw * .7, bh); });
  if(fs) for(let i = 0; i < e.length; i++){ ctx.save(); ctx.translate(x + (i + .5) * bw, y + h + 6); ctx.rotate(-Math.PI / 3);
    txt(BANK[i].name, 0, 0, fs * .8, false, 'right', 'middle'); ctx.restore(); }
}

function frame(now){
  if(cv.clientWidth !== W || cv.clientHeight !== H) size();
  const p = Math.min(1, (now - t0) / 900), A = b => beat > b ? 1 : beat === b ? ease(p) : 0;
  ctx.clearRect(0, 0, W, H);
  const fs = Math.max(15, W * .014), big = Math.max(20, W * .019), cmp = A(5), pipe = 1 - cmp;
  /* ACT 1: the pipeline, for image 0 */
  if(pipe > 0){
    const S = Math.min(H * .42, W * .17), y0 = H * .42 - S / 2;
    if(A(1) > 0){ ctx.globalAlpha = A(1) * pipe; img(IMC[0], 0, y0, S); txt('image', S / 2, y0 - 10, fs, true, 'center', 'bottom'); }
    const gx = W * .21, cell = Math.min(W * .045, H * .13), gap = cell * .25;
    if(A(2) > 0){ ctx.globalAlpha = A(2) * pipe; txt('filters', gx + 2 * (cell + gap) - gap / 2, y0 - 10, fs, true, 'center', 'bottom');
      BANK.forEach((b, i) => img(KC[i].c, gx + (i % 4) * (cell + gap), y0 + Math.floor(i / 4) * (cell + gap + fs), cell)); }
    const mx = W * .46;
    if(A(3) > 0){ ctx.globalAlpha = A(3) * pipe; txt('feature maps', mx + 2 * (cell + gap) - gap / 2, y0 - 10, fs, true, 'center', 'bottom');
      MAPC.forEach((c, i) => img(c, mx + (i % 4) * (cell + gap), y0 + Math.floor(i / 4) * (cell + gap + fs), cell)); }
    if(A(4) > 0){ ctx.globalAlpha = A(4) * pipe; const bx = W * .75, bw = W * .22, bh = S * .8;
      txt('embedding: 8 numbers', bx + bw / 2, y0 - 10, fs, true, 'center', 'bottom'); bars(EMB[0], bx, y0, bw, bh, fs); }
    ctx.globalAlpha = 1;
  }
  /* ACT 2: comparison, images as columns with their embeddings below */
  if(cmp > 0){
    const n = beat >= 6 ? 3 : 2, colW = W * .26, S = Math.min(H * .34, colW * .7);
    for(let i = 0; i < 3; i++){ const a = i < 2 ? cmp : A(6); if(a <= 0) continue;
      const cx = W * .04 + i * W * .34, y0 = 0;
      ctx.globalAlpha = a; img(IMC[i], cx + (colW - S) / 2, y0, S); bars(EMB[i], cx, y0 + S + H * .06, colW, H * .2, i === 0 ? fs : 0); }
    /* similarity to the first image, under each column's bars */
    const ys = S + H * .06 + H * .2 + fs * 1.6;
    const pair = (j, a) => { const x = W * .04 + j * W * .34 + colW / 2; ctx.globalAlpha = a;
      txt(`vs the first: pixels r = ${f2(pix(0, j))}`, x, ys, fs, false); txt(`embedding similarity = ${f2(sim(0, j))}`, x, ys + fs * 1.5, fs, true); };
    pair(1, cmp); if(n === 3) pair(2, A(6));
    ctx.globalAlpha = 1;
  }
  ctx.globalAlpha = beat ? Math.min(1, p * 2) : 0; txt(CAPS[beat], 0, H - big * .4, big, true, 'left', 'bottom'); ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

window.embeddingScene = {
  advance(){ if(beat < NB) go(beat + 1); },
  back(){ if(beat > 0) go(beat - 1, true); },
  atStart: () => beat === 0,
  atEnd: () => beat === NB,
  reset(){ go(0, true); },
  resetToEnd(){ go(NB, true); },
  getBeat: () => beat,
  notes: NOTES,
  debug: () => ({pix01: pix(0, 1), sim01: sim(0, 1), pix02: pix(0, 2), sim02: sim(0, 2)})
};
if(window.parent === window){
  addEventListener('keydown', e => { if(['ArrowRight', ' ', 'Enter'].includes(e.key)) embeddingScene.advance(); if(e.key === 'ArrowLeft') embeddingScene.back(); });
  addEventListener('click', () => embeddingScene.advance());
}
go(0, true); requestAnimationFrame(frame);
</script>
</body>
</html>
