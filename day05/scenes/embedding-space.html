<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What does an embedding encode?</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../deck/deck.css">
<style>
  /* Owner: Day 5 encode part. Pattern B. 48 toy images, embedded with the Gabor bank; PCA, k-nearest
     neighbors, K-means and t-SNE are all computed here, at load (seeded). */
  html, body{ background:#fff; }
  .wrap{ position:absolute; inset:0; padding:9vh 6vw 12vh; display:flex; flex-direction:column; gap:2vh; }
  .stagebox{ position:relative; flex:1 1 auto; min-height:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; }
  .dots{ position:fixed; right:2vw; bottom:12px; display:flex; gap:6px; }
  .dots i{ width:7px; height:7px; border-radius:50%; background:#e2e8f0; }
  .dots i.on{ background:#64748b; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t deck-title">What does an embedding encode?</h1>
  <div class="stagebox"><canvas id="cv"></canvas></div>
</div>
<div class="dots" id="dots"></div>
<script>
/* ACT 0  TITLE    (0):   the title alone
   ACT 1  SPACE    (1):   48 images placed by their embeddings (PCA to 2D)
   ACT 2  TOOLS    (2-4): k-nearest neighbors of one image; K-means finds 6 groups; t-SNE map
   ACT 3  PIXELS   (5):   the same t-SNE on raw pixels: the kinds mix
   No data colors: each point is drawn as its own image; groups are dashed ink outlines. */
/* ---- shared toy set (the same block is pasted into each Day 5 scene, so each scene stays self-contained) ----
   Images are made here, seeded: 6 kinds of 32x32 gray texture. The "embedding" is a hand-designed Gabor
   filter bank (4 orientations x 2 scales, as on Day 3), standing in for a network layer: each filter's
   energy map is averaged over the image, giving 8 numbers. */
const FONT = "Calibri, Carlito, 'Helvetica Neue', Arial, sans-serif";
function rng(seed){ return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const gauss = r => Math.sqrt(-2 * Math.log(1 - r())) * Math.cos(2 * Math.PI * r());
const KINDS = ['horizontal stripes', 'vertical stripes', 'diagonal stripes', 'checkers', 'dots', 'rings'];
function toyImage(kind, r, n = 32){
  const f = .09 + .07 * r(), ph = 6.2832 * r(), ph2 = 6.2832 * r(), c = .32 + .12 * r(), cx = n * (.3 + .4 * r()), cy = n * (.3 + .4 * r());
  const im = new Float32Array(n * n), T = 2 * Math.PI * f;
  for(let y = 0; y < n; y++) for(let x = 0; x < n; x++){
    let v;
    if(kind === 0) v = Math.sin(T * y + ph);
    else if(kind === 1) v = Math.sin(T * x + ph);
    else if(kind === 2) v = Math.sin(T * (x + y) * Math.SQRT1_2 + ph);
    else if(kind === 3) v = Math.sign(Math.sin(T * x + ph) * Math.sin(T * y + ph2));
    else if(kind === 4) v = Math.sin(T * x + ph) * Math.sin(T * y + ph2) > .55 ? 1 : -.6;
    else v = Math.sin(T * Math.hypot(x - cx, y - cy) + ph);
    im[y * n + x] = Math.max(0, Math.min(1, .5 + c * v + .05 * gauss(r)));
  }
  return im;
}
/* the filter bank: even and odd Gabors; theta 0 responds to vertical stripes */
const BANK = [];
for(const [lam, sig] of [[4, 1.8], [8, 3.4]]) for(let o = 0; o < 4; o++){
  const th = o * Math.PI / 4, R = Math.ceil(2.2 * sig), size = 2 * R + 1, ev = new Float32Array(size * size), od = new Float32Array(size * size);
  for(let v = 0; v < size; v++) for(let u = 0; u < size; u++){
    const x = u - R, y = v - R, xr = x * Math.cos(th) + y * Math.sin(th), g = Math.exp(-(x * x + y * y) / (2 * sig * sig));
    ev[v * size + u] = g * Math.cos(2 * Math.PI * xr / lam); od[v * size + u] = g * Math.sin(2 * Math.PI * xr / lam);
  }
  const m = ev.reduce((a, b) => a + b) / ev.length; ev.forEach((_, i) => ev[i] -= m);
  for(const k of [ev, od]){ const s = Math.hypot(...k); k.forEach((_, i) => k[i] /= s); }
  BANK.push({R, size, ev, od, th, lam, name: `${o * 45}°, ${lam === 4 ? 'fine' : 'coarse'}`});
}
function energyMap(im, n, b, stride = 1){
  const m = Math.ceil(n / stride), out = new Float32Array(m * m);
  for(let j = 0; j < m; j++) for(let i = 0; i < m; i++){
    const y0 = j * stride, x0 = i * stride; let e = 0, o = 0;
    for(let v = 0; v < b.size; v++){ let yy = y0 + v - b.R; yy = yy < 0 ? 0 : yy >= n ? n - 1 : yy;
      for(let u = 0; u < b.size; u++){ let xx = x0 + u - b.R; xx = xx < 0 ? 0 : xx >= n ? n - 1 : xx;
        const p = im[yy * n + xx] - .5, k = v * b.size + u; e += b.ev[k] * p; o += b.od[k] * p; } }
    out[j * m + i] = Math.hypot(e, o);
  }
  return out;
}
const embedRaw = (im, n = 32) => BANK.map(b => { const m = energyMap(im, n, b, 2); return m.reduce((a, v) => a + v, 0) / m.length; });
/* the standard set: 8 images of each kind, seed 100 + i */
function toySet(per = 8){ const S = []; for(let k = 0; k < KINDS.length; k++) for(let i = 0; i < per; i++){ const im = toyImage(k, rng(100 + k * 50 + i)); S.push({kind: k, im, raw: embedRaw(im)}); } return S; }
/* standardize each embedding dimension over a set; cosine similarity; Pearson correlation */
function standardizer(rows){ const d = rows[0].length, mu = Array(d).fill(0), sd = Array(d).fill(0);
  rows.forEach(r => r.forEach((v, i) => mu[i] += v / rows.length)); rows.forEach(r => r.forEach((v, i) => sd[i] += (v - mu[i]) ** 2 / rows.length));
  return r => r.map((v, i) => (v - mu[i]) / (Math.sqrt(sd[i]) || 1)); }
const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
const cosine = (a, b) => dot(a, b) / (Math.sqrt(dot(a, a) * dot(b, b)) || 1);
function pearson(a, b){ const n = a.length, ma = a.reduce((s, v) => s + v, 0) / n, mb = b.reduce((s, v) => s + v, 0) / n;
  let sab = 0, saa = 0, sbb = 0; for(let i = 0; i < n; i++){ const x = a[i] - ma, y = b[i] - mb; sab += x * y; saa += x * x; sbb += y * y; } return sab / Math.sqrt(saa * sbb); }
/* draw a gray image (values 0..1) into a box */
function grayCanvas(im, n){ const c = document.createElement('canvas'); c.width = c.height = n; const x = c.getContext('2d'), d = x.createImageData(n, n);
  for(let i = 0; i < n * n; i++){ const g = Math.round(255 * im[i]); d.data[4 * i] = d.data[4 * i + 1] = d.data[4 * i + 2] = g; d.data[4 * i + 3] = 255; }
  x.putImageData(d, 0, 0); return c; }
/* ---- end of shared toy set ---- */

const SET = toySet(8), n = SET.length, Zs = standardizer(SET.map(s => s.raw)), EMB = SET.map(s => Zs(s.raw));
const PIX = SET.map(s => Array.from(s.im));
const dist2 = (a, b) => a.reduce((s, v, i) => s + (v - b[i]) ** 2, 0);
/* PCA to 2D (power iteration on the covariance) */
function pca2(X){ const d = X[0].length, mu = Array(d).fill(0); X.forEach(x => x.forEach((v, i) => mu[i] += v / X.length));
  const C = X.map(x => x.map((v, i) => v - mu[i])), comps = [];
  for(let c = 0; c < 2; c++){ let v = Array(d).fill(0).map((_, i) => Math.sin(i + 1 + c));
    for(let it = 0; it < 200; it++){ const w = Array(d).fill(0); C.forEach(x => { const s = dot(x, v); x.forEach((xi, i) => w[i] += s * xi); });
      comps.forEach(u => { const s = dot(w, u); w.forEach((_, i) => w[i] -= s * u[i]); }); const nn = Math.hypot(...w); v = w.map(x => x / nn); }
    comps.push(v); }
  return C.map(x => [dot(x, comps[0]), dot(x, comps[1])]); }
/* k nearest neighbors */
const knn = (X, i, k) => X.map((x, j) => [j, dist2(X[i], x)]).filter(([j]) => j !== i).sort((a, b) => a[1] - b[1]).slice(0, k).map(([j]) => j);
const knnAcc = X => SET.reduce((s, _, i) => s + knn(X, i, 5).filter(j => SET[j].kind === SET[i].kind).length, 0) / (5 * n);
/* K-means (k-means++ init, seeded), keeping each iteration */
function kmeans(X, k, seed){ const r = rng(seed), C = [X[Math.floor(r() * X.length)]];
  while(C.length < k){ const d = X.map(x => Math.min(...C.map(c => dist2(x, c)))), s = d.reduce((a, b) => a + b); let t = r() * s, i = 0; while(t > d[i]){ t -= d[i]; i++; } C.push(X[i]); }
  const steps = []; let lab = [];
  for(let it = 0; it < 25; it++){ const nl = X.map(x => { let b = 0; C.forEach((c, j) => { if(dist2(x, c) < dist2(x, C[b])) b = j; }); return b; });
    steps.push(nl); if(nl.join() === lab.join()) break; lab = nl;
    for(let j = 0; j < k; j++){ const m = X.filter((_, i) => lab[i] === j); if(m.length) C[j] = m[0].map((_, q) => m.reduce((s, x) => s + x[q], 0) / m.length); } }
  return steps; }
const purity = lab => { let s = 0; for(let j = 0; j < 6; j++){ const cnt = Array(6).fill(0); lab.forEach((l, i) => { if(l === j) cnt[SET[i].kind]++; }); s += Math.max(...cnt); } return s / n; };
/* exact t-SNE, keeping snapshots */
const PERP = 20;
function tsne(X, seed, iters = 500){
  const N = X.length, D = X.map(a => X.map(b => dist2(a, b))), Pm = X.map(() => Array(N).fill(0)), target = Math.log(PERP);
  for(let i = 0; i < N; i++){ let lo = 1e-20, hi = 1e20, beta = 1;
    for(let t = 0; t < 60; t++){ let s = 0, h = 0; for(let j = 0; j < N; j++){ if(j === i) continue; const p = Math.exp(-D[i][j] * beta); Pm[i][j] = p; s += p; }
      for(let j = 0; j < N; j++){ if(j === i) continue; Pm[i][j] /= s; if(Pm[i][j] > 1e-12) h -= Pm[i][j] * Math.log(Pm[i][j]); }
      if(Math.abs(h - target) < 1e-4) break; if(h > target){ lo = beta; beta = hi > 1e19 ? beta * 2 : (beta + hi) / 2; } else { hi = beta; beta = (beta + lo) / 2; } } }
  const Psym = Pm.map((row, i) => row.map((v, j) => (v + Pm[j][i]) / (2 * N)));
  const r = rng(seed); let Y = X.map(() => [1e-2 * gauss(r), 1e-2 * gauss(r)]); const U = Y.map(() => [0, 0]), snaps = [];
  for(let it = 0; it < iters; it++){
    const ex = it < 100 ? 4 : 1, mom = it < 100 ? .5 : .8, Qn = Y.map(a => Y.map(b => 1 / (1 + dist2(a, b)))); let Z = 0;
    for(let i = 0; i < N; i++) for(let j = 0; j < N; j++) if(i !== j) Z += Qn[i][j];
    Y = Y.map((y, i) => { let gx = 0, gy = 0; for(let j = 0; j < N; j++){ if(j === i) continue; const m = 4 * (ex * Psym[i][j] - Qn[i][j] / Z) * Qn[i][j]; gx += m * (y[0] - Y[j][0]); gy += m * (y[1] - Y[j][1]); }
      U[i][0] = mom * U[i][0] - 30 * gx; U[i][1] = mom * U[i][1] - 30 * gy; return [y[0] + U[i][0], y[1] + U[i][1]]; });
    if(it % 5 === 4) snaps.push(Y.map(y => [...y]));
  }
  return snaps; }
const norm = Y => { const xs = Y.map(y => y[0]), ys = Y.map(y => y[1]), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), s = Math.max(x1 - x0, y1 - y0) || 1;
  return Y.map(([x, y]) => [(x - (x0 + x1) / 2) / s + .5, (y - (y0 + y1) / 2) / s + .5]); };
const PCA = norm(pca2(EMB)), KM = kmeans(EMB, 6, 3), TS = tsne(EMB, 5).map(norm), TP = tsne(PIX, 5).map(norm);
const QI = 1 * 8 + 3, NN = knn(EMB, QI, 5), NNsame = NN.filter(j => SET[j].kind === SET[QI].kind).length;
const ACC_E = knnAcc(EMB), ACC_P = knnAcc(PIX), PUR = purity(KM[KM.length - 1]);
const pct = v => `${Math.round(v * 100)}%`;

const CAPS = ['', '48 images, placed by their embeddings', `k-nearest neighbors: ${NNsame} of 5 are the same kind`, `K-means, 6 groups: ${pct(PUR)} agree with the kinds`, 't-SNE: a map that keeps neighbors together', `the same map from raw pixels: the kinds mix`];
const NOTES = [
  "(draft) Title only. We can turn any image into an embedding. What can we learn from the space those points live in?",
  "(draft) Here are 48 toy images, 8 of each of six kinds, each placed by its 8-number embedding. The embedding has 8 dimensions and the screen has 2, so we squash it with PCA, which keeps the two directions where the points spread out most.",
  (`(draft) First tool: nearest neighbors. Take one image and find the 5 images closest to it in the full 8-dimensional space. Here ${NNsame} of the 5 are the same kind. Over all 48 images, ${pct(ACC_E)} of the neighbors are the same kind. That is also a simple classifier, and a simple image search.`),
  (`(draft) Second tool: K-means. Ask for 6 groups, without telling it the kinds. It places 6 centers, assigns each image to the nearest center, moves the centers, and repeats. ${pct(PUR)} of the images end up in a group dominated by their own kind.`),
  "(draft) Third tool: t-SNE. It builds a 2D map where images that are neighbors in the embedding stay neighbors on the screen. It starts from random positions and moves the points step by step. Distances between far-apart groups on a t-SNE map do not mean much; the neighborhoods do.",
  (`(draft) Now the same t-SNE, run on the raw pixels instead of the embedding. The kinds mix: only ${pct(ACC_P)} of pixel neighbors are the same kind, against ${pct(ACC_E)} for the embedding. Same images, same tools, different representation. What a representation keeps and throws away decides what is similar to what.`)
];
const NB = NOTES.length - 1;
const DUR = b => b === 3 ? 3000 : b === 4 || b === 5 ? 4500 : 900;
let beat = 0, t0 = 0;
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
function go(b, jump){ beat = b; t0 = performance.now() - (jump ? 1e9 : 0);
  document.getElementById('dots').innerHTML = [...Array(NB)].map((_, i) => `<i class="${i < b ? 'on' : ''}"></i>`).join(''); }

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function size(){ const d = devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
const txt = (t, x, y, sz, bold, align = 'center', base = 'middle') => { ctx.fillStyle = '#0f172a'; ctx.font = `${bold ? 700 : 400} ${sz}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(t, x, y); };
const THUMB = SET.map(s => grayCanvas(s.im, 32));
function hull(pts){ pts = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]); if(pts.length < 3) return pts;
  const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]), lo = [], up = [];
  for(const p of pts){ while(lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for(const p of pts.slice().reverse()){ while(up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  return lo.slice(0, -1).concat(up.slice(0, -1)); }

function positions(p){
  if(beat < 4) return PCA;
  const S = beat === 5 ? TP : TS, from = beat === 5 ? TS[TS.length - 1] : PCA;
  if(p < .15){ const q = ease(p / .15), to = S[0]; return from.map((a, i) => [a[0] + (to[i][0] - a[0]) * q, a[1] + (to[i][1] - a[1]) * q]); }
  return S[Math.min(S.length - 1, Math.floor((p - .15) / .85 * S.length))];
}
function frame(now){
  if(cv.clientWidth !== W || cv.clientHeight !== H) size();
  const p = Math.min(1, (now - t0) / DUR(beat)), A = b => beat > b ? 1 : beat === b ? ease(Math.min(1, (now - t0) / 900)) : 0;
  ctx.clearRect(0, 0, W, H);
  const fs = Math.max(16, W * .015), big = Math.max(20, W * .019);
  const S = Math.min(H * .94, W * .56), th = Math.max(18, S * .055), pad = th, X0 = 0, Y0 = 0;
  const pos = positions(p), M = ([x, y]) => [X0 + pad + x * (S - 2 * pad), Y0 + pad + y * (S - 2 * pad)];
  if(A(1) > 0){
    ctx.globalAlpha = A(1); ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1; ctx.strokeRect(X0, Y0, S, S);
    /* K-means outlines (beat 3 only) */
    if(beat === 3){ const lab = KM[Math.min(KM.length - 1, Math.floor(p * KM.length))];
      for(let j = 0; j < 6; j++){ const h = hull(pos.filter((_, i) => lab[i] === j).map(M)); if(h.length < 2) continue;
        ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2; ctx.setLineDash([7, 5]); ctx.beginPath(); h.forEach((q, k) => k ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0] - 0, q[1])); ctx.closePath(); ctx.stroke(); ctx.setLineDash([]); } }
    /* k-NN lines (beat 2 only) */
    if(beat === 2){ const [qx, qy] = M(pos[QI]); ctx.globalAlpha = A(2); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2.5;
      NN.forEach(j => { const [u, v] = M(pos[j]); ctx.beginPath(); ctx.moveTo(qx, qy); ctx.lineTo(u, v); ctx.stroke(); }); ctx.globalAlpha = A(1); }
    ctx.imageSmoothingEnabled = false;
    pos.forEach((q, i) => { const [u, v] = M(q); const dim = beat === 2 && i !== QI && !NN.includes(i) ? .35 : 1; ctx.globalAlpha = A(1) * dim;
      ctx.drawImage(THUMB[i], u - th / 2, v - th / 2, th, th); ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1; ctx.strokeRect(u - th / 2, v - th / 2, th, th); });
    if(beat === 2){ const [u, v] = M(pos[QI]); ctx.globalAlpha = 1; ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 4; ctx.strokeRect(u - th / 2 - 4, v - th / 2 - 4, th + 8, th + 8); }
    ctx.globalAlpha = 1;
  }
  /* right side */
  const rx = S + W * .05, rw = W - rx;
  if(beat === 2){ ctx.globalAlpha = A(2); const big2 = Math.min(rw / 6.6, H * .16);
    txt('query', rx, H * .08, fs, true, 'left'); ctx.drawImage(THUMB[QI], rx, H * .08 + fs, big2, big2);
    txt('its 5 nearest neighbors', rx, H * .08 + fs * 2 + big2 + H * .04, fs, true, 'left');
    NN.forEach((j, k) => ctx.drawImage(THUMB[j], rx + k * big2 * 1.12, H * .08 + fs * 3 + big2 + H * .04, big2, big2)); ctx.globalAlpha = 1; }
  if(beat === 5){ ctx.globalAlpha = A(5); txt('same kind among 5 nearest neighbors', rx, H * .2, fs, true, 'left');
    txt(`embedding: ${pct(ACC_E)}`, rx, H * .2 + fs * 2, big, false, 'left'); txt(`raw pixels: ${pct(ACC_P)}`, rx, H * .2 + fs * 3.8, big, false, 'left'); ctx.globalAlpha = 1; }
  ctx.globalAlpha = beat ? Math.min(1, (now - t0) / 450) : 0; txt(CAPS[beat], rx, H - big * .4, Math.min(big, rw / 22), true, 'left', 'bottom'); ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}

window.embeddingSpace = {
  advance(){ if(beat < NB) go(beat + 1); },
  back(){ if(beat > 0) go(beat - 1, true); },
  atStart: () => beat === 0,
  atEnd: () => beat === NB,
  reset(){ go(0, true); },
  resetToEnd(){ go(NB, true); },
  getBeat: () => beat,
  notes: NOTES,
  debug: () => ({ACC_E, ACC_P, PUR, NNsame, kmIters: KM.length, tsneSnaps: TS.length})
};
if(window.parent === window){
  addEventListener('keydown', e => { if(['ArrowRight', ' ', 'Enter'].includes(e.key)) embeddingSpace.advance(); if(e.key === 'ArrowLeft') embeddingSpace.back(); });
  addEventListener('click', () => embeddingSpace.advance());
}
go(0, true); requestAnimationFrame(frame);
</script>
</body>
</html>
