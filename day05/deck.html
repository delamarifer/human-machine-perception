<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Day 5 · Transformers and Visual Representations</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/* cache-bust while editing, so nobody presents a stale file */
document.write(`<link rel="stylesheet" href="../deck/deck.css?v=${Date.now()}">`);
document.write(`<script src="../deck/engine.js?v=${Date.now()}"><\/script><script src="order.js?v=${Date.now()}"><\/script>`);</script>
<style>
/* Barebone Day 5. Same open type as Day 4: a left rule, not filled cards. Orange marks the one thing to look at. */
:root{ --hi:#d97706; }
.stage{ padding:8vh 5.5vw 10vh; gap:2vh; }
.stage > h1.t{ flex-shrink:0; }
.cols{ flex:1 1 auto; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:2.4vw 3vw; align-content:center; }
.card{ border-left:4px solid var(--line); padding:.2vh 0 .2vh 1.1vw; }
.card.hi{ border-left-color:var(--hi); }
.card .k{ font-weight:700; font-size:clamp(1.25rem, 2vw, 1.7rem); line-height:1.25; }
.card .label{ margin-top:.4vh; line-height:1.35; }
.agenda{ flex:1 1 auto; min-height:0; display:grid; grid-template-columns:1fr 1fr; gap:1.6vh 3vw; align-content:start; padding-top:1vh; }
.agenda .row{ display:grid; grid-template-columns:2.4em 1fr; gap:.7vw; align-items:baseline; font-size:clamp(1.25rem, 2vw, 1.75rem); line-height:1.35; }
.agenda .n{ font-weight:700; color:var(--mute); font-variant-numeric:tabular-nums; }
.tbl{ border-collapse:collapse; width:100%; font-size:clamp(1.05rem, 1.55vw, 1.4rem); line-height:1.3; }
.tbl th{ text-align:left; font-size:.78em; letter-spacing:.04em; text-transform:uppercase; color:var(--mute); padding:.7vh .9vw; border-bottom:2px solid var(--line); }
.tbl td{ padding:1.15vh .9vw; border-bottom:1px solid var(--line); vertical-align:top; }
.tbl td:first-child{ font-weight:700; width:24%; }
.flow .step.hi{ border-color:var(--hi); }
</style>
</head>
<body>
<div id="root"></div>
<div id="secbar"></div>
<div id="hud"></div>
<div id="notes"><div id="notes-body"></div></div>
<script>
/* WORKING deck: loads everyone's live drafts from parts/. Preview parts with ?only=intro,thanks */
loadParts('parts', PARTS, {minutes: SEC_MINUTES});
</script>
</body>
</html>
