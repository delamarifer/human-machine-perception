<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Problem Setup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../deck/deck.css">
<style>
  /* Part adapt (Day 7), Problem Setup as a scene (Shreya, 2026-11-09: "Last season and then animate to what is there").
     The scenario, the two definitions and f, f' are Foundations of Computer Vision, section 37.2 (wheat and corn; next season
     soybeans replace corn). The farm, the drone and the photos are our drawings. f calling a soybean field "corn" is our
     illustration of the problem: f can only answer with the classes it was trained on.
     Motion runs only right after a click (the drone's flight, the crop change); nothing advances by itself. */
  html, body{ background:#fff; }
  .wrap{ position:absolute; inset:0; padding:7.2vh 5.2vw 9.5vh; display:flex; flex-direction:column; gap:1.5vh; }
  svg.setup{ flex:1 1 auto; min-height:0; width:100%; display:block; }
  svg.setup text{ font-family:var(--font); fill:var(--ink); }
  .cite{ font-size:clamp(.8rem, 1.12vw, 1.15rem); color:var(--mute); opacity:0; transition:opacity .4s; }
  .cite.on{ opacity:1; }
  .cite a{ color:var(--mute); }

  .it{ opacity:0; transition:opacity .6s ease; }
  .it.on{ opacity:1; }
  .xfade{ transition:opacity 1.2s ease; }

  /* crops: corn shrinks away, soybeans grow, both from the ground up */
  .crop{ transform-box:fill-box; transform-origin:50% 100%; transition:transform 1.4s ease, opacity 1.4s ease; }
  .corn.gone{ transform:scaleY(0); opacity:0; }
  .soy{ transform:scale(0); opacity:0; transition-delay:.7s; }
  .soy.on{ transform:none; opacity:1; }

  /* the drone flies in after a click, then hovers over the second field */
  .drone{ transform:translate(var(--hx), 0); }
  .drone.fly{ animation:fly 2.4s ease-out both; }
  @keyframes fly{ from{ transform:translate(-160px, 30px); } to{ transform:translate(var(--hx), 0); } }
  .drone .rotor{ transform-box:fill-box; transform-origin:50% 50%; animation:spin .25s linear infinite; }
  @keyframes spin{ from{ transform:scaleX(1); } 50%{ transform:scaleX(.3); } to{ transform:scaleX(1); } }
  .beam{ opacity:0; transition:opacity .5s ease 2.2s; }
  .beam.on{ opacity:1; }

  /* f' grows out of f */
  .copy{ transition:transform 1.2s ease, opacity .6s ease; }
  .copy.down{ transform:translate(0, 200px); }
  @media (prefers-reduced-motion: reduce){ .drone.fly{ animation:none; } .crop, .copy, .soy{ transition:none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t deck-title">Problem Setup</h1>
  <svg class="setup" viewBox="0 0 1200 560" role="img" aria-label="Last season, a drone photographs a field of wheat and a field of corn, and a classifier f labels the photo corn. This season soybeans replace the corn; f can still only answer wheat or corn, so it calls the soybeans corn. A new classifier f prime starts from f and answers soybeans.">
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f172a"/></marker>
      <clipPath id="fieldB"><rect x="370" y="250" width="300" height="190"/></clipPath>
      <clipPath id="thumb"><rect x="0" y="0" width="120" height="90" rx="4"/></clipPath>
    </defs>

    <!-- ===== the farm (beat 1 on) ===== -->
    <g class="it" data-from="1">
      <rect x="20" y="40" width="680" height="210" fill="#eef4f9"/>
      <rect x="20" y="250" width="680" height="200" fill="#e6dcc6"/>
      <text class="xfade" id="lastLbl" x="36" y="80" font-size="30" font-weight="700">Last season</text>
      <text class="xfade" id="thisLbl" x="36" y="80" font-size="30" font-weight="700" opacity="0">This season: corn → soybeans</text>

      <!-- field A: wheat -->
      <rect x="40" y="250" width="300" height="190" fill="#f3e3a8" stroke="#0f172a" stroke-width="2"/>
      <g id="wheat"></g>
      <text x="190" y="480" font-size="24" text-anchor="middle">wheat</text>

      <!-- field B: corn, then soybeans -->
      <rect x="370" y="250" width="300" height="190" fill="#dcebd2" stroke="#0f172a" stroke-width="2"/>
      <g clip-path="url(#fieldB)"><g class="crop corn" id="corn"></g><g class="crop soy" id="soy"></g></g>
      <text class="xfade" id="cornLbl" x="520" y="480" font-size="24" text-anchor="middle">corn</text>
      <text class="xfade" id="soyLbl" x="520" y="480" font-size="24" text-anchor="middle" opacity="0">soybeans</text>

      <!-- the drone and its camera footprint over field B -->
      <polygon class="beam" id="beam" points="508,168 532,168 650,262 390,262" fill="#0f172a" opacity="0" style="fill-opacity:.07"/>
      <g class="drone" id="drone" style="--hx:520px">
        <g transform="translate(0,150)">
          <rect x="-30" y="-10" width="60" height="20" rx="8" fill="#0f172a"/>
          <line x1="-30" y1="-6" x2="-48" y2="-16" stroke="#0f172a" stroke-width="4"/><line x1="30" y1="-6" x2="48" y2="-16" stroke="#0f172a" stroke-width="4"/>
          <ellipse class="rotor" cx="-48" cy="-18" rx="20" ry="3" fill="#64748b"/><ellipse class="rotor" cx="48" cy="-18" rx="20" ry="3" fill="#64748b"/>
          <circle cx="0" cy="14" r="7" fill="#64748b"/>
        </g>
      </g>
    </g>

    <g transform="translate(-50,0)">
    <!-- ===== the classifier (beat 1 on) ===== -->
    <g class="it" data-from="1" style="transition-delay:1.6s">
      <g transform="translate(740,110)">
        <g clip-path="url(#thumb)">
          <rect width="120" height="90" fill="#dcebd2"/>
          <g class="crop corn" id="cornT"></g><g class="crop soy" id="soyT"></g>
        </g>
        <rect width="120" height="90" rx="4" fill="none" stroke="#0f172a" stroke-width="2.5"/>
        <text x="60" y="118" font-size="20" text-anchor="middle">photo</text>
      </g>
      <line x1="866" y1="155" x2="912" y2="155" stroke="#0f172a" stroke-width="3" marker-end="url(#ah)"/>
      <rect x="920" y="120" width="110" height="70" rx="6" fill="#f3d79f" stroke="#0f172a" stroke-width="2.5"/>
      <text x="975" y="166" font-size="32" font-style="italic" text-anchor="middle">f</text>
      <line x1="1036" y1="155" x2="1070" y2="155" stroke="#0f172a" stroke-width="3" marker-end="url(#ah)"/>
      <text class="xfade" id="fOk" x="1078" y="164" font-size="26" font-weight="700">corn ✓</text>
      <text class="xfade" id="fBad" x="1078" y="164" font-size="26" font-weight="700" opacity="0">corn ✗</text>
      <text x="1078" y="194" font-size="19" fill="#64748b">{wheat, corn}</text>
    </g>

    <!-- ===== beat 2: f can only say what it learned ===== -->
    <g class="it" data-from="2" style="transition-delay:2.2s">
      <text x="1078" y="222" font-size="18" fill="#64748b">has never</text><text x="1078" y="244" font-size="18" fill="#64748b">seen soybeans</text>
    </g>

    <!-- ===== beat 3: f' starts from f ===== -->
    <g class="it" data-from="3">
      <g class="copy" id="copy">
        <rect x="920" y="120" width="110" height="70" rx="6" fill="#f1a3a9" stroke="#0f172a" stroke-width="2.5"/>
        <text x="975" y="166" font-size="32" font-style="italic" text-anchor="middle">f′</text>
      </g>
    </g>
    <g class="it" data-from="3" style="transition-delay:1.1s">
      <line x1="934" y1="196" x2="934" y2="312" stroke="#0f172a" stroke-width="3" marker-end="url(#ah)"/>
      <text x="920" y="262" font-size="20" font-weight="700" text-anchor="end">start from f,</text>
      <text x="920" y="288" font-size="20" font-weight="700" text-anchor="end">not from scratch</text>
      <line x1="1036" y1="355" x2="1070" y2="355" stroke="#0f172a" stroke-width="3" marker-end="url(#ah)"/>
      <text x="1078" y="364" font-size="26" font-weight="700">soybeans ✓</text>
      <text x="1078" y="392" font-size="18" fill="#64748b">{wheat, soybeans}</text>
    </g>

    </g>

    <!-- ===== beat 4: the two names ===== -->
    <g class="it" data-from="4">
      <text x="20" y="522" font-size="24"><tspan font-weight="700">Pretraining:</tspan> how to acquire prior knowledge in the first place</text>
      <text x="20" y="554" font-size="24"><tspan font-weight="700">Adaptation:</tspan> how to use prior knowledge to solve a new task</text>
      <text x="1180" y="554" font-size="22" text-anchor="end" fill="#64748b">f: 𝒳 → 𝒴 · f′: 𝒳′ → 𝒴′</text>
    </g>
  </svg>
  <div class="cite" data-from="1"><a href="https://visionbook.mit.edu/transfer_learning.html" target="_blank" rel="noopener" onclick="event.stopPropagation()">Foundations of Computer Vision, Ch. 37</a>, section 37.2, the farm and drone example · CC BY-NC-ND 4.0 · farm, drone and photos: our drawings</div>
</div>

<script>
/* crops, drawn once */
const NS = 'http://www.w3.org/2000/svg';
const add = (g, tag, a) => { const e = document.createElementNS(NS, tag); for(const k in a) e.setAttribute(k, a[k]); g.appendChild(e); return e; };
const wheat = document.getElementById('wheat');
for(let r = 0; r < 9; r++) add(wheat, 'line', {x1: 56, y1: 268 + r * 20, x2: 324, y2: 268 + r * 20, stroke: '#b08d2e', 'stroke-width': 6, 'stroke-dasharray': '5 6'});
const corn = (g, x0, y0, w, h, s) => { for(let c = 0; c < Math.round(w / (34 * s)); c++){ const x = x0 + 16 * s + c * 34 * s;
  add(g, 'line', {x1: x, y1: y0 + h, x2: x, y2: y0 + 8 * s, stroke: '#3f7a3a', 'stroke-width': 6 * s});
  for(let k = 0; k < 3; k++){ const y = y0 + h - 40 * s - k * 45 * s; add(g, 'path', {d: `M ${x} ${y} q ${(k % 2 ? -1 : 1) * 16 * s} ${-14 * s} ${(k % 2 ? -1 : 1) * 26 * s} ${-6 * s}`, fill: 'none', stroke: '#4f9a48', 'stroke-width': 4 * s}); } } };
const soy = (g, x0, y0, w, h, s) => { for(let r = 0; r < Math.round(h / (36 * s)); r++) for(let c = 0; c < Math.round(w / (36 * s)); c++){
  const x = x0 + 18 * s + c * 36 * s, y = y0 + 22 * s + r * 36 * s;
  add(g, 'circle', {cx: x, cy: y, r: 11 * s, fill: '#6aa84f'}); add(g, 'circle', {cx: x - 7 * s, cy: y + 4 * s, r: 7 * s, fill: '#7dbb5f'}); } };
corn(document.getElementById('corn'), 370, 250, 300, 190, 1);
soy(document.getElementById('soy'), 370, 250, 300, 190, 1);
corn(document.getElementById('cornT'), 0, 0, 120, 90, .45);
soy(document.getElementById('soyT'), 0, 0, 120, 90, .45);

/* BEAT 0  title only
   BEAT 1  last season: the farm appears, the drone flies in and photographs the corn, f answers "corn ✓"
   BEAT 2  this season: the corn turns into soybeans, the drone flies again, f still answers "corn" (✗): it has never seen soybeans
   BEAT 3  f′ grows out of f and answers "soybeans ✓": start from f, not from scratch
   BEAT 4  the two names: pretraining and adaptation
   A click sets the beat; going back shows each beat's end state with no motion. */
const NB = 4;
let beat = 0;
const $ = id => document.getElementById(id);
function fly(animate){
  const d = $('drone'), b = $('beam');
  d.classList.remove('fly'); b.classList.remove('on'); b.style.transitionDelay = animate ? '' : '0s';
  if(animate){ void d.getBoundingClientRect(); d.classList.add('fly'); }
  requestAnimationFrame(() => b.classList.add('on'));
}
function go(n, animate){
  const prev = beat; beat = n;
  document.querySelectorAll('[data-from]').forEach(e => {
    const from = +e.dataset.from, to = e.dataset.to ? +e.dataset.to : NB;
    if(!animate) e.style.transition = 'none';
    e.classList.toggle('on', n >= from && n <= to);
    if(!animate){ void e.getBoundingClientRect(); e.style.transition = ''; }
  });
  const season = n >= 2;
  document.querySelectorAll('.crop').forEach(e => { if(!animate) e.style.transition = 'none'; });
  document.querySelectorAll('.corn').forEach(e => e.classList.toggle('gone', season));
  document.querySelectorAll('.soy').forEach(e => e.classList.toggle('on', season));
  $('lastLbl').setAttribute('opacity', season ? 0 : 1); $('thisLbl').setAttribute('opacity', season ? 1 : 0);
  $('cornLbl').setAttribute('opacity', season ? 0 : 1); $('soyLbl').setAttribute('opacity', season ? 1 : 0);
  $('fOk').setAttribute('opacity', season ? 0 : 1); $('fBad').setAttribute('opacity', season ? 1 : 0);
  const c = $('copy'); if(!animate) c.style.transition = 'none'; c.classList.toggle('down', n >= 3);
  if(!animate){ document.body.getBoundingClientRect(); document.querySelectorAll('.crop').forEach(e => e.style.transition = ''); c.style.transition = ''; }
  if(n >= 1) fly(animate && (n === 1 || n === 2) && n > prev); else $('beam').classList.remove('on');
}
window.adaptSetup = {
  advance(){ if(beat < NB) go(beat + 1, true); },
  back(){ if(beat > 0) go(beat - 1, false); },
  atStart: () => beat === 0,
  atEnd: () => beat === NB,
  reset(){ go(0, false); },
  resetToEnd(){ go(NB, false); },
  getBeat: () => beat,
};
if(window.parent === window){
  addEventListener('keydown', e => { if(['ArrowRight', ' ', 'Enter'].includes(e.key)) adaptSetup.advance(); if(e.key === 'ArrowLeft') adaptSetup.back(); });
  addEventListener('click', () => adaptSetup.advance());
}
go(0, false);
</script>
</body>
</html>
