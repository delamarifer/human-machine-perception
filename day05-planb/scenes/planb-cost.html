<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The cost of global attention</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../deck/deck.css">
<script>document.write(`<link rel="stylesheet" href="planb-scene.css?v=${Date.now()}"><script src="planb-lib.js?v=${Date.now()}"><\/script>`);</script>
</head>
<body>
<!-- Owner: day05-planb. Video 4:10 to 4:51: with 16 x 16 patches, the number of attention values per layer
     for images of 128, 256, 512 and 2048 pixels on a side. The image sizes and the counting (patches x
     patches) follow the video; every number is computed here. -->
<div class="planb-wrap">
  <h1 class="t deck-title">The cost of global attention</h1>
  <div class="planb-stage"><canvas id="cv"></canvas></div>
  <div class="lead planb-cap" id="cap"></div>
  <div class="cite" id="credit"></div>
</div>
<div class="planb-dots" id="dots"></div>
<script>
document.getElementById('credit').textContent = PB.CREDIT;
const SIDES = [128, 256, 512, 2048], P = 16;
const fmt = n => n.toLocaleString('en-US');
const CAPS = ['',
  'Patches of 16 × 16 pixels: a 128-pixel image gives 64 patches',
  'Double the side: 4 times the patches, 16 times the attention',
  '512 pixels on a side',
  '2048 pixels on a side',
  'Attention grows with the square of the number of patches',
  'What could replace global attention for large images?'];
const NOTES = [
  "(draft) Title only. Global attention has a price, and the video shows it by making the image bigger.",
  "(draft) Back to the paper's patch size, 16 by 16 pixels. The video keeps the patch size fixed, because much larger patches would each hold too much for the model to understand well. A 128 by 128 image then gives 8 by 8, 64 patches, the same grid as before. Every patch attends to every patch, so 64 times 64: 4,096 attention values in each layer. These image sizes come from the video; the arithmetic is on screen.",
  "(draft) Double the side to 256. Now 16 by 16, 256 patches, and 256 times 256: 65,536 attention values per layer. Twice the side, four times the patches, sixteen times the attention.",
  "(draft) 512 pixels on a side: 1,024 patches, over a million attention values per layer.",
  "(draft) And 2048 pixels, a size that is ordinary for medical or satellite images: 16,384 patches and about 268 million attention values, in every layer. The grid has become so fine it is just a gray haze.",
  "(draft) In short: the number of patches grows with the square of the side, and attention grows with the square of the number of patches. That makes the plain Vision Transformer a poor fit for high-resolution images.",
  "(draft) The video ends this part with a question, so let us ask the class: what could you do instead? Possible answers beyond the video: attend only within local windows, as the Swin Transformer does, or build a hierarchy that merges patches as it goes up. Take a few answers before moving on."
];
planbScene('planbCost', {
  notes: NOTES, caps: CAPS, durs: [0, 1000, 1000, 1000, 1200, 1000, 800],
  draw({ctx, W, H, beat, t, e, cat}){
    const S = Math.min(H * .86, W * .38), ix = W * .08, iy = H * .10, fs = Math.max(16, H * .05);
    const si = Math.min(beat, 4) - 1, side = SIDES[si], n = side / P, N = n * n;
    PB.drawImageSquare(ctx, cat.im, ix, iy, S, false);
    const ga = (beat >= 2 && beat <= 4) ? e : 1;
    ctx.globalAlpha = ga; PB.grid(ctx, ix, iy, S, n, n > 40 ? 'rgba(255,255,255,.75)' : 'rgba(255,255,255,.95)', n > 40 ? .8 : 1.5); ctx.globalAlpha = 1;
    ctx.strokeStyle = PB.INK; ctx.lineWidth = 1.5; ctx.strokeRect(ix, iy, S, S);
    // size marks
    ctx.strokeStyle = PB.INK; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(ix, iy - H * .03); ctx.lineTo(ix + S, iy - H * .03); ctx.moveTo(ix - W * .015, iy); ctx.lineTo(ix - W * .015, iy + S); ctx.stroke();
    PB.text(ctx, String(side), ix + S / 2, iy - H * .065, fs, {w: 700});
    PB.text(ctx, String(side), ix - W * .022, iy + S / 2, fs, {w: 700, align: 'right'});
    const rx = ix + S + W * .06, lines = [
      ['Image', `${side} × ${side} pixels`],
      ['Patch', '16 × 16 pixels'],
      ['Patches', `${n} × ${n} = ${fmt(N)}`],
      ['Attention values per layer', `${fmt(N)} × ${fmt(N)} = ${fmt(N * N)}`]];
    if(beat <= 4){
      lines.forEach(([k, v], i) => {
        const y = H * .16 + i * H * .17, a = beat === 1 ? PB.seg(t, i * 180, 500 + i * 180) : (i === 1 ? 1 : (beat <= 4 ? PB.seg(t, 200, 700) : 1));
        PB.text(ctx, k, rx, y, fs * .85, {color: PB.MUTE, align: 'left'});
        PB.text(ctx, v, rx, y + fs * 1.05, fs * 1.15, {w: 700, align: 'left', alpha: a});
      });
      return;
    }
    // beats 5-6: the four sizes side by side
    const rows = SIDES.map(s => { const m = s / P, M = m * m; return [`${s} × ${s}`, fmt(M), fmt(M * M)]; });
    const cx = [rx, rx + W * .13, rx + W * .25], ty = H * .14, rh = H * .11;
    ['Image', 'Patches', 'Attention values'].forEach((h, j) => PB.text(ctx, h, cx[j], ty, fs * .8, {color: PB.MUTE, align: 'left'}));
    rows.forEach((r, i) => r.forEach((v, j) => PB.text(ctx, v, cx[j], ty + (i + 1) * rh, fs, {w: j === 2 ? 700 : 400, align: 'left', alpha: beat === 5 ? PB.seg(t, i * 150, 500 + i * 150) : 1})));
  }
});
</script>
</body>
</html>
