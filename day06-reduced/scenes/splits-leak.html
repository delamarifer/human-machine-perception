<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data leakage</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../deck/deck.css">
<style>
  /* Owner: splits part (Day 6 reduced). Google p38. Same strip, drawn by the same code, as the cross-validation scene (assets/splits/folds.js). */
  html, body{ background:#fff; }
  .wrap{ position:absolute; inset:0; padding:7.2vh 5.2vw 9.5vh; display:flex; flex-direction:column; gap:1.5vh; }
  .splits-box{ position:relative; flex:1 1 auto; min-height:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; visibility:hidden; }
  .cite{ position:static; font-size:clamp(.8rem, 1.12vw, 1.15rem); color:var(--mute); transition:opacity .4s; }
  .cite a{ color:inherit; }
  .dots{ position:fixed; right:2vw; bottom:12px; display:flex; gap:6px; }
  .dots i{ width:7px; height:7px; border-radius:50%; background:#e2e8f0; }
  .dots i.on{ background:#64748b; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t deck-title">Data leakage</h1>
  <div class="splits-box"><canvas id="cv"></canvas></div>
  <div class="cite" id="cite" style="opacity:0">Toy example, scores computed · ranking "most common": source to add · leakage found in 294 papers across 17 fields: <a href="https://doi.org/10.1016/j.patter.2023.100804" target="_blank" rel="noopener">Kapoor and Narayanan (Patterns 2023)</a></div>
</div>
<div class="dots" id="dots"></div>
<script src="../assets/splits/folds.js"></script>
<script>
/* BEATS
   1  the strip and its score; an arrow from test into training
   2  normalizing on the full dataset before splitting: the mean is computed over test too
   3  duplicates across splits: two training points are copied into test
   4  features that encode the label: an extra row equal to the label
   5  leaks removed, the score falls back: her "most common reason" claim as a cue */
const P = SPLITS, {INK, MUTE, VAL, LEAK, txt, ease, lerp, FOLD} = P;
const NB = 5;
const D = P.makeData(98);                /* same toy data and seed as the cross-validation scene */
const TESTF = 4, order = D.base, testIds = P.foldIds(order, TESTF), trainIds = order.filter(id => !testIds.includes(id));
const CLEAN = P.foldScore(D, order, TESTF);

/* duplicates: test positions 0 and 1 of the test fold become exact copies of two training points. Picked so they are the
   first two test points that the clean model got wrong, so the change in the score is the copies alone. */
const key = p => [p.x1, p.x2], tr = trainIds.map(i => D.pts[i]);
const pred = t => { let b = Infinity, y = 0; for(const r of tr){ const d = (t.x1 - r.x1)**2 + (t.x2 - r.x2)**2; if(d < b){ b = d; y = r.y; } } return y; };
const wrongPos = testIds.map((id, i) => [id, i]).filter(([id]) => pred(D.pts[id]) !== D.pts[id].y).map(x => x[1]);
const dupTest = wrongPos.slice(0, 2);                                       /* positions inside the test fold */
const dupTrainIds = dupTest.map((_, k) => trainIds[k]);
const testDup = testIds.map((id, i) => { const k = dupTest.indexOf(i); return k >= 0 ? {...D.pts[dupTrainIds[k]]} : D.pts[id]; });
const DUP = P.knnAcc(tr, testDup, key);
/* a feature that encodes the label: 1-NN on (x1, x2, 100*label) */
const FEAT = P.knnAcc(tr, testIds.map(i => D.pts[i]), p => [p.x1, p.x2, 100*p.y]);
/* normalization: means over all points, and over training only */
const MEAN_ALL = P.mean(D.pts.map(p => p.x1)), MEAN_TR = P.mean(tr.map(p => p.x1));

const LAY = [
  {rows: [], marks: null},
  {rows: [{order, role: pos => Math.floor(pos/FOLD) === TESTF ? 'test' : 'train'}], marks: null},
  {rows: [{order, role: pos => Math.floor(pos/FOLD) === TESTF ? 'test' : 'train'}], marks: null},
  {rows: [{order, role: pos => Math.floor(pos/FOLD) === TESTF ? 'test' : 'train'}], marks: null},
  {rows: [{order, role: pos => Math.floor(pos/FOLD) === TESTF ? 'test' : 'train'}], marks: 'class'},
  {rows: [{order, role: pos => Math.floor(pos/FOLD) === TESTF ? 'test' : 'train'}], marks: null},
];
const CUE = ['', 'information from the test data sneaks into training', 'normalizing on the full dataset before splitting', 'duplicates across splits', 'features that encode the label', 'most common reason published results don\'t replicate'];
const SCORE = [null, CLEAN, CLEAN, DUP, FEAT, CLEAN];

const ctl = P.controller('splitsLeak', NB, b => { document.getElementById('cite').style.opacity = b ? 1 : 0; document.getElementById('cv').style.visibility = b ? 'visible' : 'hidden'; P.dots(NB, b); });
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function size(){ const k = devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight; cv.width = W*k; cv.height = H*k; ctx.setTransform(k, 0, 0, k, 0, 0); }

function frame(now){
  if(cv.clientWidth !== W || cv.clientHeight !== H) size();
  const beat = ctl.beat, prev = ctl.prev, p = Math.min(1, (now - ctl.t0)/1000), e = ease(p);
  const on = b => beat === b ? p : (prev === b ? 1 - p : 0);
  ctx.clearRect(0, 0, W, H);
  if(beat > 0){
    const S = P.strip(W, H), fs = S.fs;
    P.renderRows(ctx, S, D, LAY[prev], LAY[beat], beat > prev ? p : 1);
    const xR = S.x + S.width + 18, y0 = P.rowY(S, 0), yM = y0 + S.ch/2;
    const xTest = P.cellX(S, TESTF*FOLD), xTestEnd = P.cellX(S, TESTF*FOLD + 5) + S.cw, xTrainEnd = P.cellX(S, 23) + S.cw;

    for(let b = 1; b <= NB; b++){ const a = on(b); if(a > 0 && CUE[b]){ ctx.save(); ctx.globalAlpha = a; txt(ctx, CUE[b], S.x, H*.05, fs*1.12, true); ctx.restore(); } }
    P.legend(ctx, S, W*.76, H*.05, [['train', 'train'], ['test', 'test']]);

    /* score, same place as in the cross-validation scene */
    if(SCORE[beat] != null){ const s = SCORE[beat], was = SCORE[prev], v = was != null && beat > prev ? lerp(was, s, e) : s;
      ctx.save(); ctx.globalAlpha = beat === 1 ? e : 1; txt(ctx, v.toFixed(2), xR, yM, fs*1.1, true);
      txt(ctx, 'score', xR, yM + fs*1.3, fs, false); ctx.restore(); }

    /* 1: the leak, a red arrow arcing from test back over into training */
    const a1 = on(1);
    if(a1 > 0){ ctx.save(); ctx.globalAlpha = a1; const yUp = y0 - H*.055, xFrom = (xTest + xTestEnd)/2, xTo = xTrainEnd - S.width*.3;
      ctx.strokeStyle = LEAK; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(xFrom, y0 - 6); ctx.quadraticCurveTo((xFrom + xTo)/2, yUp - 8, xTo + 6, y0 - 12); ctx.stroke();
      P.arrow(ctx, xTo + 24, y0 - 20, xTo + 4, y0 - 7, LEAK, 4); ctx.restore(); }

    /* 2: value bars under the strip; the mean is drawn through all of them */
    const a2 = on(2);
    if(a2 > 0){ ctx.save(); ctx.globalAlpha = a2;
      const yb = y0 + S.ch + H*.5, scale = H*.17;
      const pts = order.map(id => D.pts[id]);
      pts.forEach((pt, pos) => { const isT = Math.floor(pos/FOLD) === TESTF, x = P.cellX(S, pos), h = (pt.x1 + 3)/6*scale*2;
        ctx.fillStyle = isT ? '#fff' : INK; ctx.fillRect(x + 2, yb - h, S.cw - 4, h); ctx.strokeStyle = isT ? LEAK : INK; ctx.lineWidth = isT ? 2.5 : 1; ctx.strokeRect(x + 2, yb - h, S.cw - 4, h); });
      const my = v => yb - (v + 3)/6*scale*2;
      ctx.strokeStyle = LEAK; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(S.x - 6, my(MEAN_ALL)); ctx.lineTo(S.x + S.width + 8, my(MEAN_ALL)); ctx.stroke();
      txt(ctx, 'mean of all points', xR, my(MEAN_ALL), fs, true);
      /* the mean is built from the test bars too: arrows up out of the test bars into the line */
      for(const pos of [24, 26, 28]){ const x = P.cellX(S, pos) + S.cw/2; P.arrow(ctx, x, yb - scale*.6, x, my(MEAN_ALL) + 7, LEAK, 3); }
      ctx.restore(); }

    /* 3: two training cells fly into the test block, as exact copies */
    if(beat === 3 || (prev === 3 && beat === 4 && p < 1)){ const a = beat === 3 ? 1 : 1 - p;
      ctx.save(); ctx.globalAlpha = a; const q = beat === 3 ? e : 1;
      dupTest.forEach((t, k) => { const srcId = dupTrainIds[k], src = order.indexOf(srcId), dst = TESTF*FOLD + t;
        const x0 = P.cellX(S, src), x1 = P.cellX(S, dst), lift = Math.sin(q*Math.PI)*H*.13, x = lerp(x0, x1, q), y = y0 - lift;
        ctx.strokeStyle = LEAK; ctx.lineWidth = 3; ctx.strokeRect(x0 + .5, y0 + .5, S.cw - 1, S.ch - 1);          /* the original stays in training, ringed */
        P.drawCell(ctx, S, x, y, P.ROLE.train, LEAK);                                                                 /* the copy, flying */
      });
      ctx.restore(); }

    /* 4: a second row, one cell per point, holding the label */
    const a4 = on(4);
    if(a4 > 0){ ctx.save(); ctx.globalAlpha = a4;
      const y = P.rowY(S, 1);
      order.forEach((id, pos) => { const x = P.cellX(S, pos), isT = Math.floor(pos/FOLD) === TESTF, col = P.ROLE[isT ? 'test' : 'train'];
        P.drawCell(ctx, S, x, y, col, LEAK); P.drawMark(ctx, S, x, y, 'class', D.pts[id].y, col, 1); });
      txt(ctx, '= label', xR, y + S.ch/2, fs, true);
      ctx.restore(); }

  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
