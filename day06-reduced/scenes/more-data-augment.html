<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Data augmentation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../deck/deck.css">
<style>
  /* Copied from day06/scenes/augment.html (part broaden, Shreya) for the Day 6 reduced deck, part more-data. Every tile is computed here from one photo, seeded, so it looks the
     same every time. Photo: Keith Kissel, "June odd-eyed-cat" (cropped), CC BY 2.0, via Wikimedia Commons;
     CC BY allows these changes. */
  html, body{ background:#fff; }
  .wrap{ position:absolute; inset:0; padding:7.2vh 5.2vw 9.5vh; display:flex; flex-direction:column; gap:1.6vh; }
  .row{ flex:1 1 auto; min-height:0; display:flex; justify-content:center; gap:4vw; align-items:center; }
  .orig, .grid{ transition:opacity .7s ease; }
  .orig{ display:flex; flex-direction:column; align-items:center; gap:1vh; }
  .orig canvas{ height:44vh; width:44vh; border-radius:8px; }
  .grid{ display:grid; grid-template-columns:repeat(3, 17vh); gap:.8vh 1vw; }
  .grid figure{ margin:0; display:flex; flex-direction:column; align-items:center; gap:.3vh; min-height:0; }
  .grid canvas{ width:17vh; height:17vh; border-radius:6px; }
  .grid figcaption{ font-size:clamp(.86rem, 2vh, 1.15rem); color:var(--ink); white-space:nowrap; }
  .tag{ font-weight:700; }
  .say{ transition:opacity .7s ease; }
  .cite{ font-size:clamp(.8rem, 1.12vw, 1.15rem); color:var(--mute); margin-top:auto; }
  .dots{ position:fixed; right:2vw; bottom:12px; display:flex; gap:6px; }
  .dots i{ width:7px; height:7px; border-radius:50%; background:#e2e8f0; }
  .dots i.on{ background:#64748b; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t deck-title">Data augmentation</h1>
  <div class="row">
    <div class="orig" id="orig"><canvas id="c0" width="360" height="360"></canvas><div class="lead">label: <span class="tag">cat</span></div></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="cite" id="cite" style="opacity:0;transition:opacity .7s ease">Photo: Keith Kissel, "June odd-eyed-cat" (cropped), CC BY 2.0, via Wikimedia Commons · changes computed in the browser</div>
</div>
<div class="dots" id="dots"></div>
<script>
/* BEAT 0 title only · 1 the original photo and its label · 2 nine changed copies, same label. */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(7);
const N = 360;
const img = new Image(); img.src = '../assets/more-data/june-odd-eyed-cat.jpg';

/* draw the photo center-cropped to a square, with an optional geometric transform */
function base(ctx, {flip = false, rot = 0, zoom = 1, dx = 0, dy = 0} = {}){
  const s = Math.min(img.width, img.height), sx = (img.width - s)/2, sy = (img.height - s)/2;
  ctx.save(); ctx.fillStyle = '#e2e8f0'; ctx.fillRect(0, 0, N, N);
  ctx.translate(N/2, N/2); ctx.rotate(rot); ctx.scale(flip ? -zoom : zoom, zoom); ctx.translate(-N/2 + dx, -N/2 + dy);
  ctx.drawImage(img, sx, sy, s, s, 0, 0, N, N); ctx.restore();
}
function pixels(ctx, f){ const d = ctx.getImageData(0, 0, N, N); const a = d.data;
  for(let i = 0; i < a.length; i += 4){ const o = f(a[i], a[i+1], a[i+2]); a[i] = o[0]; a[i+1] = o[1]; a[i+2] = o[2]; } ctx.putImageData(d, 0, 0); }
const clamp = v => Math.max(0, Math.min(255, v));
function boxBlur(ctx, r){ const d = ctx.getImageData(0, 0, N, N), a = d.data, b = new Uint8ClampedArray(a);
  for(let pass = 0; pass < 2; pass++){ const src = pass ? b.slice() : a.slice(), dst = pass ? a : b;
    for(let y = 0; y < N; y++) for(let x = 0; x < N; x++){ let s0 = 0, s1 = 0, s2 = 0, n = 0;
      for(let k = -r; k <= r; k++){ const xx = pass ? x : Math.min(N-1, Math.max(0, x+k)), yy = pass ? Math.min(N-1, Math.max(0, y+k)) : y;
        const j = (yy*N + xx)*4; s0 += src[j]; s1 += src[j+1]; s2 += src[j+2]; n++; }
      const i = (y*N + x)*4; dst[i] = s0/n; dst[i+1] = s1/n; dst[i+2] = s2/n; dst[i+3] = 255; } }
  ctx.putImageData(d, 0, 0); }

const AUG = [
  ['mirror',      c => base(c, {flip: true})],
  ['crop',        c => base(c, {zoom: 1.7, dx: 60, dy: 25})],
  ['rotate',      c => base(c, {rot: -0.26})],
  ['color shift', c => { base(c); pixels(c, (r, g, b) => [clamp(r*.75 + 20), clamp(g*1.05), clamp(b*1.3 + 15)]); }],
  ['blur',        c => { base(c); boxBlur(c, 5); }],
  ['noise',       c => { base(c); pixels(c, (r, g, b) => { const n = (R() - .5)*120; return [clamp(r+n), clamp(g+n), clamp(b+n)]; }); }],
  ['darker',      c => { base(c); pixels(c, (r, g, b) => [r*.45, g*.45, b*.45]); }],
  ['cutout',      c => { base(c); c.fillStyle = '#64748b'; c.fillRect(N*.52, N*.25, N*.3, N*.3); }],
  ['zoom out',    c => base(c, {zoom: .62})],
];

img.onload = () => {
  base(document.getElementById('c0').getContext('2d'));
  document.getElementById('grid').innerHTML = AUG.map(([nm], k) =>
    `<figure><canvas id="a${k}" width="${N}" height="${N}"></canvas><figcaption>${nm} · <span class="tag">cat</span></figcaption></figure>`).join('');
  AUG.forEach(([, f], k) => f(document.getElementById('a' + k).getContext('2d')));
  go(beat, true);
};

const NB = 2;
let beat = 0;
function go(b){ beat = b;
  const show = (id, on) => { const e = document.getElementById(id); if(e) e.style.opacity = on ? 1 : 0; };
  show('orig', b >= 1); show('grid', b >= 2); show('cite', b >= 1);
  document.getElementById('dots').innerHTML = [...Array(NB)].map((_, i) => `<i class="${i < b ? 'on' : ''}"></i>`).join(''); }

window.mdAugment = {
  advance(){ if(beat < NB) go(beat + 1); },
  back(){ if(beat > 0) go(beat - 1); },
  atStart: () => beat === 0,
  atEnd: () => beat === NB,
  reset(){ go(0); },
  resetToEnd(){ go(NB); },
  getBeat: () => beat,
};
if(window.parent === window){
  addEventListener('keydown', e => { if(['ArrowRight', ' ', 'Enter'].includes(e.key)) mdAugment.advance(); if(e.key === 'ArrowLeft') mdAugment.back(); });
  addEventListener('click', () => mdAugment.advance());
}
go(0);
</script>
</body>
</html>
