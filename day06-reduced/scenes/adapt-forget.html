<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Catastrophic forgetting</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../deck/deck.css">
<style>
  /* Part adapt. Every number is read from assets/adapt/cl_results.json (domain_incremental.finetune.R_seed0):
     row i = after training on task i, column j = tested on task j. The upper triangle (tasks not yet trained) is not drawn. */
  html, body{ background:#fff; }
  .wrap{ position:absolute; inset:0; padding:7.2vh 5.2vw 9.5vh; display:flex; flex-direction:column; gap:1.5vh; }
  .adapt-stagebox{ position:relative; flex:1 1 auto; min-height:0; }
  svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  svg text{ font-family:var(--font); fill:var(--ink); }
  .adapt-sb{ opacity:0; transition:opacity .5s ease; }
  .adapt-sb.on{ opacity:1; }
  .adapt-sb.adapt-late.on{ transition-delay:.6s; }   /* a dot or label arrives when its line has finished drawing */
  .adapt-seg{ stroke-dasharray:1; stroke-dashoffset:1; transition:stroke-dashoffset .8s ease; }
  .adapt-seg.on{ stroke-dashoffset:0; }
  .cite{ position:static; font-size:clamp(.8rem, 1.12vw, 1.15rem); color:var(--mute); opacity:0; transition:opacity .5s ease; }
  .cite.on{ opacity:1; }
  .cite a{ color:var(--mute); }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t deck-title">Catastrophic forgetting</h1>
  <div class="adapt-stagebox"><svg id="sv" viewBox="0 0 1120 470" role="img" aria-label="Accuracy matrix of a network trained on rotated digits, one rotation after another, and one line per angle: each starts high when that angle is trained and falls as later angles are trained."></svg></div>
  <div class="cite" id="cite">Toy example: our run, seed 0, plain fine-tuning on 8×8 digits (scikit-learn), small MLP · <a href="../assets/adapt/continual_learning_demo.py" target="_blank" rel="noopener">continual_learning_demo.py</a> · rotated digit glyphs are illustrative</div>
</div>
<script>
/* BEAT 0  title only
   BEAT 1  after 0°: first row, first point of the 0° line
   BEAT 2-5  each click trains the next rotation: new matrix row; that angle's line starts high; every older line drops
   BEAT 6  the diagonal and the high point of every line: each new rotation is learned
   BEAT 7  the 0° column: 0.98 to 0.18
   BEAT 8  her cue: motivation for continual learning */
const NS = 'http://www.w3.org/2000/svg', INK = '#0f172a', MUTE = '#94a3b8';
const sv = document.getElementById('sv');
const NB = 8; let beat = 0, ready = false;
const ANG = [0, 30, 60, 90, 120];
const el = (t, a, p = sv) => { const e = document.createElementNS(NS, t); for(const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
const txt = (s, x, y, sz, a = {}, p) => { const e = el('text', {x, y, 'font-size': sz, 'text-anchor': 'middle', ...a}, p); e.textContent = s; return e; };
const grp = (b, cls = '') => { const g = el('g', {class: 'adapt-sb ' + cls}); g.dataset.b = b; return g; };

function build(R){
  /* ---- matrix (smaller, so the plot can be large) ---- */
  const CW = 76, CH = 50, X0 = 118, Y0 = 102;
  const head = grp(1);
  txt('tested on', X0 + 2.5 * CW, 14, 24, {'font-weight': 700}, head);
  ANG.forEach((a, j) => { const cx = X0 + (j + .5) * CW;
    txt(a + '°', cx, 94, 23, {}, head);
    const g = el('g', {transform: `rotate(${a} ${cx} 50)`}, head);
    txt('4', cx, 63, 38, {'font-weight': 700}, g); });
  R.forEach((row, i) => {
    const g = grp(i + 1);
    txt('after ' + ANG[i] + '°', X0 - 10, Y0 + i * CH + 33, 22, {'text-anchor': 'end'}, g);
    for(let j = 0; j <= i; j++){ const v = row[j], c = Math.round(244 - v * 205), dark = v > .55;
      el('rect', {x: X0 + j * CW + 1, y: Y0 + i * CH + 1, width: CW - 2, height: CH - 2, rx: 4, fill: `rgb(${c},${c + 3},${c + 7})`}, g);
      txt(v.toFixed(2), X0 + (j + .5) * CW, Y0 + i * CH + 33, 22, {'font-weight': 700, style: `fill:${dark ? '#f8fafc' : INK}`}, g); }
  });
  const d = grp(6);
  R.forEach((_, i) => el('rect', {x: X0 + i * CW + 2, y: Y0 + i * CH + 2, width: CW - 4, height: CH - 4, rx: 5, fill: 'none', stroke: INK, 'stroke-width': 3.5}, d));
  const c0 = grp(7);
  el('rect', {x: X0 + 1, y: Y0 + 1, width: CW - 2, height: CH * 5 - 2, rx: 6, fill: 'none', stroke: INK, 'stroke-width': 4}, c0);

  /* ---- one line per angle. Row i of R is the state after training step i; angle j exists from step j on. ---- */
  const PX0 = 612, PX1 = 1004, PY0 = 350, PY1 = 70;
  const px = i => PX0 + i * (PX1 - PX0) / 4, py = v => PY0 + (PY1 - PY0) * v;
  const STYLE = [[INK, 5, 8.5], ['#334155', 2.8, 6], ['#64748b', 2.8, 6], ['#7b8aa0', 2.8, 6], ['#94a3b8', 2.8, 6]];   /* colour, line width, dot radius; 0° strongest */
  const ax = grp(1);
  el('line', {x1: PX0, y1: PY1, x2: PX0, y2: PY0, stroke: MUTE, 'stroke-width': 1.5}, ax);
  el('line', {x1: PX0, y1: PY0, x2: PX1, y2: PY0, stroke: MUTE, 'stroke-width': 1.5}, ax);
  [0, .5, 1].forEach(v => { txt(v.toFixed(1), PX0 - 18, py(v) + 8, 22, {'text-anchor': 'end'}, ax); });
  ANG.forEach((a, i) => txt(a + '°', px(i), PY0 + 28, 22, {}, ax));
  txt('accuracy on each angle', (PX0 + PX1) / 2, 30, 25, {'font-weight': 700}, ax);
  txt('after training on', (PX0 + PX1) / 2, PY0 + 56, 22, {}, ax);

  /* older lines draw first (under), the 0° line last (on top) */
  for(let j = ANG.length - 1; j >= 0; j--){ const [col, lw, r] = STYLE[j];
    for(let i = j; i < R.length; i++){
      if(i > j){ const s = el('line', {class: 'adapt-seg', x1: px(i - 1), y1: py(R[i - 1][j]), x2: px(i), y2: py(R[i][j]), stroke: col, 'stroke-width': lw, pathLength: 1}); s.dataset.b = i + 1; }
      const g = grp(i + 1, i > j ? 'adapt-late' : '');
      el('circle', {cx: px(i), cy: py(R[i][j]), r, fill: col, stroke: '#fff', 'stroke-width': 2}, g);
    } }
  txt(R[0][0].toFixed(2), px(0) + 38, py(R[0][0]) - 13, 25, {'font-weight': 700}, grp(1));

  /* ---- labels at the current end of each line: one set per training step, nudged apart when ends crowd ---- */
  const GAP = 27;
  R.forEach((row, i) => {
    const g = grp(i + 1, 'adapt-late'); if(i < R.length - 1) g.dataset.off = i + 2;
    const ends = ANG.map((a, j) => ({a, j, ey: py(row[j])})).filter(e => e.j <= i).sort((p, q) => p.ey - q.ey || p.j - q.j);
    ends.forEach((e, k) => { e.y = k ? Math.max(e.ey, ends[k - 1].y + GAP) : e.ey; });
    ends.forEach(({a, j, ey, y}) => { const x = px(i) + 22, w = j ? 400 : 700;
      if(Math.abs(y - ey) > 8) el('line', {x1: px(i) + 7, y1: ey, x2: x - 3, y2: y, stroke: MUTE, 'stroke-width': 1.3}, g);
      const glyph = el('g', {transform: `rotate(${a} ${x + 9} ${y})`}, g);
      txt('4', x + 9, y + 9, 25, {'font-weight': 700}, glyph);
      txt(a + '°', x + 26, y + 8, 23, {'text-anchor': 'start', 'font-weight': w}, g); });
  });

  /* ---- step 6: the high point of every line ---- */
  const hi = grp(6);
  R.forEach((row, i) => el('circle', {cx: px(i), cy: py(row[i]), r: 13, fill: 'none', stroke: INK, 'stroke-width': 2.4}, hi));

  const diag = R.map((r, i) => r[i]), col0 = R.map(r => r[0]);
  txt(`each new rotation: learned (${Math.min(...diag).toFixed(2)}–${Math.max(...diag).toFixed(2)})`, X0 + 2.5 * CW, Y0 + 5 * CH + 42, 25, {'font-weight': 700}, grp(6));
  txt(`0° task: ${col0[0].toFixed(2)} → ${col0[4].toFixed(2)}`, (PX0 + PX1) / 2, PY0 + 86, 26, {'font-weight': 700}, grp(7));
  txt('Motivation for continual learning', 560, 466, 30, {'font-weight': 700}, grp(8));
  ready = true; render();
}
function render(){
  sv.querySelectorAll('.adapt-sb, .adapt-seg').forEach(g => g.classList.toggle('on', beat >= +g.dataset.b && !(g.dataset.off && beat >= +g.dataset.off)));
  document.getElementById('cite').classList.toggle('on', beat >= 1);
}
fetch('../assets/adapt/cl_results.json').then(r => r.text()).then(t => build(JSON.parse(t.replace(/\bNaN\b/g, 'null')).domain_incremental.finetune.R_seed0));

window.adaptForget = {
  advance(){ if(beat < NB){ beat++; render(); } },
  back(){ if(beat > 0){ beat--; render(); } },
  atStart: () => beat === 0,
  atEnd: () => beat === NB,
  reset(){ beat = 0; render(); },
  resetToEnd(){ beat = NB; render(); },
  getBeat: () => beat,
};
if(window.parent === window){
  addEventListener('keydown', e => { if(['ArrowRight', ' ', 'Enter'].includes(e.key)) adaptForget.advance(); if(e.key === 'ArrowLeft') adaptForget.back(); });
  addEventListener('click', () => adaptForget.advance());
}
</script>
</body>
</html>
