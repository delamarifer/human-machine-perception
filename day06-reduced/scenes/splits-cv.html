<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cross-validation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../deck/deck.css">
<style>
  /* Owner: splits part (Day 6 reduced). Google p37. Motivation and mechanism follow the StatQuest video she linked. */
  html, body{ background:#fff; }
  .wrap{ position:absolute; inset:0; padding:7.2vh 5.2vw 9.5vh; display:flex; flex-direction:column; gap:1.5vh; }
  .splits-box{ position:relative; flex:1 1 auto; min-height:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; visibility:hidden; }
  .cite{ position:static; font-size:clamp(.8rem, 1.12vw, 1.15rem); color:var(--mute); transition:opacity .4s; }
  .cite a{ color:inherit; }
  .dots{ position:fixed; right:2vw; bottom:12px; display:flex; gap:6px; }
  .dots i{ width:7px; height:7px; border-radius:50%; background:#e2e8f0; }
  .dots i.on{ background:#64748b; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t deck-title">Cross-validation</h1>
  <div class="splits-box"><canvas id="cv"></canvas></div>
  <div class="cite" id="cite" style="opacity:0">Toy example: 30 points, 2 classes; logistic regression, 1-nearest-neighbor, linear SVM; scores computed · motivation and mechanism after <a href="https://www.youtube.com/watch?v=fSytzGwwBVw" target="_blank" rel="noopener">StatQuest, Machine Learning Fundamentals: Cross Validation</a></div>
</div>
<div class="dots" id="dots"></div>
<script src="../assets/splits/folds.js"></script>
<script>
/* BEATS
   1  one split, test on the last part, a score
   2  test on the first part instead, a different score: which part should be the test?
   3  cut into k parts; first rotation
   4  the other rotations
   5  average; five or ten folds
   6  which method? the same folds, three methods side by side
   7  the method with the best average
   8  the data by class: 20 and 10
   9  random folds: each fold's class counts differ
   10 ring the fold with the fewest of the rare class
   11 stratified, step 1: cut each class into k parts
   12 stratified, step 2: one part of each class per fold, the boundary is a straight line
   13 rotate as before, on the stratified folds
   14 group split: whole patients
   15 time-based split: train before test
   16 nested: an inner loop inside the training part of an outer row
   17 her decision: large datasets, small datasets */
const P = SPLITS, {INK, MUTE, VAL, txt, ease, lerp, FOLD, K} = P;
const NB = 17;
const D = P.makeData(98);                /* seed 98 picked so random folds are visibly uneven and the three methods do not tie */
const SC = P.foldScores(D, D.base), AVG = P.mean(SC);
const MS = P.METHODS.map(m => { const sc = P.methodScores(D, D.base, m); return {name: m.name, sc, avg: P.mean(sc)}; });
const BEST = MS.reduce((b, m, i) => m.avg > MS[b].avg ? i : b, 0);
const nCross = (order, f) => P.foldIds(order, f).filter(i => D.pts[i].y).length;
const WORST = [0, 1, 2, 3, 4].reduce((b, f) => nCross(D.base, f) < nCross(D.base, b) ? f : b, 0);

const testFold = f => pos => Math.floor(pos/FOLD) === f ? 'test' : 'train';
const kfRows = (order, n = K) => [...Array(n)].map((_, f) => ({order, role: testFold(f)}));
const timeRow = r => ({order: D.base, role: pos => { const b = Math.floor(pos/FOLD); return b <= r ? 'train' : b === r + 1 ? 'test' : 'none'; }});
const LAY = [
  {rows: [], marks: null},
  {rows: [{order: D.base, role: testFold(4)}], marks: null},
  {rows: [{order: D.base, role: testFold(0)}], marks: null},
  {rows: [{order: D.base, role: testFold(0)}], marks: null, cut: 1},
  {rows: kfRows(D.base), marks: null, cut: 1},
  {rows: kfRows(D.base), marks: null, cut: 1},
  {rows: kfRows(D.base), marks: null, cut: 1},
  {rows: kfRows(D.base), marks: null, cut: 1},
  {rows: [], marks: null}, {rows: [], marks: null}, {rows: [], marks: null}, {rows: [], marks: null}, {rows: [], marks: null},   /* 8-12: drawn by drawStrat */
  {rows: kfRows(D.strat), marks: 'class', cut: 1},
  {rows: kfRows(D.group), marks: 'patient', cut: 1},
  {rows: [0, 1, 2, 3].map(timeRow), marks: null, cut: 1},
  {rows: kfRows(D.base), marks: null, cut: 1},
  {rows: kfRows(D.base), marks: null, cut: 1},
];
const CUE = ['', '', 'which part should be the test?', 'k parts: train on k−1, test on the rest', 'rotate', 'average · five or ten folds',
  'which method?', `best average: ${MS[BEST].name}`,
  'two classes', 'random folds', `a test fold with only ${nCross(D.base, WORST)} ✕`, 'Stratified k-fold: each class into k parts',
  'Stratified k-fold: same class proportions in each fold', 'rotate, as before', 'Group split: same patient, same subject',
  'Time-based split: time series', 'Nested CV: inner loop for tuning, outer loop for evaluation', ''];

const ctl = P.controller('splitsCv', NB, b => { document.getElementById('cite').style.opacity = b ? 1 : 0; document.getElementById('cv').style.visibility = b ? 'visible' : 'hidden'; P.dots(NB, b); });
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function size(){ const k = devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight; cv.width = W*k; cv.height = H*k; ctx.setTransform(k, 0, 0, k, 0, 0); }
const ratio = (order, f) => { const ids = P.foldIds(order, f), x = ids.filter(i => D.pts[i].y).length; return `${6 - x} : ${x}`; };

/* ---- stratified build (beats 8-12): one cell per example, filled by class, tweened between layouts ---- */
const CROSS = [79, 109, 154], DOT = [255, 255, 255];   /* the deck's data accent */
const isStrat = b => b >= 8 && b <= 12;
const byClass = (order, f) => { const ids = P.foldIds(order, f); return [...ids.filter(i => !D.pts[i].y), ...ids.filter(i => D.pts[i].y)]; };
function strLayout(b){
  const pos = {};
  if(b === 8){ const cw = Math.round(W*.86/30), ch = Math.round(cw*1.4), x0 = (W - 30*cw)/2, y = H*.38;
    [...D.pts.filter(p => !p.y), ...D.pts.filter(p => p.y)].forEach((p, i) => pos[p.id] = [x0 + i*cw, y]);
    return {cw, ch, pos, x0, y0: y}; }
  if(b === 11){ const cw = Math.round(W*.036), ch = Math.round(cw*1.3), gap = Math.round(W*.03), colW = 4*cw + gap, x0 = (W - (5*colW - gap))/2, y1 = H*.24, y2 = y1 + ch + H*.17;
    for(let f = 0; f < K; f++) byClass(D.strat, f).forEach((id, j) => pos[id] = j < 4 ? [x0 + f*colW + j*cw, y1] : [x0 + f*colW + (j - 4)*cw, y2]);
    return {cw, ch, pos, x0, y1, y2, colW}; }
  const ch = Math.round(Math.min(H*.115, W*.05)), cw = ch, Y0 = H*.16, pitch = H*.14, x0 = Math.round((W - 6*cw)/2), y = f => Y0 + f*pitch;
  for(let f = 0; f < K; f++) byClass(b === 12 ? D.strat : D.base, f).forEach((id, j) => pos[id] = [x0 + j*cw, y(f)]);
  return {cw, ch, pos, x0, y};
}
function drawStrat(S, beat, prev, p, e){
  const leaving = beat === 13 && prev === 12 && p < 1;
  if(!isStrat(beat) && !leaving) return;
  const fs = S.fs, now = strLayout(isStrat(beat) ? beat : 12), from = isStrat(beat) && isStrat(prev) && beat > prev ? strLayout(prev) : now;
  const q = from === now ? 1 : e, alpha = leaving ? 1 - e : (isStrat(prev) ? 1 : e);
  for(const pt of D.pts){ const a = from.pos[pt.id], b = now.pos[pt.id], C = {cw: lerp(from.cw, now.cw, q), ch: lerp(from.ch, now.ch, q)}, col = pt.y ? CROSS : DOT;
    ctx.save(); ctx.globalAlpha = alpha; P.drawCell(ctx, C, lerp(a[0], b[0], q), lerp(a[1], b[1], q), col); P.drawMark(ctx, C, lerp(a[0], b[0], q), lerp(a[1], b[1], q), 'class', pt.y, col, 1); ctx.restore(); }
  if(leaving) return;
  const arrive = beat > prev ? Math.max(0, (p - .55)/.45) : 1;
  ctx.save();
  if(beat === 8){ ctx.globalAlpha = arrive; const y = now.y0 + now.ch + fs*1.5;
    txt(ctx, '20 ●', now.x0 + 10*now.cw, y, fs*1.6, true, 'center'); txt(ctx, '10 ✕', now.x0 + 25*now.cw, y, fs*1.6, true, 'center'); }
  if(beat === 9 || beat === 10 || beat === 12){ ctx.globalAlpha = beat === 10 ? 1 : arrive; const order = beat === 12 ? D.strat : D.base, xR = now.x0 + 6*now.cw + 20;
    txt(ctx, '●  :  ✕', xR, now.y(0) - fs*1.3, fs*.95);
    for(let f = 0; f < K; f++){ txt(ctx, `fold ${f + 1}`, now.x0 - 14, now.y(f) + now.ch/2, fs, false, 'right'); txt(ctx, ratio(order, f), xR + 2, now.y(f) + now.ch/2, fs*1.25, true); } }
  if(beat === 10){ ctx.globalAlpha = arrive; ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.strokeRect(now.x0 - W*.06, now.y(WORST) - 7, 6*now.cw + W*.06 + W*.095, now.ch + 14); }
  if(beat === 11){ ctx.globalAlpha = arrive;
    txt(ctx, '20 ●  ÷  5  =  4', now.x0, now.y1 - fs*.9, fs*1.15, true); txt(ctx, '10 ✕  ÷  5  =  2', now.x0, now.y2 - fs*.9, fs*1.15, true);
    for(let f = 0; f < K; f++) txt(ctx, `fold ${f + 1}`, now.x0 + f*now.colW + 2*now.cw, now.y2 + now.ch + fs*1.1, fs, false, 'center'); }
  if(beat === 12){ ctx.globalAlpha = arrive; const x = now.x0 + 4*now.cw; ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.setLineDash([9, 6]); ctx.beginPath(); ctx.moveTo(x, now.y(0) - 8); ctx.lineTo(x, now.y(4) + now.ch + 8); ctx.stroke(); ctx.setLineDash([]); }
  ctx.restore();
}

function frame(now){
  if(cv.clientWidth !== W || cv.clientHeight !== H) size();
  const beat = ctl.beat, prev = ctl.prev, p = Math.min(1, (now - ctl.t0)/1000), e = ease(p);
  const on = b => beat === b ? p : (prev === b ? 1 - p : 0);
  ctx.clearRect(0, 0, W, H);
  if(beat > 0){
    const S = P.strip(W, H), fs = S.fs;
    const stagger = beat === 4;
    P.renderRows(ctx, S, D, LAY[prev], LAY[beat], beat > prev ? p : 1, stagger);
    const xR = S.x + S.width + 18;

    /* ---- one cue per click ---- */
    for(let b = 1; b <= NB; b++){ const a = on(b); if(a > 0 && CUE[b]){ ctx.save(); ctx.globalAlpha = a; txt(ctx, CUE[b], S.x, H*.05, fs*1.12, true); ctx.restore(); } }

    /* ---- legend ---- */
    if(!isStrat(beat)) P.legend(ctx, S, W*.76, H*.05, [['train', 'train'], ['test', 'test']]);
    drawStrat(S, beat, prev, p, e);

    /* ---- scores beside the rows (beats 1-5), per-row class counts (6-7) ---- */
    if(beat <= 5){
      const shownRows = beat === 1 ? [[0, SC[4]]] : beat <= 3 ? [[0, SC[0]]] : SC.map((s, f) => [f, s]);
      for(const [r, s] of shownRows){ const q = beat === 4 && r > 0 ? Math.max(0, Math.min(1, p*6 - r)) : (beat === 1 || beat === 2 ? p : 1);
        ctx.save(); ctx.globalAlpha = q; txt(ctx, s.toFixed(2), xR, P.rowY(S, r) + S.ch/2, fs*1.1, true); ctx.restore(); }
    }
    if(beat === 5){ const a = e; ctx.save(); ctx.globalAlpha = a;
      const x = xR + W*.075, y0 = P.rowY(S, 0), y1 = P.rowY(S, 4) + S.ch;
      ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x - 10, y0); ctx.lineTo(x, y0); ctx.lineTo(x, y1); ctx.lineTo(x - 10, y1); ctx.stroke();
      txt(ctx, 'average', x + 14, (y0 + y1)/2 - fs*.9, fs); txt(ctx, AVG.toFixed(2), x + 14, (y0 + y1)/2 + fs*.6, fs*2, true); ctx.restore(); }
    /* ---- three methods on the same folds; the best average wins ---- */
    if(beat === 6 || beat === 7){
      const colX = i => xR + i*W*.095, yAvg = P.rowY(S, K) + S.ch/2, a6 = beat === 6 && prev === 5 ? e : 1, win = beat === 7 ? (prev === 6 ? e : 1) : 0;
      MS.forEach((m, i) => { const dim = i === BEST ? 1 : lerp(1, .35, win);
        ctx.save(); ctx.globalAlpha = (i === 0 ? 1 : a6)*dim; txt(ctx, m.name, colX(i), S.y0 - fs*.65, fs*.95, i === BEST && win > 0);
        m.sc.forEach((s, f) => txt(ctx, s.toFixed(2), colX(i), P.rowY(S, f) + S.ch/2, fs*1.1, true)); ctx.restore();
        ctx.save(); ctx.globalAlpha = a6*dim; txt(ctx, m.avg.toFixed(2), colX(i), yAvg, fs*1.25, true); ctx.restore(); });
      ctx.save(); ctx.globalAlpha = a6; txt(ctx, 'average', S.x + S.width, yAvg, fs, false, 'right'); ctx.restore();
      if(win > 0){ ctx.save(); ctx.globalAlpha = win; ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.strokeRect(colX(BEST) - 9, S.y0 - fs*1.35, W*.08, yAvg + fs*.95 - (S.y0 - fs*1.35)); ctx.restore(); }
    }
    if(beat === 13){ ctx.save(); ctx.globalAlpha = e; txt(ctx, '●  :  ✕', xR, S.y0 - fs*.75, fs*.95);
      for(let f = 0; f < K; f++) txt(ctx, ratio(D.strat, f), xR + 2, P.rowY(S, f) + S.ch/2, fs*1.1, true);
      ctx.restore(); }
    if(beat === 14){ const a = e; ctx.save(); ctx.globalAlpha = a; for(let f = 0; f < K; f++) txt(ctx, `patient ${P.PATIENTS[f]}`, xR, P.rowY(S, f) + S.ch/2, fs); ctx.restore(); }
    if(beat === 15){ const a = e; ctx.save(); ctx.globalAlpha = a; const y = P.rowY(S, 4) + S.ch*.5; P.arrow(ctx, S.x, y, S.x + S.width, y, INK, 3); txt(ctx, 'time', S.x, y + fs*.9, fs); ctx.restore(); }

    /* ---- nested CV: inner folds inside the training part of the first outer row ---- */
    const aN = on(16);
    if(aN > 0){ ctx.save(); ctx.globalAlpha = aN;
      const y0 = P.rowY(S, K) + 4, iH = Math.round(S.ch*.62), iG = Math.max(3, Math.round(S.rowGap*.4));
      const inner = {...S, ch: iH};
      for(let inr = 0; inr < 4; inr++){ const y = y0 + inr*(iH + iG);
        for(let pos = 6; pos < 30; pos++){ const b = Math.floor((pos - 6)/6);
          P.drawCell(ctx, inner, P.cellX(S, pos), y, P.ROLE[b === inr ? 'val' : 'train']); } }
      /* the connection: the training part of outer row 1 opens into the inner rows */
      const xa = P.cellX(S, 6), xb = P.cellX(S, 29) + S.cw, top = P.rowY(S, 0) + S.ch;
      const y00 = P.rowY(S, 0);
      ctx.strokeStyle = VAL; ctx.lineWidth = 2.5; ctx.strokeRect(xa - 3, y00 - 3, xb - xa + 6, S.ch + 6);
      ctx.beginPath(); ctx.moveTo(xb + 3, y00 + S.ch/2); ctx.lineTo(xb + 10, y00 + S.ch/2); ctx.lineTo(xb + 10, y0 + iH/2); ctx.lineTo(xb + 1, y0 + iH/2); ctx.stroke();
      txt(ctx, 'outer loop', xR, P.rowY(S, 2) + S.ch/2, fs, true);
      txt(ctx, 'inner loop', xR, y0 + 2*(iH + iG) - iG/2, fs, true);
      /* inner swatch for validation */
      ctx.fillStyle = P.rgb(P.ROLE.val); const sw = Math.round(fs*.9); ctx.fillRect(xR, y0 + 4*(iH + iG) - sw - iG, sw, sw); ctx.strokeStyle = INK; ctx.lineWidth = 1.3; ctx.strokeRect(xR, y0 + 4*(iH + iG) - sw - iG, sw, sw);
      txt(ctx, 'validation', xR + sw + 7, y0 + 4*(iH + iG) - sw/2 - iG, fs);
      ctx.restore(); }

    /* ---- her decision, drawn ---- */
    const aT = on(17);
    if(aT > 0){ ctx.save(); ctx.globalAlpha = aT;
      const cx = S.x + S.width/2, yRoot = P.rowY(S, K) + fs*1.1, yK = yRoot + H*.14, dx = S.width*.27;
      txt(ctx, 'Cross-Validation', cx, yRoot, fs*1.2, true, 'center');
      ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(cx - 12, yRoot + fs*.8); ctx.lineTo(cx - dx, yK - fs*.8); ctx.moveTo(cx + 12, yRoot + fs*.8); ctx.lineTo(cx + dx, yK - fs*.8); ctx.stroke();
      txt(ctx, 'Large Datasets', cx - dx, yK, fs*1.15, true, 'center'); txt(ctx, 'Use Train-Test-Validation', cx - dx, yK + fs*1.5, fs, false, 'center');
      txt(ctx, 'Small Datasets', cx + dx, yK, fs*1.15, true, 'center'); txt(ctx, 'Use K-Fold Cross-Validation', cx + dx, yK + fs*1.5, fs, false, 'center');
      ctx.restore(); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
