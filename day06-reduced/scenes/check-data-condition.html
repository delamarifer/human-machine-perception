<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Same condition</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../deck/deck.css">
<style>
  /* Part check-data (Day 6 reduced), Google page 33: "if all labels have the same condition". Toy example, our drawing:
     every "car" is in the day, every "person" at night. The model is a one-number rule on image brightness; its threshold,
     counts and predictions are computed below from the tile brightnesses (seeded). */
  html, body{ background:#fff; }
  .wrap{ position:absolute; inset:0; padding:7.2vh 5.2vw 9.5vh; display:flex; flex-direction:column; gap:1.4vh; }
  .fade{ opacity:0; transition:opacity .6s ease; }
  .fade.on{ opacity:1; }
  #tiles{ display:grid; grid-template-columns:repeat(12, 1fr); gap:.5vw; }
  .tile{ position:relative; display:flex; flex-direction:column; gap:.3vh; align-items:center; }
  .tile svg{ width:100%; height:auto; display:block; border-radius:5px; }
  .tile .tg{ font-size:clamp(.95rem, 1.4vw, 1.35rem); font-weight:700; line-height:1.1; }
  .low{ flex:1 1 auto; min-height:0; display:grid; grid-template-columns:1.9fr 1fr; gap:2vw; align-items:center; }
  #axis{ width:100%; height:100%; display:block; min-height:0; }
  #axis text{ font-family:var(--font); fill:var(--ink); }
  .counts{ display:flex; flex-direction:column; gap:.8vh; align-items:center; }
  .counts table{ border-collapse:collapse; font-size:clamp(1.15rem, 2.05vw, 1.9rem); }
  .counts td, .counts th{ padding:.9vh 1.2vw; text-align:center; border:1px solid var(--line); min-width:4.4em; }
  .counts th{ font-weight:700; }
  .counts td.z{ font-weight:700; outline:3px solid var(--ink); outline-offset:-3px; }
  .cite{ position:static; font-size:clamp(.8rem, 1.12vw, 1.15rem); color:var(--mute); padding-top:.5vh; transition:opacity .6s ease; opacity:0; }
  .dots{ position:fixed; right:2vw; bottom:12px; display:flex; gap:6px; }
  .dots i{ width:7px; height:7px; border-radius:50%; background:#e2e8f0; }
  .dots i.on{ background:#64748b; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t deck-title">Enough examples and correct labels?</h1>
  <div class="lead fade" id="sub">Example: if all labels have the same condition</div>
  <div id="tiles" class="fade"></div>
  <div class="low">
    <svg id="axis" class="fade" viewBox="0 0 800 260" role="img" aria-label="Image brightness axis with a threshold learned from the toy images"></svg>
    <div class="counts fade" id="counts"></div>
  </div>
  <div class="cite" id="cite">Our drawing · example · model = one threshold on brightness, computed from the tiles</div>
</div>
<div class="dots" id="dots"></div>
<script>
/* BEAT 0 title only · 1 twelve examples: car always day, person always night
   2 the rule the model learns: a brightness threshold, right on all 12 · 3 car at night, person in the day: both wrong
   4 count per condition: the zeros */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(41);
const CAR = (fg, wh) => `<rect x="-30" y="0" width="60" height="22" rx="5" fill="${fg}"/><path d="M -16 0 L -8 -14 L 16 -14 L 24 0 Z" fill="${fg}"/><circle cx="-16" cy="24" r="7" fill="${wh}"/><circle cx="16" cy="24" r="7" fill="${wh}"/>`;
const PERSON = (fg) => `<circle cx="0" cy="-16" r="8" fill="${fg}"/><rect x="-8" y="-7" width="16" height="24" rx="6" fill="${fg}"/><rect x="-7" y="15" width="6" height="18" rx="2" fill="${fg}"/><rect x="1" y="15" width="6" height="18" rx="2" fill="${fg}"/>`;
const gray = v => { const c = Math.round(v*255); return `rgb(${c},${c},${c})`; };
function tile(kind, br, shift = 0, attrs = ''){
  const sky = gray(br), road = gray(br*.75), night = br < .5, fg = night ? '#94a3b8' : '#475569', wh = night ? '#cbd5e1' : '#1e293b';
  const g = kind === 'car' ? `<g transform="translate(${60 + shift},52) scale(1.05)">${CAR(fg, wh)}</g>` : `<g transform="translate(${60 + shift},48) scale(1.05)">${PERSON(fg)}</g>`;
  return `<svg ${attrs} viewBox="0 0 120 90" aria-hidden="true"><rect width="120" height="90" fill="${sky}"/><rect y="62" width="120" height="28" fill="${road}"/>${g}</svg>`;
}
const day = () => .80 + R()*.17, night = () => .10 + R()*.18;
const TRAIN = [...Array(6)].map(() => ({kind: 'car', cond: 'day', br: day(), s: Math.round(R()*30 - 15)}))
  .concat([...Array(6)].map(() => ({kind: 'person', cond: 'night', br: night(), s: Math.round(R()*30 - 15)})));
const TEST = [{kind: 'car', cond: 'night', br: night(), s: 0, nm: 'car at night'}, {kind: 'person', cond: 'day', br: day(), s: 0, nm: 'person in the day'}];

/* the model: threshold halfway between the two classes' mean brightness */
const mean = k => { const a = TRAIN.filter(d => d.kind === k); return a.reduce((s, d) => s + d.br, 0)/a.length; };
const THR = (mean('car') + mean('person'))/2, CAR_BRIGHT = mean('car') > mean('person');
const predict = d => (d.br > THR) === CAR_BRIGHT ? 'car' : 'person';
const trainRight = TRAIN.filter(d => predict(d) === d.kind).length;
TEST.forEach(d => d.pred = predict(d));
const testRight = TEST.filter(d => d.pred === d.kind).length;

/* tiles */
document.getElementById('tiles').innerHTML = TRAIN.map(d => `<div class="tile">${tile(d.kind, d.br, d.s)}<div class="tg">${d.kind}</div></div>`).join('');

/* axis */
const X0 = 30, X1 = 770, AX = 214, X = v => X0 + v*(X1 - X0);
const dotY = k => k === 'car' ? AX - 16 : AX - 38;
const dot = (d, r = 7) => d.kind === 'car' ? `<circle cx="${X(d.br).toFixed(1)}" cy="${dotY(d.kind)}" r="${r}" fill="#0f172a"/>` : `<circle cx="${X(d.br).toFixed(1)}" cy="${dotY(d.kind)}" r="${r}" fill="#fff" stroke="#0f172a" stroke-width="2.5"/>`;
let s = `<g id="g2" opacity="0" style="transition:opacity .6s ease">
  <line x1="${X0}" y1="${AX}" x2="${X1}" y2="${AX}" stroke="#94a3b8" stroke-width="2"/>
  <text x="${X0}" y="${AX + 28}" font-size="20">dark</text><text x="${(X0 + X1)/2}" y="${AX + 28}" font-size="20" font-weight="700" text-anchor="middle">image brightness</text><text x="${X1}" y="${AX + 28}" font-size="20" text-anchor="end">bright</text>
  <line x1="${X(THR)}" y1="${AX + 6}" x2="${X(THR)}" y2="72" stroke="#0f172a" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="${X(THR) - 12}" y="66" font-size="21" font-weight="700" text-anchor="end">model says person</text><text x="${X(THR) + 12}" y="66" font-size="21" font-weight="700">model says car</text>
  ${TRAIN.map(d => dot(d)).join('')}
  <circle cx="${X0 + 8}" cy="24" r="7" fill="#0f172a"/><text x="${X0 + 22}" y="31" font-size="20">car</text>
  <circle cx="${X0 + 82}" cy="24" r="7" fill="#fff" stroke="#0f172a" stroke-width="2.5"/><text x="${X0 + 96}" y="31" font-size="20">person</text>
  <text x="${X1}" y="24" font-size="20" font-weight="700" text-anchor="end">training: ${trainRight} of ${TRAIN.length} right</text></g>`;
s += `<g id="g3" opacity="0" style="transition:opacity .6s ease">`;
TEST.forEach(d => { const w = 96, h = 72, x = Math.max(X0, Math.min(X1 - w, X(d.br) - w/2)), y = 84;
  s += `<svg x="${x.toFixed(1)}" y="${y}" width="${w}" height="${h}" viewBox="0 0 120 90"><rect width="120" height="90" fill="${gray(d.br)}"/><rect y="62" width="120" height="28" fill="${gray(d.br*.75)}"/>${(d.kind === 'car' ? `<g transform="translate(60,52) scale(1.05)">${CAR(d.br < .5 ? '#94a3b8' : '#475569', d.br < .5 ? '#cbd5e1' : '#1e293b')}</g>` : `<g transform="translate(60,48) scale(1.05)">${PERSON(d.br < .5 ? '#94a3b8' : '#475569')}</g>`)}</svg>
    <rect x="${x.toFixed(1)}" y="${y}" width="${w}" height="${h}" fill="none" stroke="#0f172a" stroke-width="3" rx="4"/>
    <line x1="${X(d.br).toFixed(1)}" y1="${y + h}" x2="${X(d.br).toFixed(1)}" y2="${AX}" stroke="#0f172a" stroke-width="2"/>
    <text x="${(x + w - 15).toFixed(1)}" y="${y + 25}" font-size="26" text-anchor="middle" font-weight="700" stroke="#fff" stroke-width="5" paint-order="stroke">✗</text>`;
  const out = d.br < THR ? {x: x + w + 10, a: 'start'} : {x: x - 10, a: 'end'};
  s += `<text x="${out.x.toFixed(1)}" y="${y + 30}" font-size="20" text-anchor="${out.a}">${d.nm}</text>
    <text x="${out.x.toFixed(1)}" y="${y + 56}" font-size="20" font-weight="700" text-anchor="${out.a}">→ ${d.pred}</text>`; });
s += `<text x="${X1}" y="46" font-size="20" font-weight="700" text-anchor="end">new images: ${testRight} of ${TEST.length} right</text></g>`;
document.getElementById('axis').innerHTML = s;

/* counts per condition, computed from the training tiles */
const count = (k, c) => TRAIN.filter(d => d.kind === k && d.cond === c).length;
const cell = (k, c) => { const n = count(k, c); return `<td class="${n ? '' : 'z'}">${n}</td>`; };
document.getElementById('counts').innerHTML = `<table><tr><th></th><th>day</th><th>night</th></tr>
  <tr><th>car</th>${cell('car', 'day')}${cell('car', 'night')}</tr>
  <tr><th>person</th>${cell('person', 'day')}${cell('person', 'night')}</tr></table>`;

const NB = 4;
let beat = 0;
const $ = id => document.getElementById(id);
function go(b){ beat = b;
  const on = (id, v) => $(id).classList.toggle('on', v);
  on('sub', b >= 1); on('tiles', b >= 1); on('axis', b >= 2); on('counts', b >= 4);
  $('g2').setAttribute('opacity', b >= 2 ? 1 : 0); $('g3').setAttribute('opacity', b >= 3 ? 1 : 0);
  $('cite').style.opacity = b ? 1 : 0;
  $('dots').innerHTML = [...Array(NB)].map((_, i) => `<i class="${i < b ? 'on' : ''}"></i>`).join(''); }

window.checkDataCondition = {
  advance(){ if(beat < NB) go(beat + 1); },
  back(){ if(beat > 0) go(beat - 1); },
  atStart: () => beat === 0,
  atEnd: () => beat === NB,
  reset(){ go(0); },
  resetToEnd(){ go(NB); },
  getBeat: () => beat,
};
if(window.parent === window){
  addEventListener('keydown', e => { if(['ArrowRight', ' ', 'Enter'].includes(e.key)) checkDataCondition.advance(); if(e.key === 'ArrowLeft') checkDataCondition.back(); });
  addEventListener('click', () => checkDataCondition.advance());
}
go(0);
</script>
</body>
</html>
