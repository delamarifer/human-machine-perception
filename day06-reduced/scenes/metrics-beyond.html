<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beyond the test set</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../deck/deck.css">
<style>
  /* Day 6 reduced, part metrics. p44. The tiles are computed here from one photo with the code of day06/scenes/corrupt.html
     (our versions of four ImageNet-C corruption types). Photo: Keith Kissel, "June odd-eyed-cat" (cropped), CC BY 2.0, via Wikimedia Commons.
     Error percentages and reference sums below are an example; CE and mCE computed. Logits are day06's example. */
  html, body{ background:#fff; }
  .wrap{ position:absolute; inset:0; padding:7.2vh 5.2vw 9.5vh; display:flex; flex-direction:column; gap:1.2vh; }
  .metrics-cue{ min-height:1.35em; font-size:clamp(1.15rem, 2vw, 1.9rem); font-weight:700; transition:opacity .4s ease; }
  .metrics-main{ flex:1 1 auto; min-height:0; display:flex; gap:2vw; align-items:center; }
  .metrics-grid{ display:grid; grid-template-columns:auto 11.8vh repeat(5, 11.8vh) repeat(3, 8.4vh); gap:.6vh .55vw; align-items:center; }
  .metrics-cell{ transition:opacity .6s ease; }
  .metrics-grid canvas{ width:11.8vh; height:11.8vh; display:block; border-radius:5px; }
  .metrics-tile{ position:relative; }
  .metrics-err{ position:absolute; right:3px; bottom:3px; background:rgba(255,255,255,.88); color:#0f172a; border-radius:3px; padding:0 4px; font-weight:700; font-size:clamp(13px, 1.9vh, 1.05rem); line-height:1.3; transition:opacity .6s ease; }
  .metrics-rh{ font-weight:700; font-size:clamp(.95rem, 2.2vh, 1.3rem); text-align:right; padding-right:.5vw; white-space:nowrap; }
  .metrics-ch{ font-size:clamp(.85rem, 2vh, 1.15rem); text-align:center; font-weight:600; white-space:nowrap; }
  .metrics-num{ font-size:clamp(1rem, 2.5vh, 1.45rem); text-align:center; font-weight:700; white-space:nowrap; }
  .metrics-mce{ grid-column:9 / 11; text-align:right; font-size:clamp(1.05rem, 2.6vh, 1.5rem); font-weight:700; white-space:nowrap; }
  .metrics-main{ position:relative; }
  .metrics-grid{ transition:opacity .6s ease; }
  #cv{ position:absolute; inset:0; width:100%; height:100%; }
  .cite{ font-size:clamp(.8rem, 1.12vw, 1.15rem); color:var(--mute); }
  .cite a{ color:var(--mute); }
  .dots{ position:fixed; right:2vw; bottom:12px; display:flex; gap:6px; }
  .dots i{ width:7px; height:7px; border-radius:50%; background:#e2e8f0; }
  .dots i.on{ background:#64748b; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t deck-title">Beyond the test set</h1>
  <div class="metrics-cue" id="cue" style="opacity:0"></div>
  <div class="metrics-main">
    <div class="metrics-grid" id="grid"></div>
    <canvas id="cv"></canvas>
  </div>
  <div class="cite" id="cite" style="opacity:0">Example: our versions of four corruption types; error rates and logits are examples, CE and scores computed · Hendrycks &amp; Dietterich 2019 · Hendrycks &amp; Gimpel 2017 · Liu et al. 2020 · Lee et al. 2018 · Photo: Keith Kissel, CC BY 2.0</div>
</div>
<div class="dots" id="dots"></div>
<script src="../assets/metrics/metrics-kit.js"></script>
<script>
/* BEAT 0 title only
   1 "Add noise across different parameters": clean tile, one row of noise severities
   2 "Examples of corrupted data": blur, fog, JPEG rows
   3 "Add up the error across different corruptions": error on each tile, sum per row
   4 divide by the reference: CE per row, mCE
   Familiarity scores: the grid fades and each score gets the whole stage, built from where its number comes from.
   5  softmax: image -> network -> one raw score (logit) per class, both images
   6  softmax turns the logits into probabilities that sum to 1
   7  the top one is the score (0.98 vs 0.37); low score flags "I don't know"
   8  energy: the same logits -> exp of each
   9  add them up
   10 -log of the sum = energy, landing on the axis (T = 1, Liu et al. 2020)
   11 distance: training images of the class -> same network -> grey points in feature space
   12 the + is their average
   13 each new image -> same network -> a dark point
   14 measure its distance from the +, in the class's spread */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const N = 300, img = new Image(); img.src = '../assets/metrics/june-odd-eyed-cat.jpg';
const load = im => new Promise(r => im.complete && im.naturalWidth ? r() : (im.onload = r));
function base(ctx){ const s = Math.min(img.width, img.height); ctx.drawImage(img, (img.width - s)/2, (img.height - s)/2, s, s, 0, 0, N, N); }
const clamp = v => Math.max(0, Math.min(255, v));
function pix(ctx, f){ const d = ctx.getImageData(0, 0, N, N), a = d.data; for(let i = 0; i < a.length; i += 4){ const o = f(a[i], a[i+1], a[i+2], i); a[i] = o[0]; a[i+1] = o[1]; a[i+2] = o[2]; } ctx.putImageData(d, 0, 0); }
function blur(ctx, r){ if(r < 1) return; const d = ctx.getImageData(0, 0, N, N), a = d.data;
  for(let pass = 0; pass < 2; pass++){ const src = a.slice();
    for(let y = 0; y < N; y++) for(let x = 0; x < N; x++){ let s0 = 0, s1 = 0, s2 = 0, n = 0;
      for(let k = -r; k <= r; k++){ const xx = pass ? x : Math.min(N-1, Math.max(0, x+k)), yy = pass ? Math.min(N-1, Math.max(0, y+k)) : y; const j = (yy*N + xx)*4; s0 += src[j]; s1 += src[j+1]; s2 += src[j+2]; n++; }
      const i = (y*N + x)*4; a[i] = s0/n; a[i+1] = s1/n; a[i+2] = s2/n; } }
  ctx.putImageData(d, 0, 0); }
async function jpeg(ctx, q){ const im = new Image(); im.src = ctx.canvas.toDataURL('image/jpeg', q); await load(im); ctx.drawImage(im, 0, 0); }
const R = rng(3);
const TYPES = [
  ['noise', async (c, s) => { base(c); const amp = [20, 45, 70, 100, 140][s]; pix(c, (r, g, b) => { const n = (R() - .5) * 2 * amp; return [clamp(r+n), clamp(g+n), clamp(b+n)]; }); }],
  ['blur',  async (c, s) => { base(c); blur(c, [1, 2, 4, 6, 9][s]); }],
  ['fog',   async (c, s) => { base(c); const k = [.2, .35, .5, .65, .8][s]; pix(c, (r, g, b, i) => { const y = Math.floor(i / 4 / N) / N, w = k * (.6 + .4 * y); return [r*(1-w) + 225*w, g*(1-w) + 228*w, b*(1-w) + 232*w]; }); }],
  ['JPEG',  async (c, s) => { base(c); await jpeg(c, [.3, .15, .08, .04, .01][s]); }],
];
/* example error rates (%), by corruption and severity; the reference sums play the role of AlexNet's in ImageNet-C. Fog matches day06's 150 / 300 example. */
const ERR = [[15, 30, 45, 60, 75], [12, 22, 32, 42, 52], [10, 20, 30, 40, 50], [8, 14, 20, 26, 32]];
const REF = [350, 300, 300, 250];
const SUM = ERR.map(r => r.reduce((a, b) => a + b, 0));
const CE = SUM.map((s, i) => s/REF[i]);
const MCE = CE.reduce((a, b) => a + b, 0)/CE.length;

const grid = document.getElementById('grid');
let html = '<div></div><div class="metrics-ch metrics-cell c-head">clean</div>' + [1, 2, 3, 4, 5].map(s => `<div class="metrics-ch metrics-cell c-head">severity ${s}</div>`).join('') +
  '<div class="metrics-ch metrics-cell c-sum">Σ error</div><div class="metrics-ch metrics-cell c-ce">÷ AlexNet</div><div class="metrics-ch metrics-cell c-ce">CE</div>';
TYPES.forEach(([nm], t) => {
  html += `<div class="metrics-rh metrics-cell t${t}">${nm}</div>`;
  html += t === 0 ? `<div class="metrics-cell t0"><canvas id="clean" width="${N}" height="${N}"></canvas></div>` : '<div></div>';
  for(let s = 0; s < 5; s++) html += `<div class="metrics-tile metrics-cell t${t}"><canvas id="k${t}_${s}" width="${N}" height="${N}"></canvas><span class="metrics-err" id="e${t}_${s}">${ERR[t][s]}%</span></div>`;
  html += `<div class="metrics-num metrics-cell c-sum">${SUM[t]}</div><div class="metrics-num metrics-cell c-ce">${REF[t]}</div><div class="metrics-num metrics-cell c-ce">${CE[t].toFixed(2)}</div>`;
});
html += `<div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div class="metrics-mce metrics-cell c-ce">mCE ${MCE.toFixed(2)}</div>`;
grid.innerHTML = html;

let ready = false;
const mkThumb = () => { const k = document.createElement('canvas'); k.width = N; k.height = N; return k; };
const thumbClean = mkThumb(), thumbNoisy = mkThumb();
(async () => {
  await load(img); base(document.getElementById('clean').getContext('2d'));
  for(let t = 0; t < TYPES.length; t++) for(let s = 0; s < 5; s++) await TYPES[t][1](document.getElementById(`k${t}_${s}`).getContext('2d'), s);
  thumbClean.getContext('2d').drawImage(document.getElementById('clean'), 0, 0);
  thumbNoisy.getContext('2d').drawImage(document.getElementById('k0_4'), 0, 0);
  ready = true;
})();

/* Logits are day06's example (the plan doc's); softmax, exp, sum and energy are computed from them. Distance points are a seeded schematic. */
const {INK, MID, SOFT, txt, dot, lerp, ease, clamp01} = MK;
const Z = [[5, 1, 0], [2, 1.9, 1.8]];
const P = Z.map(z => { const e = z.map(v => Math.exp(v)), s = e.reduce((a, b) => a + b, 0); return e.map(v => v/s); });
const EXP = Z.map(z => z.map(Math.exp)), SUM_E = EXP.map(e => e.reduce((a, b) => a + b, 0)), ENERGY = SUM_E.map(s => -Math.log(s));
const TOP = P.map(p => Math.max(...p));
const fmtE = v => v.toFixed(1).replace('-', '−');
const fmtX = v => v >= 100 ? v.toFixed(1) : v.toFixed(1);

/* feature space, in unit square: the training images of the class are seeded points; each new image is one more point */
const Rg = rng(7), gs = () => { let u = 0; while(!u) u = Rg(); const v = Rg(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
const cl = [...Array(26)].map(() => ({x: .28 + .075*gs(), y: .66 + .07*gs()}));
const mx = cl.reduce((a, p) => a + p.x, 0)/cl.length, my = cl.reduce((a, p) => a + p.y, 0)/cl.length;
const sx = Math.sqrt(cl.reduce((a, p) => a + (p.x - mx)**2, 0)/(cl.length - 1)), sy = Math.sqrt(cl.reduce((a, p) => a + (p.y - my)**2, 0)/(cl.length - 1));
const dist = p => Math.sqrt(((p.x - mx)/sx)**2 + ((p.y - my)/sy)**2);
const near = {x: .34, y: .72}, far = {x: .82, y: .22};

const CUES = [
  [1, 1, 'Add noise across different parameters'],
  [2, 2, 'Examples of corrupted data'],
  [3, 4, 'Add up the error across different corruptions'],
  [5, 14, 'Familiarity scores'],
];
let synced = -1;
function sync(b){ if(b === synced) return; synced = b;
  const op = (sel, on) => document.querySelectorAll(sel).forEach(e => e.style.opacity = on ? 1 : 0);
  op('.c-head', b >= 1); op('.t0', b >= 1); op('.t1', b >= 2); op('.t2', b >= 2); op('.t3', b >= 2);
  op('.c-sum', b >= 3); op('.c-ce', b >= 4); op('.metrics-err', b >= 3);
  document.getElementById('grid').style.opacity = b >= 5 ? 0 : 1;
  const cue = CUES.find(([lo, hi]) => b >= lo && b <= hi);
  const cueEl = document.getElementById('cue'); cueEl.textContent = cue ? cue[2] : ''; cueEl.style.opacity = cue ? 1 : 0;
}
sync(0);

function thumb(c, img, x, y, s, a = 1){ if(a <= 0) return; c.save(); c.globalAlpha *= a; c.drawImage(img, x, y, s, s); c.restore(); }
function netBox(c, x, y, w, h, fs, a = 1){ if(a <= 0) return; c.save(); c.globalAlpha *= a; c.fillStyle = '#f1f5f9'; c.strokeStyle = INK; c.lineWidth = 2; c.beginPath();
  c.moveTo(x, y + h*.1); c.lineTo(x + w, y); c.lineTo(x + w, y + h); c.lineTo(x, y + h*.9); c.closePath(); c.fill(); c.stroke();
  c.restore(); txt(c, 'network', x + w/2, y + h/2, fs, true, 'center', 'middle', a); }
function barsH(c, x, yc, maxW, vals, maxV, bh, gap, a, opts = {}){ const n = vals.length, tot = n*bh + (n - 1)*gap, top = yc - tot/2, col = opts.colors || (() => MID);
  c.save(); c.globalAlpha *= a; vals.forEach((v, i) => { const y = top + i*(bh + gap), w = Math.max(1.5, v/maxV*maxW); c.fillStyle = col(i); c.fillRect(x, y, w*(opts.grow != null ? opts.grow : 1), bh); });
  c.restore();
  if(opts.text){ vals.forEach((v, i) => { const y = top + i*(bh + gap) + bh/2, w = Math.max(1.5, v/maxV*maxW); txt(c, opts.text(v, i), x + w*(opts.grow != null ? opts.grow : 1) + 8, y, opts.sz || 16, false, 'left', 'middle', a); }); } }

MK.scene('metricsBeyond', 14, ({ctx: c, W, H, beat, p, raw, A}) => {
  sync(beat);
  if(beat < 5 || !ready) return;
  const fs = Math.max(15, W*.0165);
  const pA = (from, to) => beat < from ? 0 : beat > to + 1 ? 0 : beat === from ? p : beat === to + 1 ? 1 - p : 1;
  const a1 = pA(5, 7), a2 = pA(8, 10), a3 = beat >= 11 ? (beat === 11 ? p : 1) : 0;
  const imgs = [thumbClean, thumbNoisy];

  /* ---- top softmax ---- */
  if(a1 > 0){ c.save(); c.globalAlpha = a1;
    txt(c, 'top softmax', 0, fs*.8, fs*1.2, true, 'left', 'middle');
    const yc = [H*.34, H*.77], s = H*.32, sx0 = W*.005, netX = sx0 + s + W*.03, netW = W*.085, netY = H*.14, netH = H*.8;
    netBox(c, netX, netY, netW, netH, fs*.95, A(5));
    yc.forEach((y, i) => {
      thumb(c, imgs[i], sx0, y - s/2, s, A(5));
      MK.arrow(c, sx0 + s + 6, y, netX - 4, y, A(5));
      MK.arrow(c, netX + netW + 6, y, netX + netW + W*.04, y, A(5));
      /* logits */
      barsH(c, netX + netW + W*.05, y, W*.14, Z[i], 5, H*.062, H*.012, A(5), {text: v => v.toFixed(1), sz: fs*.98, colors: () => '#475569'});
      /* softmax */
      if(beat >= 6){ const a = beat === 6 ? p : 1; MK.arrow(c, netX + netW + W*.25, y, netX + netW + W*.33, y, a);
        barsH(c, netX + netW + W*.35, y, W*.17, P[i], 1, H*.062, H*.012, a, {text: v => v.toFixed(2), sz: fs*.98, colors: j => (beat >= 7 && P[i][j] === TOP[i]) ? INK : MID}); }
      /* score */
      if(beat >= 7){ txt(c, TOP[i].toFixed(2), W*.965, y, fs*1.95, true, 'center', 'middle', beat === 7 ? p : 1); }
    });
    const hY = H*.1, hd = (t, x, a) => txt(c, t, x, hY, fs*.98, true, 'center', 'middle', a);
    hd('one raw score per class (logit)', netX + netW + W*.13, A(5));
    if(beat >= 6) hd('softmax: probabilities, sum to 1', netX + netW + W*.42, beat === 6 ? p : 1);
    if(beat >= 7){ hd('score', W*.965, beat === 7 ? p : 1); txt(c, 'flag: "I don\'t know"', W*.965, yc[1] + H*.135, fs*1.05, true, 'right', 'middle', beat === 7 ? p : 1); }
    c.restore(); }

  /* ---- energy ---- */
  if(a2 > 0){ c.save(); c.globalAlpha = a2;
    txt(c, 'energy = −log Σ exp(logit)    (T = 1)', 0, fs*.8, fs*1.2, true, 'left', 'middle');
    const yc = [H*.36, H*.78], s = H*.24, sx0 = W*.005, cxL = sx0 + s + W*.018, wL = W*.085, cxE = cxL + wL + W*.075, wE = W*.15, cxS = cxE + wE + W*.09, wS = W*.11, cxV = cxS + wS + W*.105;
    const axX = W*.875, axT = H*.13, axB = H*.93, axY = v => axB - (v + 6)/4*(axB - axT);
    const hY = H*.1, hd = (t, x, a) => txt(c, t, x, hY, fs*.98, true, 'center', 'middle', a);
    hd('logits', cxL + wL/2, A(8)); hd('exp of each', cxE + wE/2, A(8));
    if(beat >= 9) hd('add them up', cxS + wS/2, beat === 9 ? p : 1);
    if(beat >= 10) hd('−log', cxV + W*.02, beat === 10 ? p : 1);
    const maxE = Math.max(...SUM_E);
    yc.forEach((y, i) => {
      thumb(c, imgs[i], sx0, y - s/2, s, A(8));
      barsH(c, cxL, y, wL, Z[i], 5, H*.05, H*.01, A(8), {text: v => v.toFixed(1), sz: fs*.95, colors: () => '#475569'});
      MK.arrow(c, cxL + wL + W*.038, y, cxE - 8, y, A(8));
      /* exp bars; on beat 9 they slide end to end into one sum bar */
      const q = beat === 9 ? ease(p) : beat > 9 ? 1 : 0;
      const n = 3, bh = H*.05, gap = H*.01, tot = n*bh + (n - 1)*gap, top = y - tot/2;
      let cum = 0;
      EXP[i].forEach((v, j) => { const w = v/maxE*wE, x0 = cxE, yy = top + j*(bh + gap), sw = v/maxE*wS, sx1 = cxS + cum;
        c.save(); c.globalAlpha = A(8); c.fillStyle = MID; c.fillRect(x0, yy, Math.max(1.5, w), bh); c.restore();
        txt(c, fmtX(v), x0 + w + 8, yy + bh/2, fs*.95, false, 'left', 'middle', A(8));
        if(q > 0){ const x = lerp(x0, sx1, q), yNow = lerp(yy, y - bh/2, q), wNow = lerp(w, sw, q); c.save(); c.fillStyle = INK; c.fillRect(x, yNow, Math.max(1.5, wNow), bh); c.restore(); }
        cum += sw; });
      if(beat >= 9){ const a = beat === 9 ? p : 1; MK.arrow(c, cxE + wE + W*.03, y, cxS - 8, y, a);
        txt(c, fmtX(SUM_E[i]), cxS + SUM_E[i]/maxE*wS + 8, y, fs*1.05, true, 'left', 'middle', a); }
      if(beat >= 10){ const a = beat === 10 ? p : 1; MK.arrow(c, cxS + wS + W*.06, y, cxV - 8, y, a);
        txt(c, fmtE(ENERGY[i]), cxV, y, fs*1.5, true, 'left', 'middle', a);
        /* the value lands on the axis */
        const yEnd = axY(ENERGY[i]), yNow = lerp(y, yEnd, ease(p)*(beat === 10 ? 1 : 0) + (beat > 10 ? 1 : 0));
        dot(c, axX, yNow, 8, true, a);
        thumb(c, imgs[i], axX + 14, yEnd - 26, 52, a);
        txt(c, fmtE(ENERGY[i]), axX + 72, yEnd, fs*1.05, true, 'left', 'middle', a); }
    });
    if(beat >= 10){ const a = beat === 10 ? p : 1; c.save(); c.globalAlpha = a; MK.line(c, axX, axT, axX, axB, MID, 2);
      for(const v of [-6, -5, -4, -3, -2]){ MK.line(c, axX - 6, axY(v), axX, axY(v), MID, 2); txt(c, fmtE(v).replace('.0', ''), axX - 10, axY(v), fs*.92, false, 'right'); }
      txt(c, 'lower = more familiar', axX - 34, axB - fs*.3, fs*.92, false, 'right', 'bottom');
      c.restore(); }
    c.restore(); }

  /* ---- distance to the class center ---- */
  if(a3 > 0){ c.save(); c.globalAlpha = a3;
    txt(c, 'distance to class center', 0, fs*.8, fs*1.2, true, 'left', 'middle');
    const netX = W*.235, netW = W*.08, netY = H*.12, netH = H*.8, rA = H*.33, rB = H*.77;
    const fx0 = W*.365, fx1 = W*.985, fy0 = H*.1, fy1 = H*.93, FX = v => fx0 + v*(fx1 - fx0), FY = v => fy0 + v*(fy1 - fy0);
    netBox(c, netX, netY, netW, netH, fs*.95, 1);
    c.strokeStyle = MID; c.lineWidth = 1.5; c.strokeRect(fx0, fy0, fx1 - fx0, fy1 - fy0);
    txt(c, 'feature space (schematic)', fx0 + 10, fy0 + 16, fs*.95, true, 'left', 'middle');
    /* training images of the class: grey placeholders */
    const tile = H*.075, tilesX = W*.005, gapT = 7;
    for(let i = 0; i < 8; i++){ c.save(); c.globalAlpha = .8; c.fillStyle = '#cbd5e1'; c.fillRect(tilesX + (i % 4)*(tile + gapT), rA - H*.12 + Math.floor(i/4)*(tile + gapT), tile, tile); c.restore(); }
    txt(c, 'training images,', tilesX, rA + H*.115, fs*.92, true, 'left', 'middle'); txt(c, 'this class', tilesX, rA + H*.115 + fs*1.1, fs*.92, true, 'left', 'middle');
    MK.arrow(c, tilesX + 4*(tile + gapT) + 4, rA, netX - 4, rA, 1);
    MK.arrow(c, netX + netW + 4, rA, fx0 - 6, rA, 1);
    /* grey points */
    const nCl = cl.length, st = beat === 11 ? raw*1.3 : 1.3;
    cl.forEach((pt, i) => { const q = beat === 11 ? ease(clamp01(st - i/nCl*.3)) : 1, tx = FX(pt.x), ty = FY(pt.y), ox = netX + netW + 4, oy = rA;
      if(q <= 0) return; dot(c, lerp(ox, tx, q), lerp(oy, ty, q), Math.max(5, W*.0046), true, .42); });
    /* the average */
    if(beat >= 12){ const a = beat === 12 ? p : 1, cx = FX(mx), cy = FY(my); c.save(); c.globalAlpha = a; c.strokeStyle = INK; c.lineWidth = 3.5; c.beginPath(); c.moveTo(cx - 11, cy); c.lineTo(cx + 11, cy); c.moveTo(cx, cy - 11); c.lineTo(cx, cy + 11); c.stroke(); c.restore();
      txt(c, '+ their average', fx0 + 10, fy0 + 16 + fs*2.3, fs*.95, false, 'left', 'middle', a); }
    txt(c, 'grey point: one training image of the class', fx0 + 10, fy0 + 16 + fs*1.2, fs*.95, false, 'left', 'middle', beat === 11 ? p : 1);
    /* new images */
    if(beat >= 13){ const a = beat === 13 ? p : 1, ts = H*.17, tx = W*.005, gapI = W*.012;
      txt(c, 'new images', tx, rB - ts/2 - fs*.8, fs*.92, true, 'left', 'middle', a);
      thumb(c, imgs[0], tx, rB - ts/2, ts, a); thumb(c, imgs[1], tx + ts + gapI, rB - ts/2, ts, a);
      MK.arrow(c, tx + 2*ts + gapI + 4, rB, netX - 4, rB, a); MK.arrow(c, netX + netW + 4, rB, fx0 - 6, rB, a);
      [near, far].forEach((pt, i) => { const q = beat === 13 ? ease(p) : 1, ox = netX + netW + 4, oy = rB, tx1 = FX(pt.x), ty1 = FY(pt.y), x = lerp(ox, tx1, q), y = lerp(oy, ty1, q);
        dot(c, x, y, 9, true, a);
        const th = i === 0 ? [tx1 + 44, ty1 + 34] : [tx1 + 12, ty1 - 28];
        if(i === 0){ c.save(); c.globalAlpha = a*q; MK.line(c, tx1, ty1, th[0], th[1], MID, 1.5); c.restore(); }
        thumb(c, imgs[i], th[0], th[1], 56, a*q); });
      txt(c, 'dark point: a new image', fx0 + 10, fy0 + 16 + fs*3.4, fs*.95, false, 'left', 'middle', a); }
    /* distances, in the class's spread */
    if(beat >= 14){ const a = p, cx = FX(mx), cy = FY(my);
      c.save(); c.globalAlpha = a; c.strokeStyle = INK; c.setLineDash([6, 4]); c.lineWidth = 2; c.beginPath(); c.ellipse(cx, cy, 2*sx*(fx1 - fx0), 2*sy*(fy1 - fy0), 0, 0, 7); c.stroke(); c.restore();
      [near, far].forEach((pt, i) => { const px = FX(pt.x), py = FY(pt.y); c.save(); c.globalAlpha = a; MK.line(c, cx, cy, px, py, INK, 2.2); c.restore();
        const lab = i === 0 ? [px + 106, py + 62, 'left'] : [px - 14, py - 8, 'right'];
        txt(c, fmtE(dist(pt)), lab[0], lab[1], fs*1.45, true, lab[2], i === 0 ? 'middle' : 'bottom', a); }); }
    c.restore(); }
}, {});
