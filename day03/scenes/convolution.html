<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Convolution: slide, multiply, add</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../deck/deck.css">
<style>
  /* Owner: convolution part (Day 3). Works alone too: open day03/scenes/convolution.html and click. */
  html, body{ background:#fff; }
  .wrap{ position:absolute; inset:0; padding:9vh 6vw 12vh; display:flex; flex-direction:column; gap:2vh; }
  .stagebox{ position:relative; flex:1 1 auto; min-height:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; }
  .cap{ position:absolute; left:0; bottom:-1vh; }
  .dots{ position:fixed; right:2vw; bottom:12px; display:flex; gap:6px; }
  .dots i{ width:7px; height:7px; border-radius:50%; background:#e2e8f0; }
  .dots i.on{ background:#64748b; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t deck-title">Convolution: slide, multiply, add</h1>
  <div class="stagebox">
    <canvas id="cv"></canvas>
    <div class="label cap" id="cap"></div>
  </div>
</div>
<div class="dots" id="dots"></div>
<script>
/* ACT 0  TITLE    (0):    the title alone
   ACT 1  IMAGE    (1):    an 8 x 8 image f: a bright bar on a dark ground (numbers + shading)
   ACT 2  KERNEL   (2):    a 3 x 3 kernel h
   ACT 3  ONE      (3):    the kernel over the top-left corner: 9 products, their sum, one output pixel
   ACT 4  STEP     (4):    one step to the right, a second output pixel
   ACT 5  ROW      (5):    the rest of the first row
   ACT 6  ALL      (6):    every position: the 6 x 6 output (the bar's two edges, with opposite signs)
   ACT 7  PADDING  (7):    pad with zeros: an 8 x 8 output, and new "edges" at the border

   Every output number is computed here (correlation, as in the slide; the next slide explains the flip).
   Output shading: 0 = mid gray, positive lighter, negative darker (the usual way to show an edge image). */
const IMG = [...Array(8)].map((_, r) => [...Array(8)].map((_, c) => (c === 3 || c === 4) && r >= 1 && r <= 6 ? 9 : 1));
const K = [[-1, 0, 1], [-1, 0, 1], [-1, 0, 1]];
const at = (r, c) => r < 0 || r > 7 || c < 0 || c > 7 ? 0 : IMG[r][c];       // zero padding outside
const out = (r, c) => { let s = 0; for(let i = 0; i < 3; i++) for(let j = 0; j < 3; j++) s += K[i][j] * at(r - 1 + i, c - 1 + j); return s; };
// positions are output centers (r, c); "valid" ones keep the kernel inside the image
const VALID = [], PADDED = [];
for(let r = 1; r <= 6; r++) for(let c = 1; c <= 6; c++) VALID.push([r, c]);
for(let r = 0; r <= 7; r++) for(let c = 0; c <= 7; c++) PADDED.push([r, c]);
const MAXO = Math.max(...PADDED.map(([r, c]) => Math.abs(out(r, c))));
const INK = '#0f172a', MUTE = '#94a3b8', LINE = '#cbd5e1';

const CAPS = ['', 'An image f', 'A kernel h: 3 × 3 weights', 'Multiply and add: one output pixel',
  'Slide one step, and repeat', 'Along the row', 'Over the whole image', 'Pad with zeros: same size, new edges at the border'];
const NOTES = [
  "(draft) Title only. Here is the one operation for today. Slide, multiply, add.",
  "(draft) Here is a tiny image, eight by eight pixels. Dark pixels have the value 1, and there is a bright bar in the middle with the value 9.",
  "(draft) And here is a kernel, also called a filter: a small grid of weights, three by three. This one has minus ones on the left, zeros in the middle, and ones on the right.",
  "(draft) Put the kernel on the top-left corner of the image. Multiply each weight by the pixel under it: here are the nine products. Add them up: zero. That sum is one pixel of the output. Zero makes sense: everything under the kernel is the same dark value, so right minus left is nothing.",
  "(draft) Now slide the kernel one pixel to the right, and do it again. Now the right column of the kernel sits on the bright bar, so we get 9 minus 1 on two rows: sixteen.",
  "(draft) Keep sliding along the row. Every position gives one output number.",
  "(draft) And down the whole image. Look at the result: zero wherever the image is flat, large and positive where it goes from dark to bright, and large and negative where it goes from bright to dark. This kernel is an edge detector for vertical edges.",
  "(draft) One detail. The output is smaller than the input, six by six, because the kernel cannot hang off the edge. If we want the same size, we pad the image with zeros. But look at the border: the padding itself creates edges that are not in the picture. Choosing how to pad is part of the lab."
];
const N = NOTES.length - 1;

/* per beat: which positions are visited (from k0 to k1), and what is shown */
const LEVEL = b => ({img: b >= 1 ? 1 : 0, ker: b >= 2 ? 1 : 0, pad: b >= 7 ? 1 : 0,
  k0: [0, 0, 0, 0, 0, 1, 5, 0][b], k1: [0, 0, 0, 0, 1, 5, 35, 63][b], win: b >= 3 && b <= 6 ? 1 : 0});

/* ---- state ---- */
let beat = 0, cur = LEVEL(0), from = LEVEL(0), t0 = 0, prog = 1;
const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const durOf = b => b === 6 ? 5000 : b === 5 ? 2200 : 1000;
function go(b, jump){
  beat = b; from = {...cur}; t0 = performance.now() - (jump ? 1e6 : 0);
  document.getElementById('cap').textContent = CAPS[b];
  document.getElementById('dots').innerHTML = [...Array(N)].map((_, k) => `<i class="${k < b ? 'on' : ''}"></i>`).join('');
}
function step(now){
  const T = LEVEL(beat), raw = Math.min(1, (now - t0) / durOf(beat));
  prog = beat >= 5 && beat <= 6 ? raw : ease(raw);            // sweeps go at a steady pace
  for(const k of ['img', 'ker', 'pad', 'win']) cur[k] = from[k] + (T[k] - from[k]) * Math.min(1, ease(raw) * 1.0);
  cur.k0 = T.k0; cur.k1 = T.k1;
}
/* the current window index and how many outputs are revealed */
function where(){
  if(beat < 3) return {k: -1, shown: 0, list: VALID};
  if(beat === 7) return {k: -1, shown: PADDED.length, list: PADDED};
  const k = beat <= 4 ? cur.k1 : Math.round(cur.k0 + (cur.k1 - cur.k0) * prog);
  return {k, shown: k + 1, list: VALID};
}

/* ---- drawing ---- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function size(){ const d = devicePixelRatio || 1;
  W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', size);
const font = (px, w) => `${w || 400} ${px}px Calibri, Carlito, 'Helvetica Neue', Arial, sans-serif`;
function cell(x, y, s, txt, fill, al, opt = {}){
  ctx.save(); ctx.globalAlpha = al;
  ctx.fillStyle = fill; ctx.fillRect(x, y, s, s);
  ctx.strokeStyle = opt.stroke || LINE; ctx.lineWidth = 1; ctx.setLineDash(opt.dash || []); ctx.strokeRect(x + .5, y + .5, s - 1, s - 1);
  if(txt !== ''){ ctx.fillStyle = opt.ink || INK; ctx.font = font(s * (opt.fs || .42), 700); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(String(txt).replace('-', '−'), x + s / 2, y + s * (opt.low ? .64 : .5) + 1); }
  ctx.restore();
}
const grayIn = v => { const g = Math.round(40 + (v - 1) / 8 * 200); return `rgb(${g},${g},${g})`; };
const grayOut = v => { const g = Math.round(128 + v / MAXO * 110); return `rgb(${g},${g},${g})`; };
const inkOn = g => g > 140 ? INK : '#fff';
function title(t, x, y, al){ ctx.save(); ctx.globalAlpha = al; ctx.fillStyle = INK; ctx.font = font(Math.max(16, H * .045), 700);
  ctx.textAlign = 'center'; ctx.fillText(t, x, y); ctx.restore(); }

function draw(){
  ctx.clearRect(0, 0, W, H);
  const s = Math.min(H * .8 / 10, W / 25), top = H * .06 + s;
  const xI = s, xK = W * .5 - 1.5 * s, xO = W - 9 * s;
  const {k, shown, list} = where();
  // input (with the zero ring when padding)
  title('f', xI + 4 * s, top - s * .45 - (cur.pad > .01 ? s : 0) * cur.pad, cur.img);
  for(let r = -1; r <= 8; r++) for(let c = -1; c <= 8; c++){
    const inside = r >= 0 && r <= 7 && c >= 0 && c <= 7;
    if(!inside && cur.pad < .01) continue;
    const v = at(r, c), g = 40 + (v - 1) / 8 * 200;
    cell(xI + c * s, top + r * s, s, String(v), inside ? grayIn(v) : '#fff', inside ? cur.img : cur.pad,
      {ink: inside ? inkOn(g) : MUTE, dash: inside ? [] : [4, 4], low: cur.win > .01 && k >= 0});
  }
  // kernel
  title('h', xK + 1.5 * s, top - s * .45, cur.ker);
  for(let i = 0; i < 3; i++) for(let j = 0; j < 3; j++) cell(xK + j * s, top + i * s, s, String(K[i][j]), '#f1f5f9', cur.ker);
  // window over the input, its products and their sum
  if(k >= 0 && cur.win > .01){
    const [r0, c0] = list[k];
    ctx.save(); ctx.globalAlpha = cur.win; ctx.strokeStyle = INK; ctx.lineWidth = 4;
    ctx.strokeRect(xI + (c0 - 1) * s, top + (r0 - 1) * s, 3 * s, 3 * s);
    ctx.fillStyle = INK; ctx.font = font(s * .24, 700); ctx.textAlign = 'right'; ctx.textBaseline = 'top';
    for(let i = 0; i < 3; i++) for(let j = 0; j < 3; j++){
      const x = xI + (c0 - 1 + j) * s, y = top + (r0 - 1 + i) * s;
      ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.fillRect(x + s * .5, y + 2, s * .48, s * .28);
      ctx.fillStyle = INK; ctx.fillText('×' + String(K[i][j]).replace('-', '−'), x + s - 4, y + 4);
    }
    ctx.restore();
    const yP = top + 4.3 * s;
    title('products', xK + 1.5 * s, yP - s * .3, cur.win);
    let sum = 0;
    for(let i = 0; i < 3; i++) for(let j = 0; j < 3; j++){
      const p = K[i][j] * at(r0 - 1 + i, c0 - 1 + j); sum += p;
      cell(xK + j * s, yP + i * s, s, String(p), '#fff', cur.win);
    }
    title('sum = ' + sum, xK + 1.5 * s, yP + 3 * s + s * .75, cur.win);
    // arrow from the sum to its output cell
    ctx.save(); ctx.globalAlpha = cur.win * .5; ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(xK + 3.4 * s, yP + 3.5 * s); ctx.lineTo(xO + c0 * s, top + (r0 + .5) * s); ctx.stroke(); ctx.restore();
  }
  // output: the frame of what will be filled, then the computed values
  const oa = beat >= 3 ? 1 : 0;
  title('g', xO + 4 * s, top - s * .45, oa);
  const frame = cur.pad > .5 ? PADDED : VALID;
  frame.forEach(([r, c]) => cell(xO + c * s, top + r * s, s, '', '#fff', oa * (frame === PADDED ? cur.pad : 1), {dash: [4, 4]}));
  list.slice(0, shown).forEach(([r, c], j) => {
    const v = out(r, c), g = 128 + v / MAXO * 110, hot = j === k && cur.win > .5;
    cell(xO + c * s, top + r * s, s, String(v), grayOut(v), list === PADDED ? Math.max(.001, cur.pad) : 1,
      {ink: inkOn(g), stroke: hot ? INK : LINE});
  });
}
function frame(now){ if(cv.clientWidth !== W || cv.clientHeight !== H) size();   // the deck preloads scenes hidden (size 0)
  step(now); draw(); requestAnimationFrame(frame); }

window.conv = {
  advance(){ if(beat < N) go(beat + 1); },
  back(){ if(beat > 0) go(beat - 1, true); },
  atStart: () => beat === 0,
  atEnd: () => beat === N,
  reset(){ cur = LEVEL(0); go(0, true); },
  resetToEnd(){ cur = LEVEL(N); go(N, true); },
  getBeat: () => beat,
  notes: NOTES
};
if(window.parent === window){
  addEventListener('keydown', e => { if(['ArrowRight', ' ', 'Enter'].includes(e.key)) conv.advance(); if(e.key === 'ArrowLeft') conv.back(); });
  addEventListener('click', () => conv.advance());
}
size(); go(0, true); requestAnimationFrame(frame);
</script>
</body>
</html>
