<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Textures: statistics as knobs</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../deck/deck.css">
<style>
  /* Owner: metamers part (Day 3, Fernanda). Works alone too: open day03/scenes/texture-knobs.html and click. */
  html, body{ background:#fff; }
  .wrap{ position:absolute; inset:0; padding:9vh 6vw 15vh; display:flex; flex-direction:column; gap:1vh; }
  .stagebox{ position:relative; flex:1 1 auto; min-height:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; transition:opacity .9s ease, filter .9s ease; }
  canvas.dim{ opacity:.2; filter:blur(2px); }
  .cap{ position:absolute; left:0; bottom:-1vh; }
  .pop{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.96); opacity:0; max-width:80%;
    text-align:center; transition:opacity .9s ease, transform .9s ease; }
  .pop.on{ opacity:1; transform:translate(-50%,-50%); }
  .dots{ position:fixed; right:2vw; bottom:12px; display:flex; gap:6px; }
  .dots i{ width:7px; height:7px; border-radius:50%; background:#e2e8f0; }
  .dots i.on{ background:#64748b; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t deck-title">Textures: statistics as knobs</h1>
  <div class="stagebox">
    <canvas id="cv"></canvas>
    <div class="label cap" id="cap"></div>
    <div class="popquote pop" id="pop">A good “model” would have knobs that allow us to synthesize stimuli that people perceive as realistic</div>
  </div>
</div>
<div class="cite" id="cite">Model: Portilla &amp; Simoncelli (2000); syntheses made with plenoptic 2.1.2 · Images: public domain / CC0 (see SOURCES.md)</div>
<div class="dots" id="dots"></div>
<script>
/* ACT 0  TITLE     (0):     the title alone
   ACT 1  THE MODEL (1-4):   a texture photo; center-surround filtering (2 sizes); oriented filtering (2 orientations x
                             2 sizes); envelopes (the size of each oriented response). Every panel is computed here,
                             live, from the photo itself
   ACT 2  KNOBS     (5):     the statistics, in four groups: the knobs (M, AC, C1, C2, after the paper's figure)
   ACT 3  TURN THEM (6-10):  start from white noise; then the recreated texture with 1, 2, 3, 4 groups matched
   ACT 4  COMPARE   (11-12): the brick wall, all groups; the statement

   The recreated textures are REAL syntheses, made with plenoptic's Portilla-Simoncelli model (assets/ps-textures/,
   manifest.json has the steps and losses). The group names follow plenoptic: pixel + marginal statistics;
   coefficient correlations; magnitude correlations; cross-scale phase statistics. The filter panels here are an
   illustration of the model's stages (center-surround and Gabor filters), not plenoptic's exact steerable pyramid. */
const A = '../assets/ps-textures/';
const KNOBS = [
  {sym: 'M',  name: 'pixel + marginal statistics', short: 'pixel + marginal', img: 'brick-cumulative-1-pixel_marginal.png'},
  {sym: 'AC', name: 'coefficient correlations', short: 'coefficient corr.',    img: 'brick-cumulative-2-pixel_marginal+coefficient_correlations.png'},
  {sym: 'C1', name: 'magnitude correlations', short: 'magnitude corr.',      img: 'brick-without-cross_scale_phase.png'},
  {sym: 'C2', name: 'cross-scale phase', short: 'cross-scale phase',           img: 'brick-all.png'},
];
const INK = '#0f172a', MUTE = '#94a3b8', KNOB = '#b45309';
const CAPS = ['', 'A texture', 'Center-surround filtering, as in the retina', 'Oriented filtering, as in V1',
  'Envelopes: how strongly each filter responds', 'Statistics of all of these: the knobs',
  'Recreate the texture: start from noise', 'Knob 1: match the pixel and marginal statistics', 'Knob 2: + coefficient correlations',
  'Knob 3: + magnitude correlations', 'Knob 4: + cross-scale phase: all statistics', 'A different texture, all statistics', ''];
const NOTES = [
  "(draft) Title only. For textures, the statistics are the knobs. Here is what that means, with a real model.",
  "(draft) Start from a photo of a texture: a brick wall.",
  "(draft) The model first does what the retina does: center-surround filtering, at two sizes. These panels are computed right now from the photo.",
  "(draft) Then what V1 does: oriented filters, like the Gabor filters from earlier today, at two orientations and two sizes.",
  "(draft) Then it takes the envelope of each oriented response: how strongly that filter responds, regardless of its sign.",
  "(draft) From all of these, the model measures statistics, averaged over the whole image, in four groups: the pixel and marginal statistics; correlations between filter responses; correlations between their envelopes; and phase relations across scales. Each group is a knob we can turn on or off.",
  "(draft) Now let's recreate the texture. Start from white noise, and adjust its pixels with gradient descent until the statistics we have turned on match the photo's. Every image from here on is a real synthesis.",
  "(draft) With only the first knob, the pixel and marginal statistics, we get the right grays, in a cloudy mess. No bricks.",
  "(draft) Add the correlations between filter responses: the right sizes of blobs start to appear.",
  "(draft) Add the correlations between envelopes: now we get edges and shapes. This knob does a lot of the work: the mismatch on all the statistics drops more than five times at this step.",
  "(draft) Add the last knob, phase across scales, and we have all the statistics. Compare with the photo: no pixel was copied, and yet it reads as the same kind of stuff.",
  "(draft) The same knobs on a harder texture: pebbles. The grays and the grain come back, but the pebbles lose their smooth, closed outlines. Each pebble is a small object, and these statistics are local: a hint of what this set of knobs still misses.",
  "(draft) So a good model would have knobs that allow us to synthesize stimuli that people perceive as realistic. Where the synthesis fails, it tells us which knob is missing. That is how we find the edges of the representation."
];
const N = NOTES.length - 1;

/* ---- images ---- */
const load = src => new Promise(ok => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ok(null); i.src = src; });
let IMG = {}, PAN = null;
Promise.all([load(A + 'brick-original.png'), load(A + 'brick-noise.png'), load(A + 'pebbles-original.png'), load(A + 'pebbles-all.png'),   /* Fernanda 2026-11-04: brick first; pebbles, a harder texture, at the end (in the brick/brickAll slots) */
  ...KNOBS.map(k => load(A + k.img))]).then(([orig, noise, brick, brickAll, ...ks]) => {
  IMG = {orig, noise, brick, brickAll, ks}; PAN = panels(orig);
});

/* ---- the model's stages, computed from the photo (128 x 128, gray) ---- */
const S = 128;
function gray(img){ const c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
  g.drawImage(img, 0, 0, S, S); const d = g.getImageData(0, 0, S, S).data, a = new Float32Array(S * S);
  for(let i = 0; i < S * S; i++) a[i] = d[i * 4] / 255; return a; }
function conv(a, k, D){ const R = (D - 1) / 2, o = new Float32Array(S * S);
  for(let r = 0; r < S; r++) for(let c = 0; c < S; c++){ let s = 0;
    for(let i = 0; i < D; i++){ const rr = Math.min(S - 1, Math.max(0, r + i - R));
      for(let j = 0; j < D; j++){ const cc = Math.min(S - 1, Math.max(0, c + j - R)); s += k[i * D + j] * a[rr * S + cc]; } }
    o[r * S + c] = s; } return o; }
function dog(sc){ const ss = sc * 2.5, R = Math.ceil(3 * ss), D = 2 * R + 1, k = new Float32Array(D * D); let m = 0;
  for(let i = 0; i < D; i++) for(let j = 0; j < D; j++){ const d2 = (i - R) ** 2 + (j - R) ** 2;
    k[i * D + j] = Math.exp(-d2 / (2 * sc * sc)) / (sc * sc) - Math.exp(-d2 / (2 * ss * ss)) / (ss * ss); m += k[i * D + j]; }
  for(let i = 0; i < D * D; i++) k[i] -= m / (D * D); return {k, D}; }
function gabor(lam, th, psi){ const s = .5 * lam, R = Math.ceil(2.5 * s), D = 2 * R + 1, k = new Float32Array(D * D), t = th * Math.PI / 180; let m = 0;
  for(let i = 0; i < D; i++) for(let j = 0; j < D; j++){ const y = i - R, x = j - R, xr = x * Math.cos(t) + y * Math.sin(t), yr = -x * Math.sin(t) + y * Math.cos(t);
    k[i * D + j] = Math.exp(-(xr * xr + yr * yr) / (2 * s * s)) * Math.cos(2 * Math.PI * xr / lam + psi); m += k[i * D + j]; }
  for(let i = 0; i < D * D; i++) k[i] -= m / (D * D); return {k, D}; }
function toCanvas(a, signed){ let lo = Infinity, hi = -Infinity; for(const v of a){ lo = Math.min(lo, v); hi = Math.max(hi, v); }
  if(signed){ const m = Math.max(-lo, hi); lo = -m; hi = m; }
  const c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d'), im = g.createImageData(S, S);
  for(let i = 0; i < S * S; i++){ const v = Math.round(255 * (a[i] - lo) / (hi - lo || 1)); im.data.set([v, v, v, 255], i * 4); }
  g.putImageData(im, 0, 0); return c; }
function panels(img){
  const a = gray(img);
  const cs = [3, 6].map(sc => { const {k, D} = dog(sc); return conv(a, k, D); });
  const ori = []; const env = [];
  [[6, 0], [6, 90], [12, 45], [12, 135]].forEach(([lam, th]) => {
    const e = gabor(lam, th, 0), o = gabor(lam, th, Math.PI / 2), re = conv(a, e.k, e.D), im = conv(a, o.k, o.D);
    ori.push(toCanvas(re, true)); env.push(toCanvas(re.map((v, i) => Math.hypot(v, im[i])), false)); });
  return {cs: cs.map(x => toCanvas(x, true)), ori, env};
}

/* ---- state ---- */
const LEVEL = b => ({tex: b >= 1 ? 1 : 0, cs: b >= 2 ? 1 : 0, ori: b >= 3 ? 1 : 0, env: b >= 4 ? 1 : 0, knobs: b >= 5 ? 1 : 0,
  syn: b >= 6 ? 1 : 0, brick: b >= 11 ? 1 : 0});
const onCount = b => Math.max(0, Math.min(4, b - 6));        // knobs turned on
let beat = 0, cur = LEVEL(0), from = LEVEL(0), t0 = 0, prog = 1, prevOn = 0;
const DUR = 1300, ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
function go(b, jump){
  prevOn = onCount(beat); beat = b; from = {...cur}; t0 = performance.now() - (jump ? DUR : 0);
  if(jump) prevOn = onCount(b);
  document.getElementById('cap').textContent = CAPS[b];
  document.getElementById('pop').classList.toggle('on', b === N);
  cv.classList.toggle('dim', b === N);
  document.getElementById('dots').innerHTML = [...Array(N)].map((_, k) => `<i class="${k < b ? 'on' : ''}"></i>`).join('');
}
function step(now){ const T = LEVEL(beat); prog = ease(Math.min(1, (now - t0) / DUR)); for(const k in T) cur[k] = from[k] + (T[k] - from[k]) * prog; }

/* ---- drawing ---- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function size(){ const d = devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', size);
const font = (px, w) => `${w || 400} ${px}px Calibri, Carlito, 'Helvetica Neue', Arial, sans-serif`;
function pic(c, x, y, s, al, frame){ if(!c || al < .01) return; ctx.save(); ctx.globalAlpha = al; ctx.drawImage(c, x, y, s, s);
  if(frame){ ctx.strokeStyle = MUTE; ctx.lineWidth = 1; ctx.strokeRect(x + .5, y + .5, s - 1, s - 1); } ctx.restore(); }
function line(x1, y1, x2, y2, al){ ctx.save(); ctx.globalAlpha = al; ctx.strokeStyle = MUTE; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); }
function band(y, h, label, al){ ctx.save(); ctx.globalAlpha = al * .55; ctx.fillStyle = '#e2e8f0'; ctx.fillRect(0, y, W * .6, h);
  ctx.globalAlpha = al; ctx.fillStyle = INK; ctx.font = font(Math.max(14, H * .03)); ctx.textBaseline = 'middle'; ctx.fillText(label, 8, y + h / 2); ctx.restore(); }
/* each statistic group drawn as a knob (Fernanda, 2026-11-04): a dial whose notch turns from off (lower left) to on
   (upper right) on the click that switches it on, like the color knobs */
function knob(x, y, r, k, lit, al){ ctx.save(); ctx.globalAlpha = al;
  const turning = lit && k >= prevOn && beat < 11, t = turning ? prog : 1;
  const ang = (lit ? -225 + 270 * t * (turning ? 1 : 1) : -225) * Math.PI / 180;
  const fillA = lit ? (turning ? t : 1) : 0;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fillStyle = '#fff'; ctx.fill();
  if(fillA > 0){ ctx.globalAlpha = al * fillA; ctx.fillStyle = KNOB; ctx.fill(); ctx.globalAlpha = al; }
  ctx.strokeStyle = KNOB; ctx.lineWidth = 2.5; ctx.stroke();
  // the dial's travel, and its notch
  ctx.beginPath(); ctx.arc(x, y, r * 1.28, -225 * Math.PI / 180, 45 * Math.PI / 180); ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = 2; ctx.stroke();
  const nx = x + Math.cos(ang) * r * 1.28, ny = y + Math.sin(ang) * r * 1.28;
  ctx.beginPath(); ctx.arc(nx, ny, Math.max(3, r * .22), 0, 7); ctx.fillStyle = KNOB; ctx.fill();
  ctx.fillStyle = fillA > .5 ? '#fff' : INK; ctx.font = font(r * .8, 700); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(KNOBS[k].sym, x, y + 1); ctx.restore(); }
function draw(){
  ctx.clearRect(0, 0, W, H);
  if(!PAN) return;
  const LW = W * .6, cx = LW * .55, s1 = Math.min(H * .2, LW * .16), rowH = H * .245;
  const y0 = 0, y1 = y0 + rowH, y2 = y1 + rowH, y3 = y2 + rowH;
  // the model, top to bottom
  pic(IMG.orig, cx - s1 / 2, y0, s1, cur.tex, true);
  const s2 = s1 * .85, xs2 = [cx - LW * .2, cx + LW * .2];
  if(cur.cs > .01){ band(y1 - H * .01, s2 + H * .02, 'retina, LGN', cur.cs);
    xs2.forEach((x, i) => { line(cx, y0 + s1, x, y1, cur.cs); pic(PAN.cs[i], x - s2 / 2, y1, s2, cur.cs, true); }); }
  const xs3 = [-.33, -.11, .11, .33].map(f => cx + LW * f), s3 = Math.min(s2 * .85, LW * .17);
  if(cur.ori > .01){ band(y2 - H * .01, s3 + H * .02, 'V1', cur.ori);
    xs3.forEach((x, i) => { line(xs2[i < 2 ? 0 : 1], y1 + s2, x, y2, cur.ori); pic(PAN.ori[i], x - s3 / 2, y2, s3, cur.ori, true); }); }
  if(cur.env > .01){ band(y3 - H * .01, s3 + H * .02, 'envelopes', cur.env);
    xs3.forEach((x, i) => { line(x, y2 + s3, x, y3, cur.env); pic(PAN.env[i], x - s3 / 2, y3, s3, cur.env, true); }); }
  // the knobs: one circle per group, beside the stage it is computed on
  if(cur.knobs > .01){
    const r = Math.max(14, H * .032), on = onCount(beat);
    const pos = [[cx + s1 / 2 + r * 2.4, y0 + s1 * .55], [xs3[3] + s3 / 2 + r * 1.8, y2 + s3 / 2], [xs3[3] + s3 / 2 + r * 1.8, y3 + s3 / 2], [cx, y2 - H * .035]];
    pos.forEach(([x, y], k) => knob(x, y, r, k, k < on, cur.knobs));
  }
  // the recreated texture, and the knob panel under it
  if(cur.syn > .01){
    const RX = W * .66, s = Math.min(W * .3, H * .6), ry = 0, on = onCount(beat);
    const show = beat >= 11 ? IMG.brickAll : on === 0 ? IMG.noise : IMG.ks[on - 1];
    const prev = beat >= 11 ? (prevOn ? IMG.ks[prevOn - 1] : IMG.noise) : prevOn === 0 ? IMG.noise : IMG.ks[prevOn - 1];
    if(beat < 11 || cur.brick < .99){ const a = 1 - cur.brick;
      pic(prev, RX, ry, s, cur.syn * a * (1 - prog), true); pic(show === IMG.brickAll ? IMG.ks[3] : show, RX, ry, s, cur.syn * a * (prev === show ? 1 : prog), true); }
    ctx.save(); ctx.globalAlpha = cur.syn * (1 - cur.brick); ctx.fillStyle = INK; ctx.font = font(Math.max(15, H * .034), 700); ctx.textAlign = 'center';
    ctx.fillText('recreated from noise', RX + s / 2, ry + s + H * .05); ctx.restore();
    if(cur.brick > .01){ const h = s * .49;
      pic(IMG.brick, RX, ry + (s - h) / 2, h, cur.brick, true); pic(IMG.brickAll, RX + s - h, ry + (s - h) / 2, h, cur.brick, true);
      ctx.save(); ctx.globalAlpha = cur.brick; ctx.fillStyle = INK; ctx.font = font(Math.max(15, H * .032), 700); ctx.textAlign = 'center';
      ctx.fillText('the photo', RX + h / 2, ry + (s + h) / 2 + H * .045); ctx.fillText('recreated, all knobs', RX + s - h / 2, ry + (s + h) / 2 + H * .045); ctx.restore(); }
    const r = Math.max(13, H * .028);
    KNOBS.forEach((kb, k) => { const x = RX + r + (k % 2) * (s / 2), ky = ry + s + H * .11 + Math.floor(k / 2) * r * 2.6;
      knob(x, ky, r, k, k < on || beat >= 11, cur.syn);
      ctx.save(); ctx.globalAlpha = cur.syn; ctx.fillStyle = INK; ctx.font = font(Math.max(13, Math.min(H * .028, s * .055))); ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(kb.short, x + r * 1.4, ky); ctx.restore(); });
  }
}
function frame(now){ if(cv.clientWidth !== W || cv.clientHeight !== H) size(); step(now); draw(); requestAnimationFrame(frame); }

window.textureKnobs = {
  advance(){ if(beat < N) go(beat + 1); },
  back(){ if(beat > 0) go(beat - 1, true); },
  atStart: () => beat === 0,
  atEnd: () => beat === N,
  reset(){ cur = LEVEL(0); go(0, true); },
  resetToEnd(){ cur = LEVEL(N); go(N, true); },
  getBeat: () => beat,
  notes: NOTES
};
if(window.parent === window){
  addEventListener('keydown', e => { if(['ArrowRight', ' ', 'Enter'].includes(e.key)) textureKnobs.advance(); if(e.key === 'ArrowLeft') textureKnobs.back(); });
  addEventListener('click', () => textureKnobs.advance());
}
size(); go(0, true); requestAnimationFrame(frame);
</script>
</body>
</html>
