<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Receptive fields in V1, filters in a computer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../deck/deck.css">
<style>
  /* Owner: receptive-fields part (Day 3). Works alone too: open day03/scenes/gabor.html and click. */
  html, body{ background:#fff; }
  .wrap{ position:absolute; inset:0; padding:9vh 6vw 12vh; display:flex; flex-direction:column; gap:2vh; }
  .stagebox{ position:relative; flex:1 1 auto; min-height:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; transition:opacity .9s ease, filter .9s ease; }
  canvas.dim{ opacity:.22; filter:blur(2px); }
  .cap{ position:absolute; left:0; bottom:-1vh; }
  .gabor-hw{ position:absolute; left:0; top:0; width:40%; height:44%; display:flex; flex-direction:column; justify-content:center; opacity:0; transition:opacity .8s ease; }
  .gabor-hw.on{ opacity:1; }
  .cite{ opacity:0; transition:opacity .8s ease; }
  .cite.on{ opacity:1; }
  .pop{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(.96); opacity:0;
    transition:opacity .9s ease, transform .9s ease; white-space:nowrap; }
  .pop.on{ opacity:1; transform:translate(-50%,-50%); }
  .dots{ position:fixed; right:2vw; bottom:12px; display:flex; gap:6px; }
  .dots i{ width:7px; height:7px; border-radius:50%; background:#e2e8f0; }
  .dots i.on{ background:#64748b; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t deck-title">Receptive fields in V1, filters in a computer</h1>
  <div class="stagebox">
    <canvas id="cv"></canvas>
    <div class="gabor-hw" id="hw"><div class="todo" style="width:100%">Figure: Hubel &amp; Wiesel recording, a bar of light at several orientations and the cell's spikes. Needs a licensed or public image. source: to add</div></div>
    <div class="label cap" id="cap"></div>
    <div class="popquote pop" id="pop">A bank of oriented filters: a model of V1</div>
  </div>
</div>
<div class="cite" id="cite"></div>
<div class="dots" id="dots"></div>
<script>
/* ACT 0  TITLE      (0):  the title alone
   ACT 1  H&W        (1):  Hubel & Wiesel: V1 cells prefer bars at one orientation (figure to add)
   ACT 2  SIMPLE     (2):  a simple cell's receptive field: excitatory stripe, inhibitory flanks (schematic)
   ACT 3  GABOR      (3):  one Gabor filter, computed: a stripe pattern under a Gaussian window
   ACT 4  BANK       (4):  a bank: 4 orientations x 3 sizes
   ACT 5  RESPONSES  (5):  a test image (a disk) through 4 orientations: each finds its own part of the edge
   ACT 6  POINT      (6):  the statement, figure dimmed

   All filters and responses are computed here. Response = magnitude of the even + odd (quadrature) pair. */
const ORI = [0, 45, 90, 135], LAMS = [8, 13, 20];      // orientations (deg), wavelengths (px)
const T = 128, DISK = 38;                               // test image size, disk radius
const INK = '#0f172a', MUTE = '#94a3b8', EARLY = '#38506e';
const CAPS = ['', 'V1 cells prefer bars at one orientation', 'A simple cell: excitatory stripe, inhibitory flanks (schematic)',
  'A Gabor filter: stripes under a Gaussian window', 'A filter bank: 4 orientations × 3 sizes', 'Each orientation finds its own part of the edge', ''];
const HW = 'Hubel & Wiesel (1959), J. Physiol. 148 (source: to check)';
const CITES = ['', HW, HW, HW, HW, '', 'Gabor fits to simple cells: Jones & Palmer (1987), J. Neurophysiol. (source: to check)'];
const NOTES = [
  "(draft) Title only. From the retina to the first stage of visual cortex, V1.",
  "(draft) In the late 1950s, David Hubel and Torsten Wiesel recorded from single neurons in the visual cortex of the cat while showing bars of light on a screen. Many cells responded strongly to a bar at one orientation and hardly at all to other orientations.",
  "(draft) For one type, the simple cells, you can map the receptive field: a stripe where light excites the cell, with stripes on both sides where light inhibits it. This drawing is a schematic, not data. Compare it with the round center-surround field from the retina: now it has an orientation.",
  "(draft) Here is a filter we can write down: a Gabor filter. It is a stripe pattern, a cosine, multiplied by a Gaussian window. Bright where it is positive, dark where it is negative. It looks a lot like the simple cell: a positive stripe with negative flanks.",
  "(draft) Make one for each orientation and size, and you have a filter bank: here four orientations and three sizes.",
  "(draft) Now convolve a test image, a bright disk, with filters at four orientations. Each one responds only where the edge of the disk has its orientation: left and right for vertical stripes, top and bottom for horizontal ones, and the diagonals for the diagonal filters. Every number here is computed with the convolution from twenty minutes ago.",
  "(draft) So a bank of oriented filters is a good first model of V1. Gabor functions fit the receptive fields of simple cells well. And, as we will see later in the course, neural networks trained on images often learn filters that look like these in their first layer."
];
const N = NOTES.length - 1;

/* ---- filters and responses, computed ---- */
function gaborKernel(lam, th, psi){
  const s = .5 * lam, g = .5, R = Math.ceil(2.5 * s / g), D = 2 * R + 1, k = new Float32Array(D * D), t = th * Math.PI / 180;
  let mean = 0;
  for(let i = 0; i < D; i++) for(let j = 0; j < D; j++){
    const y = i - R, x = j - R, xr = x * Math.cos(t) + y * Math.sin(t), yr = -x * Math.sin(t) + y * Math.cos(t);
    k[i * D + j] = Math.exp(-(xr * xr + g * g * yr * yr) / (2 * s * s)) * Math.cos(2 * Math.PI * xr / lam + psi); mean += k[i * D + j];
  }
  mean /= D * D; for(let i = 0; i < D * D; i++) k[i] -= mean;          // zero mean: no response to flat gray
  return {k, D, R};
}
function kerCanvas({k, D}){
  const c = document.createElement('canvas'); c.width = c.height = D; const g = c.getContext('2d'), im = g.createImageData(D, D);
  const m = Math.max(...k.map(Math.abs));
  for(let i = 0; i < D * D; i++){ const v = Math.round(128 + 127 * k[i] / m); im.data.set([v, v, v, 255], i * 4); }
  g.putImageData(im, 0, 0); return c;
}
const TEST = new Float32Array(T * T).map((_, i) => { const y = Math.floor(i / T) - T / 2 + .5, x = i % T - T / 2 + .5; return x * x + y * y < DISK * DISK ? 1 : .25; });
function convolve(img, {k, D, R}){
  const o = new Float32Array(T * T);
  for(let r = 0; r < T; r++) for(let c = 0; c < T; c++){
    let s = 0;
    for(let i = 0; i < D; i++){ const rr = Math.min(T - 1, Math.max(0, r + i - R));
      for(let j = 0; j < D; j++){ const cc = Math.min(T - 1, Math.max(0, c + j - R)); s += k[i * D + j] * img[rr * T + cc]; } }
    o[r * T + c] = s;
  }
  return o;
}
const RESP = ORI.map(th => { const e = convolve(TEST, gaborKernel(LAMS[1], th, 0)), o = convolve(TEST, gaborKernel(LAMS[1], th, Math.PI / 2));
  return e.map((v, i) => Math.hypot(v, o[i])); });
const RMAX = Math.max(...RESP.map(r => Math.max(...r)));
const toCanvas = (a, lo, hi) => { const c = document.createElement('canvas'); c.width = c.height = T; const g = c.getContext('2d'), im = g.createImageData(T, T);
  for(let i = 0; i < T * T; i++){ const v = Math.round(255 * Math.max(0, Math.min(1, (a[i] - lo) / (hi - lo)))); im.data.set([v, v, v, 255], i * 4); }
  g.putImageData(im, 0, 0); return c; };
const IMG = {test: toCanvas(TEST, 0, 1), resp: RESP.map(r => toCanvas(r, 0, RMAX)),
  bank: LAMS.map(l => ORI.map(th => kerCanvas(gaborKernel(l, th, 0)))), one: kerCanvas(gaborKernel(LAMS[2], 0, 0)),
  small: ORI.map(th => kerCanvas(gaborKernel(LAMS[1], th, 0)))};

/* ---- state ---- */
const LEVEL = b => ({hw: b >= 1 && b <= 4 ? 1 : 0, simple: b >= 2 && b <= 4 ? 1 : 0, one: b === 3 ? 1 : 0, bank: b === 4 ? 1 : 0, resp: b >= 5 ? 1 : 0});
let beat = 0, cur = LEVEL(0), from = LEVEL(0), t0 = 0;
const DUR = 1300, ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
function go(b, jump){
  beat = b; from = {...cur}; t0 = performance.now() - (jump ? DUR : 0);
  document.getElementById('cap').textContent = CAPS[b];
  document.getElementById('hw').classList.toggle('on', b >= 1 && b <= 4);
  const ci = document.getElementById('cite'); ci.textContent = CITES[b] || ci.textContent; ci.classList.toggle('on', !!CITES[b]);
  document.getElementById('pop').classList.toggle('on', b === N);
  cv.classList.toggle('dim', b === N);
  document.getElementById('dots').innerHTML = [...Array(N)].map((_, k) => `<i class="${k < b ? 'on' : ''}"></i>`).join('');
}
function step(now){ const L = LEVEL(beat), p = ease(Math.min(1, (now - t0) / DUR)); for(const k in L) cur[k] = from[k] + (L[k] - from[k]) * p; }

/* ---- drawing ---- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function size(){ const d = devicePixelRatio || 1;
  W = cv.clientWidth; H = cv.clientHeight; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', size);
const font = (px, w) => `${w || 400} ${px}px Calibri, Carlito, 'Helvetica Neue', Arial, sans-serif`;
function img(c, x, y, s, al, smooth){ ctx.save(); ctx.globalAlpha = al; ctx.imageSmoothingEnabled = !!smooth; ctx.drawImage(c, x, y, s, s); ctx.restore(); }
function text(t, x, y, px, al, w){ ctx.save(); ctx.globalAlpha = al; ctx.fillStyle = INK; ctx.font = font(px, w || 700); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(t, x, y); ctx.restore(); }

function simpleCell(cx, cy, h, al){                    // schematic: a + stripe with - flanks
  ctx.save(); ctx.globalAlpha = al; ctx.lineWidth = 2;
  [[-1, '−'], [0, '+'], [1, '−']].forEach(([k, sg]) => {
    const x = cx + k * h * .3;
    ctx.fillStyle = sg === '+' ? '#f1f5f9' : '#cbd5e1'; ctx.strokeStyle = MUTE;
    ctx.beginPath(); ctx.ellipse(x, cy, h * .13, h * .45, 0, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ctx.font = font(h * .1, 700); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    [-.25, 0, .25].forEach(dy => ctx.fillText(sg, x, cy + dy * h));
  });
  ctx.restore();
}
function draw(){
  ctx.clearRect(0, 0, W, H);
  // left column: the neuron
  if(cur.simple > .01){ const h = H * .38; simpleCell(W * .2, H * .7, h, cur.simple); }
  // right column: one Gabor, then the bank
  const rx = W * .5, rw = W * .5;
  if(cur.one > .01){ const s = Math.min(H * .7, rw * .6); img(IMG.one, rx + (rw - s) / 2, (H - s) / 2 - H * .03, s, cur.one, true); }
  if(cur.bank > .01){
    const cell = Math.min(rw / 4.6, H * .9 / 3.4), gx = rx + (rw - 4 * cell * 1.08) / 2, gy = (H - 3 * cell * 1.08) / 2;
    LAMS.forEach((l, r) => ORI.forEach((th, c) => {
      const big = IMG.bank[2][0].width, k = IMG.bank[r][c], s = cell * k.width / big;   // true relative sizes
      img(k, gx + c * cell * 1.08 + (cell - s) / 2, gy + r * cell * 1.08 + (cell - s) / 2, s, cur.bank, true);
    }));
  }
  // responses: the test image, then one map per orientation, each under its filter
  if(cur.resp > .01){
    const s = Math.min(W / 5.6, H * .62), gap = (W - 5 * s) / 5, y = H * .3;
    img(IMG.test, 0, y, s, cur.resp); text('test image', s / 2, y + s + H * .05, Math.max(15, H * .036), cur.resp, 400);
    ORI.forEach((th, k) => {
      const x = (k + 1) * (s + gap) + gap * .2, ks = s * .36;
      img(IMG.small[k], x + (s - ks) / 2, y - ks - H * .04, ks, cur.resp, true);
      img(IMG.resp[k], x, y, s, cur.resp, true);
    });
  }
}
function frame(now){ if(cv.clientWidth !== W || cv.clientHeight !== H) size();   // the deck preloads scenes hidden (size 0)
  step(now); draw(); requestAnimationFrame(frame); }

window.gabor = {
  advance(){ if(beat < N) go(beat + 1); },
  back(){ if(beat > 0) go(beat - 1, true); },
  atStart: () => beat === 0,
  atEnd: () => beat === N,
  reset(){ cur = LEVEL(0); go(0, true); },
  resetToEnd(){ cur = LEVEL(N); go(N, true); },
  getBeat: () => beat,
  notes: NOTES
};
if(window.parent === window){
  addEventListener('keydown', e => { if(['ArrowRight', ' ', 'Enter'].includes(e.key)) gabor.advance(); if(e.key === 'ArrowLeft') gabor.back(); });
  addEventListener('click', () => gabor.advance());
}
size(); go(0, true); requestAnimationFrame(frame);
</script>
</body>
</html>
