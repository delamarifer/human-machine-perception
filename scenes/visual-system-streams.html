<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How the brain solves this: from the eye to two streams</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../deck/deck.css">
<style>
  /* Owner: visual-system part. Pattern A (canvas overlay on a real figure). Works alone too. */
  html, body{ background:#fff; }
  .wrap{ position:absolute; inset:0; padding:9vh 6vw 12vh; display:flex; flex-direction:column; gap:2vh; }
  .stagebox{ position:relative; flex:1 1 auto; min-height:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; }
  .cap{ position:absolute; left:0; bottom:-1vh; }
  .dots{ position:fixed; right:2vw; bottom:12px; display:flex; gap:6px; }
  .dots i{ width:7px; height:7px; border-radius:50%; background:#e2e8f0; }
  .dots i.on{ background:#64748b; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t deck-title">How the brain solves this</h1>
  <div class="stagebox">
    <canvas id="cv"></canvas>
    <div class="label cap" id="cap"></div>
  </div>
  <div class="cite">Figure source: to add</div>
</div>
<div class="dots" id="dots"></div>
<script>
/* ACT 0  TITLE    (0):   the title alone
   ACT 1  FIGURE   (1):   the visual pathways figure
   ACT 2  LIGHT    (2):   light comes in from the left, through the pupil, onto the retina
   ACT 3  EARLY    (3):   retina -> LGN -> V1, a pulse travelling along it
   ACT 4  VENTRAL  (4):   V1 -> V4 -> IT, "what"; the early path stays, dimmed
   ACT 5  DORSAL   (5):   V1 -> V3A -> V6 / MST -> parietal (SPL, IPL), "where / how"
   ACT 6  BOTH     (6):   both streams at equal weight

   Node centres and half-sizes were DETECTED from the image (flood fill of each white node,
   centre and half-extent of its bounding box), not eyeballed: [u, v, ru, rv], fractions of the
   image width / height. Re-run the detector if the figure is ever re-exported.
   Lines run from node edge to node edge so the node names stay readable; a node lights up as a
   colored ring around its ellipse, not a fill over its text. */
const IMG_W = 736, IMG_H = 529;
const NODE = {
  Retina: [.100, .640, .058, .082], LGN: [.495, .512, .058, .040], V1:  [.861, .606, .029, .039],
  V4:     [.678, .663, .049, .039], IT:  [.383, .744, .079, .050], V3A: [.825, .472, .043, .046],
  V6:     [.790, .373, .039, .043], MST: [.688, .481, .069, .065], IPL: [.591, .341, .061, .088],
  SPL:    [.693, .242, .061, .087],
};
const PUPIL = [.043, .642, .005, .022];                  // the black mark on the Retina circle (detected the same way)
const PATHS = {                                         // each step follows an arrow drawn in the figure
  early:   [['Retina', 'LGN', 'V1']],
  what:    [['V1', 'V4', 'IT']],
  where:   [['V1', 'V3A', 'V6', 'SPL'], ['V3A', 'MST', 'IPL']],
};
/* the talk's colors, read from deck.css: slate-blue = eye to V1, plum = "what", pine = "where / how" */
const hex = v => { const h = getComputedStyle(document.documentElement).getPropertyValue(v).trim().slice(1);
  return [0, 2, 4].map(k => parseInt(h.slice(k, k + 2), 16)); };
const COL = {early: hex('--early'), what: hex('--what'), where: hex('--where')};
const LABELS = {what: ['what', .72], where: ['where / how', .30]};   // label text, height (fraction of image)

const CAPS = ['', '', 'Light reaches the retina', 'Retina → LGN → V1', 'Ventral stream', 'Dorsal stream', 'Two streams'];
const NOTES = [
  "(draft) Title only. So how does the brain manage it?",
  "(draft) Here is a map of the main visual pathways, drawn on the side of the brain.",
  "(draft) Light enters the eye through the pupil and lands on the retina, at the back of the eye.",
  "(draft) From the retina, the signal travels through the LGN, in the thalamus, to primary visual cortex, V1, at the back of the head.",
  "(draft) From V1, one stream runs down and forward, through V4 to inferotemporal cortex, IT. This ventral stream is often called the 'what' pathway: recognizing objects.",
  "(draft) A second stream runs up into parietal cortex. This dorsal stream is often called the 'where' or 'how' pathway: locating things and guiding action.",
  "(draft) Two streams working together. Next slide: more detail on what each stage computes."
];
const N = NOTES.length - 1;

/* per beat: how strongly each layer shows. Established layers sit at a constant lower level, never off. */
const LEVEL = b => ({
  fig:   b >= 1 ? 1 : 0,
  light: b === 2 ? 1 : b >= 3 ? .34 : 0,
  early: b === 3 ? 1 : b >= 4 ? .34 : 0,
  what:  b === 4 || b === 6 ? 1 : b === 5 ? .34 : 0,
  where: b >= 5 ? 1 : 0,
});
/* the pulse runs only on the beat that introduces a path; the closing beat is still, both streams at equal weight */
const ACTIVE = b => b === 2 ? ['light'] : b === 3 ? ['early'] : b === 4 ? ['what'] : b === 5 ? ['where'] : [];

let beat = 0, from = LEVEL(0), cur = LEVEL(0), t0 = 0;
const DUR = 1200, PULSE = 4200;                          // ms: layer fade, one calm pulse traversal
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
const sstep = t => (t = Math.max(0, Math.min(1, t)), t * t * (3 - 2 * t));
function go(b, jump){
  beat = b; from = {...cur}; t0 = performance.now() - (jump ? DUR : 0);
  document.getElementById('cap').textContent = CAPS[b];
  document.getElementById('dots').innerHTML = [...Array(N)].map((_, k) => `<i class="${k < b ? 'on' : ''}"></i>`).join('');
}

const img = new Image(); img.src = '../assets/visual-system/pathways.png';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, s = 1, ox = 0, oy = 0;
function size(){
  const d = devicePixelRatio || 1; W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  const capH = H * .09, L = W * .07, R = W * .17;         // caption below; light comes in on the left; stream labels on the right
  s = Math.min((W - L - R) / IMG_W, (H - capH) / IMG_H);
  ox = L + (W - L - R - IMG_W * s) / 2; oy = (H - capH - IMG_H * s) / 2;
}
const P = n => [ox + NODE[n][0] * IMG_W * s, oy + NODE[n][1] * IMG_H * s];
const RX = n => NODE[n][2] * IMG_W * s, RY = n => NODE[n][3] * IMG_H * s;
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const inside = (n, x, y) => { const [cx, cy] = P(n); return Math.hypot((x - cx) / RX(n), (y - cy) / RY(n)); };   // 1 = on the edge
function edge(n, dx, dy, gap){                           // point on node n's ellipse in unit direction (dx, dy), plus a gap
  const [cx, cy] = P(n), r = 1 / Math.hypot(dx / RX(n), dy / RY(n)) + gap;
  return [cx + dx * r, cy + dy * r];
}

function glow(x, y, r, c, a){
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(c, .55 * a)); g.addColorStop(.6, rgba(c, .25 * a)); g.addColorStop(1, rgba(c, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
function along(pts, f){                                  // point at fraction f along a polyline
  const seg = pts.slice(1).map((p, i) => Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]));
  let d = f * seg.reduce((a, b) => a + b, 0);
  for(let i = 0; i < seg.length; i++){ if(d <= seg[i]){ const t = seg[i] ? d / seg[i] : 0;
    return [pts[i][0] + (pts[i+1][0] - pts[i][0]) * t, pts[i][1] + (pts[i+1][1] - pts[i][1]) * t]; } d -= seg[i]; }
  return pts[pts.length - 1];
}
function link(a, b, c, alpha){                           // edge-to-edge line with a small arrowhead, a -> b
  const [ax, ay] = P(a), [bx, by] = P(b), L = Math.hypot(bx - ax, by - ay); if(!L) return;
  const dx = (bx - ax) / L, dy = (by - ay) / L, g = 3 * s, w = Math.max(4, 7 * s), hd = w * 2.2;
  const [x0, y0] = edge(a, dx, dy, g), [x1, y1] = edge(b, -dx, -dy, g);
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = ctx.fillStyle = rgba(c, .9);
  ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - dx * hd * .8, y1 - dy * hd * .8); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - dx * hd - dy * hd * .6, y1 - dy * hd + dx * hd * .6);
  ctx.lineTo(x1 - dx * hd + dy * hd * .6, y1 - dy * hd - dx * hd * .6); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function ring(n, c, alpha){                              // the node lit: a colored ring just outside its outline, faint tint inside
  const [x, y] = P(n), w = Math.max(3, 5 * s);
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.fillStyle = rgba(c, .10); ctx.beginPath(); ctx.ellipse(x, y, RX(n), RY(n), 0, 0, 7); ctx.fill();
  ctx.strokeStyle = rgba(c, .9); ctx.lineWidth = w;
  ctx.beginPath(); ctx.ellipse(x, y, RX(n) + w * .8, RY(n) + w * .8, 0, 0, 7); ctx.stroke();
  ctx.restore();
}
const SIGHT = [148, 163, 184];                          // light is drawn neutral gray: it is not one of the data colors
function light(a, active, now){                          // rays from the left converge at the pupil and land, inverted, on the back of the eye
  if(a < .01) return;
  const [px, py] = [ox + PUPIL[0] * IMG_W * s, oy + PUPIL[1] * IMG_H * s];
  const [rx, ry] = P('Retina'), back = rx + RX('Retina') * .9, x0 = Math.max(8, ox - W * .14), sp = RY('Retina') * .55;
  const rays = [-2, -1, 0, 1, 2].map(k => [[x0, py + k * sp], [px, py], [back, py - k * sp * .45]]);
  ctx.save(); ctx.globalAlpha = a;
  const beam = ctx.createLinearGradient(x0, 0, px, 0);   // a soft beam behind the rays, brightest at the pupil
  beam.addColorStop(0, rgba(SIGHT, 0)); beam.addColorStop(1, rgba(SIGHT, .28));
  ctx.fillStyle = beam; ctx.beginPath(); ctx.moveTo(x0, py - 2 * sp); ctx.lineTo(px, py); ctx.lineTo(x0, py + 2 * sp); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = rgba(SIGHT, .95); ctx.lineWidth = Math.max(2, 3 * s); ctx.lineCap = 'round';
  rays.forEach(r => { ctx.beginPath(); ctx.moveTo(...r[0]); ctx.lineTo(...r[1]); ctx.stroke(); });
  ctx.globalAlpha = a * .45;                             // fainter inside the eye, so its name stays readable
  rays.forEach(r => { ctx.beginPath(); ctx.moveTo(...r[1]); ctx.lineTo(...r[2]); ctx.stroke(); });
  ctx.restore();
  if(active) rays.forEach((r, k) => {                    // photons, staggered, fading in and out
    const f = (now / PULSE + k * .21) % 1, [x, y] = along(r, f);
    ctx.save(); ctx.globalAlpha = Math.sin(Math.PI * f) * .85; ctx.fillStyle = '#475569';
    ctx.beginPath(); ctx.arc(x, y, Math.max(4, 6 * s), 0, 7); ctx.fill(); ctx.restore();
  });
  ring('Retina', COL.early, a);                          // the retina it lands on
  if(active){                                            // the landing strip on the back wall, breathing gently
    const br = .55 + .45 * Math.sin(now / 700);
    ctx.save(); ctx.globalAlpha = a * br; ctx.strokeStyle = rgba(COL.early, .9); ctx.lineWidth = Math.max(4, 7 * s); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.ellipse(rx, ry, RX('Retina') * .9, RY('Retina') * .9, 0, -.55, .55); ctx.stroke(); ctx.restore();
  }
}
function layer(name, a, active, now){
  if(a < .01) return;
  const c = COL[name];
  PATHS[name].forEach(path => {
    path.slice(1).forEach((n, k) => link(path[k], n, c, a));
    path.forEach(n => ring(n, c, a));
    if(active){                                          // one soft pulse per traversal, fading in and out, hidden inside nodes
      const f = (now / PULSE) % 1, [x, y] = along(path.map(P), f);
      const vis = Math.sin(Math.PI * f) * Math.min(...path.map(n => sstep((inside(n, x, y) - 1) / .5)));
      if(vis > .01) glow(x, y, IMG_W * s * .045, c, vis);
    }
  });
  if(LABELS[name]){                                      // ink label with a color swatch, outside the figure
    const [txt, v] = LABELS[name], x = ox + IMG_W * s + W * .025, y = oy + v * IMG_H * s;
    const fs = Math.max(22, W * .026), r = fs * .32;
    ctx.save(); ctx.globalAlpha = Math.min(1, a * 1.4);
    ctx.fillStyle = rgba(c, 1); ctx.beginPath(); ctx.arc(x + r, y - fs * .34, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#0f172a'; ctx.font = `700 ${fs}px Calibri, Carlito, 'Helvetica Neue', Arial, sans-serif`;
    ctx.textBaseline = 'alphabetic'; ctx.fillText(txt, x + r * 2 + fs * .35, y); ctx.restore();
  }
}
function frame(now){
  requestAnimationFrame(frame);                                 // schedule first: one bad frame must not stop the loop
  if(cv.clientWidth !== W || cv.clientHeight !== H) size();   // the deck preloads scenes hidden (size 0)
  const p = ease(Math.min(1, (now - t0) / DUR)), T = LEVEL(beat);
  for(const k in T) cur[k] = from[k] + (T[k] - from[k]) * p;
  if(!W || !H) return;                                          // hidden: nothing to draw (and every path has length 0)
  ctx.clearRect(0, 0, W, H);
  if(img.complete && cur.fig > .01){ ctx.globalAlpha = cur.fig; ctx.drawImage(img, ox, oy, IMG_W * s, IMG_H * s); ctx.globalAlpha = 1; }
  light(cur.light, ACTIVE(beat).includes('light'), now);
  ['early', 'what', 'where'].forEach(k => layer(k, cur[k], ACTIVE(beat).includes(k), now));
}

window.visualStreams = {
  advance(){ if(beat < N) go(beat + 1); },
  back(){ if(beat > 0) go(beat - 1, true); },
  atStart: () => beat === 0,
  atEnd: () => beat === N,
  reset(){ go(0, true); },
  resetToEnd(){ go(N, true); },
  getBeat: () => beat,
  notes: NOTES
};
if(window.parent === window){
  addEventListener('keydown', e => { if(['ArrowRight', ' ', 'Enter'].includes(e.key)) visualStreams.advance(); if(e.key === 'ArrowLeft') visualStreams.back(); });
  addEventListener('click', () => visualStreams.advance());
}
go(0, true); requestAnimationFrame(frame);
</script>
</body>
</html>
