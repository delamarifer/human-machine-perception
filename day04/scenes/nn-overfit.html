<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overfitting</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../deck/deck.css">
<style>
  /* Owner: nn-scenes part (Day 4). Every number from ../assets/nn/overfit.js: the digit network of the
     previous scenes, trained on 100 and on 1,300 digits (train_overfit.py). Works alone too. */
  html, body{ background:#fff; }
  body.jump *{ transition:none !important; }
  .wrap{ position:absolute; inset:0; padding:9vh 5vw 12vh; display:flex; flex-direction:column; gap:1.5vh; }
  .stagebox{ position:relative; flex:1 1 auto; min-height:0; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; }
  .nn-cap{ min-height:1.4em; }
  .dots{ position:fixed; right:2vw; bottom:12px; display:flex; gap:6px; }
  .dots i{ width:7px; height:7px; border-radius:50%; background:#e2e8f0; }
  .dots i.on{ background:#64748b; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="t deck-title">Overfitting</h1>
  <div class="stagebox"><canvas id="cv"></canvas></div>
  <div class="lead nn-cap" id="cap"></div>
  <div class="cite">The digit network's real training runs, on 100 and on 1,300 training digits · digits: UCI via scikit-learn</div>
</div>
<div class="dots" id="dots"></div>
<script src="../assets/nn/overfit.js"></script>
<script>
/* ACT 0  TITLE  (0):   the title alone
   ACT 1  MEMORIZE (1-3): trained on only 100 digits: the training loss goes to almost zero; the loss on the
                        test digits stops falling and creeps back up; accuracy: all training digits right,
                        far fewer new ones
   ACT 2  MORE DATA (4): the same network on 1,300 digits: the test loss stays far lower

   Loss on a log axis. Solid = training digits, dashed = test digits. Ink = 100 digits, grey = 1,300. */
const O = OVERFIT, S = O.runs['100'], F = O.runs['1300'];
const last = r => r[r.length - 1], pct = v => Math.round(v * 100) + '%';
const best = S.reduce((a, q) => q[3] < a[3] ? q : a);
const CAPS = ['', 'Trained on only 100 digits: the training loss goes to almost zero',
  `On ${O.ntest} new digits, the loss stops falling after step ${best[0]} and creeps back up`,
  `${pct(last(S)[2])} right on its training digits, ${pct(last(S)[4])} on new ones: it memorized`,
  `The same network on 1,300 digits: ${pct(last(F)[4])} on new ones`];
const NOTES = [
  "(draft) Title only. Walking downhill on the training loss is not the whole story. What we really care about is digits the network has never seen.",
  "(draft) Here is our same digit network, trained on only 100 handwritten digits. The solid line is the loss on those 100 training digits. It goes all the way down to almost zero.",
  "(draft) The dashed line is the loss on " + O.ntest + " test digits the network never trains on. It falls at first, then stops falling after about step " + best[0] + ", and slowly creeps back up, while the training loss keeps going down. From then on the network is learning things that are true of these 100 digits but not of handwriting in general. That is overfitting.",
  "(draft) In accuracy: it gets " + pct(last(S)[2]) + " of its training digits right, and only " + pct(last(S)[4]) + " of the new ones. It memorized its examples instead of learning what makes a 3 a 3.",
  "(draft) The simplest cure is more data. The same network, same starting weights, trained on 1,300 digits instead of 100: the test loss stays much lower, and it gets " + pct(last(F)[4]) + " of new digits right. Other cures: stop training early, at the bottom of the dashed curve, or make the model simpler."
];
const N = NOTES.length - 1;

const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let beat = 0, t0 = 0, W = 0, H = 0;
function size(){ const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', size);
function go(b, instant){
  beat = b; t0 = instant ? -1e9 : performance.now();
  document.getElementById('cap').textContent = CAPS[b];
  document.getElementById('dots').innerHTML = [...Array(N)].map((_, k) => `<i class="${k < b ? 'on' : ''}"></i>`).join('');
}
function jump(){ document.body.classList.add('jump'); requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('jump'))); }
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);

const all = [...S, ...F].flatMap(q => [q[1], q[3]]).filter(v => v > 0);
const LO = Math.log10(Math.min(...all)), HI = Math.log10(Math.max(...all));
function frame(now){
  if(!W) size();
  ctx.clearRect(0, 0, W, H);
  const p = ease((now - t0) / 1400);                             // newest curve draws itself on the click
  const x0 = W * .1, x1 = W * .72, y0 = H * .9, y1 = H * .06;
  const X = s => x0 + s / O.steps * (x1 - x0), Y = v => y0 - (Math.log10(v) - LO) / (HI - LO) * (y0 - y1);
  const ink = '#0f172a', grey = '#94a3b8', fs = Math.round(H * .042);
  ctx.font = `${fs}px system-ui, sans-serif`; ctx.lineCap = ctx.lineJoin = 'round';
  if(beat >= 1){
    ctx.strokeStyle = grey; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x0, y1); ctx.lineTo(x0, y0); ctx.lineTo(x1, y0); ctx.stroke();
    ctx.fillStyle = '#64748b'; ctx.textAlign = 'left'; ctx.fillText('loss (log scale)', x0 + 8, y1 - 4);
    ctx.textAlign = 'center'; ctx.fillText('training step', (x0 + x1) / 2, y0 + fs * 1.4);
    ctx.textAlign = 'right'; ctx.fillText('0', x0, y0 + fs * 1.4); ctx.textAlign = 'left'; ctx.fillText(String(O.steps), x1 - fs, y0 + fs * 1.4);
  }
  const curve = (R, col, k, dash, frac, label) => {
    const n = Math.max(2, Math.round(R.length * frac));
    ctx.strokeStyle = col; ctx.lineWidth = 3.5; ctx.setLineDash(dash ? [10, 8] : []);
    ctx.beginPath(); R.slice(0, n).forEach((q, i) => i ? ctx.lineTo(X(q[0]), Y(q[k])) : ctx.moveTo(X(q[0]), Y(q[k]))); ctx.stroke();
    ctx.setLineDash([]);
    if(frac >= 1){ const q = last(R); ctx.fillStyle = col; ctx.textAlign = 'left'; ctx.fillText(label, X(q[0]) + 12, Y(q[k]) + fs * .35); }
  };
  if(beat >= 1) curve(S, ink, 1, false, beat === 1 ? p : 1, '100 digits: training');
  if(beat >= 2) curve(S, ink, 3, true, beat === 2 ? p : 1, '100 digits: new digits');
  if(beat >= 2){                                                // the lowest point of the test loss
    ctx.globalAlpha = beat === 2 ? ease((now - t0 - 1400) / 400) : 1;
    ctx.fillStyle = '#b45309'; ctx.beginPath(); ctx.arc(X(best[0]), Y(best[3]), H * .012, 0, 2 * Math.PI); ctx.fill();
    ctx.globalAlpha = 1;
  }
  if(beat >= 4){
    curve(F, grey, 1, false, p, '1,300 digits: training');
    curve(F, grey, 3, true, p, '1,300 digits: new digits');
  }
  requestAnimationFrame(frame);
}

window.nnOverfit = {
  advance(){ if(beat < N) go(beat + 1); },
  back(){ if(beat > 0) go(beat - 1, true); },
  atStart: () => beat === 0,
  atEnd: () => beat === N,
  reset(){ jump(); go(0, true); },
  resetToEnd(){ jump(); go(N, true); },
  getBeat: () => beat,
  notes: NOTES
};
if(window.parent === window){
  addEventListener('keydown', e => { if(['ArrowRight', ' ', 'Enter'].includes(e.key)) nnOverfit.advance(); if(e.key === 'ArrowLeft') nnOverfit.back(); });
  addEventListener('click', () => nnOverfit.advance());
}
go(0, true); requestAnimationFrame(frame);
if(location.hash === '#end') nnOverfit.resetToEnd();
</script>
</body>
</html>
